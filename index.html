      {aberto && (children || (vazio && <Vazio>{vazio}</Vazio>))}
    </section>
  );
}

/** Gráfico de área empilhada em SVG puro: funciona no chat e no site publicado,
    sem depender de biblioteca de gráficos. */
function Evolucao({ dados, series, altura = 200 }) {
  const [ativo, setAtivo] = useState(null);
  if (dados.length < 2) return <Vazio>Precisa de pelo menos dois meses de histórico.</Vazio>;

  const L = 44, R = 8, T = 10, B = 26, W = 620;
  const areaL = W - L - R, areaA = altura - T - B;
  const teto = Math.max(1, ...dados.map((p) => series.reduce((s, x) => s + (p[x.chave] || 0), 0)));
  const passo = (() => { const b = teto / 3, e = Math.pow(10, Math.floor(Math.log10(b))); return Math.ceil(b / e) * e; })();
  const topo = Math.ceil(teto / passo) * passo;
  const x = (i) => L + (dados.length === 1 ? areaL / 2 : (i / (dados.length - 1)) * areaL);
  const y = (v) => T + areaA - (v / topo) * areaA;

  // acumula as séries para empilhar
  const camadas = series.map((s, si) => dados.map((p, i) => {
    const base = series.slice(0, si).reduce((acc, o) => acc + (p[o.chave] || 0), 0);
    return { i, base, topoV: base + (p[s.chave] || 0) };
  }));

  return (
    <div className="w-full">
      <svg viewBox={`0 0 ${W} ${altura}`} className="w-full" role="img" aria-label="Evolução do seu dinheiro mês a mês">
        {Array.from({ length: Math.round(topo / passo) + 1 }, (_, n) => n * passo).map((v) => (
          <g key={v}>
            <line x1={L} y1={y(v)} x2={W - R} y2={y(v)} stroke={C.line} strokeWidth="1" />
            <text x={L - 6} y={y(v) + 3} textAnchor="end" style={{ fontSize: 9, fill: C.muted, fontFamily: MONO }}>
              {v >= 1000 ? (v / 1000).toFixed(v % 1000 ? 1 : 0) + "k" : v}
            </text>
          </g>
        ))}

        {camadas.map((pts, si) => (
          <path key={series[si].chave} fill={series[si].cor} opacity={ativo == null ? 0.85 : 0.35}
            d={pts.map((p, i) => `${i ? "L" : "M"}${x(i)} ${y(p.topoV)}`).join(" ") + " " +
               pts.slice().reverse().map((p) => `L${x(p.i)} ${y(p.base)}`).join(" ") + " Z"} />
        ))}

        {dados.map((p, i) => (
          <g key={p.mes} onMouseEnter={() => setAtivo(i)} onMouseLeave={() => setAtivo(null)} onTouchStart={() => setAtivo(i)}>
            <rect x={x(i) - areaL / (dados.length * 2)} y={T} width={areaL / dados.length} height={areaA} fill="transparent" style={{ cursor: "pointer" }} />
            {ativo === i && <line x1={x(i)} y1={T} x2={x(i)} y2={T + areaA} stroke={C.ink} strokeWidth="1" strokeDasharray="3 3" />}
            {(i === 0 || i === dados.length - 1 || dados.length <= 8 || ativo === i) && (
              <text x={x(i)} y={altura - 8} textAnchor="middle" style={{ fontSize: 9, fill: ativo === i ? C.ink : C.muted }}>
                {mesCurto(p.mes)}
              </text>
            )}
          </g>
        ))}
      </svg>

      <div className="flex flex-wrap justify-center gap-x-4 gap-y-1 mt-1">
        {series.map((s) => (
          <span key={s.chave} style={{ color: C.muted }} className="flex items-center gap-1.5 text-xs">
            <span style={{ background: s.cor }} className="w-2 h-2 rounded-full inline-block" />{s.rot}
          </span>
        ))}
      </div>

      <div style={{ color: ativo == null ? C.muted : C.ink, fontFamily: MONO }} className="text-xs text-center mt-1">
        {ativo == null
          ? `${mesLabel(dados[0].mes)} até ${mesLabel(dados[dados.length - 1].mes)}`
          : `${mesLabel(dados[ativo].mes)} · ${series.map((s) => `${s.rot} ${brl(dados[ativo][s.chave] || 0)}`).join(" · ")}`}
      </div>
    </div>
  );
}

/* ================================================================= agora */
function Agora({ d, setD, bancos, fisicas, saldoConta, pendentes, M, catOf, subOf, contaOf, cartaoOf, pagar, pagarVarios, up, upVarios, flash, anulado, alheio, aCobrar, abrir, verLista, verConta, comDesfazer }) {
  const doMes = pendentes.filter((l) => ym(l.vencimento) <= M).sort((a, b) => a.vencimento.localeCompare(b.vencimento));
  const aReceber = d.lancamentos.filter((l) => l.status === "pendente" && l.tipo === "entrada").sort((a, b) => a.vencimento.localeCompare(b.vencimento));
  const hoje = today();
  const faturas = useMemo(
    () => d.cartoes.map((c) => [c, faturasDoCartao(c, pendentes, hoje)]),
    [d.cartoes, pendentes, hoje]);
  const pagarFatura = (c) => pagarVarios(faturasDoCartao(c, pendentes, hoje).fechada);
  const soma = (ls) => somaC(ls);
  const totFechadas = faturas.reduce((s, [, f]) => s + f.totalFechada, 0);
  const totAbertas = faturas.reduce((s, [, f]) => s + f.totalAberta, 0);
  const cobrancas = useMemo(() => cobrancasPorPessoa(d.lancamentos), [d.lancamentos]);

  /* quais blocos estão abertos. Fica em d.painelAgora: como não é uma das
     COLECOES, é guardado neste aparelho e não viaja para os outros. */
  const fechados = d.painelAgora || [];
  const aberto = (id) => !fechados.includes(id);
  const alternar = (id) => setD({ ...d,
    painelAgora: aberto(id) ? [...fechados, id] : fechados.filter((x) => x !== id) });

  const Grupo = ({ id, titulo, contas }) => (
    <Bloco id={id} titulo={titulo} resumo={brl(somaC(contas, (c) => saldoConta(c.id)))}
      aberto={aberto(id)} alternar={alternar} vazio="Nenhuma conta aqui.">
      {contas.length > 0 && (
      <div className="grid sm:grid-cols-2 gap-2 mb-2">
        {contas.map((c) => (
          <div key={c.id} onClick={() => verConta(c.id)} role="button" tabIndex={0}
            onKeyDown={(e) => (e.key === "Enter" || e.key === " ") && (e.preventDefault(), verConta(c.id))}
            style={{ background: C.surface, borderColor: C.line }}
            className="rounded-xl border px-4 py-3 flex items-center justify-between cursor-pointer">
            <span className="text-sm">{c.nome}</span>
            <span style={{ fontFamily: MONO, color: saldoConta(c.id) < 0 ? C.out : C.ink }} className="font-semibold">{brl(saldoConta(c.id))}</span>
          </div>
        ))}
      </div>
      )}
    </Bloco>
  );

  return (
    <>
      <Grupo id="bancos" titulo="Bancos" contas={bancos} />
      <Grupo id="especie" titulo="Em espécie" contas={fisicas} />

      <Bloco id="cartoes" titulo="Cartões" resumo={brl(totFechadas + totAbertas)} cor={totFechadas ? C.due : C.ink}
        aberto={aberto("cartoes")} alternar={alternar} vazio="Nenhum cartão cadastrado.">
      {d.cartoes.length > 0 && (<>
      <p style={{ color: C.muted }} className="text-xs mb-2">
        a pagar <b style={{ fontFamily: MONO, color: C.due }}>{brl(totFechadas)}</b>
        {" · "}em curso <b style={{ fontFamily: MONO, color: C.ink }}>{brl(totAbertas)}</b>
      </p>
      <div className="grid sm:grid-cols-2 gap-2 mb-2">
        {faturas.map(([c, f]) => {
          const lsF = f.fechada, tf = f.totalFechada;
          const lsA = f.aberta, ta = f.totalAberta;
          const proxFecha = f.proximoFecha;
          return (
            <div key={c.id} style={{ background: C.surface, borderColor: C.line }} className="rounded-xl border px-4 py-3">
              <div className="flex items-center justify-between mb-2">
                <span className="text-sm flex items-center gap-1.5"><CreditCard size={14} /> {c.nome}
                  {c.dono !== "eu" && <span style={{ color: C.muted }} className="text-xs">· {c.dono}</span>}</span>
                <span style={{ color: C.muted }} className="text-xs">fecha {c.fecha} · vence {c.vence}</span>
              </div>

              <div className="flex items-center justify-between cursor-pointer" role="button" tabIndex={0}
                onClick={() => verLista({ titulo: `${c.nome} · fatura fechada`, sub: `Vence dia ${c.vence}`, itens: lsF })}>
                <span style={{ color: C.muted }} className="text-xs">fatura fechada</span>
                <div className="flex items-center gap-2">
                  <span style={{ fontFamily: MONO, color: tf ? C.due : C.muted }} className="font-semibold text-sm">{brl(tf)}</span>
                  {tf > 0 && <button onClick={() => pagarFatura(c)} style={{ borderColor: C.line }} className="rounded-lg border px-2 py-0.5 text-xs">Pagar</button>}
                </div>
              </div>
              {f.fechadaDeOutros > 0 && (
                <p style={{ color: C.tr }} className="text-xs mt-0.5">
                  seu {brl(tf - f.fechadaDeOutros)} · de outros {brl(f.fechadaDeOutros)}
                </p>
              )}

              <div style={{ borderColor: C.line }} className="flex items-center justify-between mt-1.5 pt-1.5 border-t cursor-pointer"
                role="button" tabIndex={0}
                onClick={() => verLista({ titulo: `${c.nome} · fatura em curso`, sub: proxFecha ? `Fecha em ${proxFecha.slice(8)}/${proxFecha.slice(5, 7)}` : undefined, itens: lsA })}>
                <span style={{ color: C.muted }} className="text-xs">
                  em curso{proxFecha && <> · fecha {proxFecha.slice(8)}/{proxFecha.slice(5, 7)}</>}
                </span>
                <span style={{ fontFamily: MONO }} className="font-semibold text-sm">{brl(ta)}</span>
              </div>
              {f.abertaDeOutros > 0 && (
                <p style={{ color: C.tr }} className="text-xs mt-0.5">
                  seu {brl(ta - f.abertaDeOutros)} · de outros {brl(f.abertaDeOutros)}
                </p>
              )}
            </div>
          );
        })}
      </div>
      </>)}
      </Bloco>

      {cobrancas.length > 0 && (
        <Bloco id="cobrar" titulo="A cobrar" resumo={brl(somaC(cobrancas.flatMap(([, ls]) => ls)))} cor={C.tr}
          aberto={aberto("cobrar")} alternar={alternar}>
          <p style={{ color: C.muted }} className="text-sm mb-3">Compras de outras pessoas no seu cartão. Entram na fatura, mas não são gasto seu.</p>
          <div className="space-y-2 mb-2">
            {cobrancas.map(([quem, ls]) => (
              <div key={quem} style={{ background: C.surface, borderColor: C.tr }} className="rounded-xl border px-4 py-3">
                <div className="flex items-center justify-between mb-2">
                  <span className="text-sm font-medium">{quem}</span>
                  <span style={{ fontFamily: MONO, color: C.tr }} className="font-bold">{brl(soma(ls))}</span>
                </div>
                <div className="space-y-1 mb-2">
                  {ls.sort((a, b) => a.vencimento.localeCompare(b.vencimento)).map((l) => (
                    <div key={l.id} className="flex justify-between text-xs" style={{ color: C.muted }}>
                      <span>{l.vencimento.slice(8)}/{l.vencimento.slice(5, 7)} · {l.nome}
                        {l.parcelas && <> · {l.parcela}/{l.parcelas}</>}</span>
                      <span style={{ fontFamily: MONO }}>{brl(l.valor)}</span>
                    </div>
                  ))}
                </div>
                <div className="flex gap-2">
                  <button onClick={() => { navigator.clipboard?.writeText(
                    `${ls.map((l) => `${l.nome} — ${brl(l.valor)}`).join("\n")}\nTotal: ${brl(soma(ls))}`); flash("Lista copiada"); }}
                    style={{ borderColor: C.line }} className="flex-1 rounded-lg border py-1.5 text-xs">Copiar lista</button>
                  <button onClick={() => comDesfazer(`${quem} acertou ${brl(soma(ls))}`, () => upVarios(ls, { reembolso: "recebido" }))}
                    style={{ background: C.tr }} className="flex-1 rounded-lg py-1.5 text-xs text-white">{quem} me pagou</button>
                </div>
              </div>
            ))}
          </div>
        </Bloco>
      )}

      <Bloco id="apagar" titulo="A pagar neste mês" resumo={brl(somaC(doMes))} cor={doMes.length ? C.due : C.muted}
        aberto={aberto("apagar")} alternar={alternar} vazio="Nada em aberto. Tudo pago por aqui.">
        {doMes.length > 0 && (
          <div className="space-y-2 mb-2">
            {doMes.map((l) => <Linha key={l.id} l={l} {...{ catOf, subOf, contaOf, cartaoOf, anulado, up }} onOpen={() => abrir(l.id)} onPay={() => pagar(l)} plano />)}
          </div>
        )}
      </Bloco>

      {aReceber.length > 0 && (
        <Bloco id="areceber" titulo="A receber" resumo={brl(somaC(aReceber))} cor={C.in}
          aberto={aberto("areceber")} alternar={alternar}>
          <div className="space-y-2 mb-2">
            {aReceber.map((l) => <Linha key={l.id} l={l} {...{ catOf, subOf, contaOf, cartaoOf, anulado, up }} onOpen={() => abrir(l.id)} onPay={() => pagar(l)} plano />)}
          </div>
        </Bloco>
      )}
    </>
  );
}

/* ================================================================ futuro */
function Futuro({ d, setD, catOf, subOf, contaOf, cartaoOf, pagar, despagar, apagar, up, anulado, flash, abrir }) {
  const [janela, setJanela] = useState(12);
  const [de, setDe] = useState("");
  const [ate, setAte] = useState("");
  const [nome, setNome] = useState("");
  const [valor, setValor] = useState("");

  const limite = de && ate ? null : addMonths(today(), janela).slice(0, 7);
  const lista = d.lancamentos.filter((l) => {
    if (l.tipo === "entrada") return false;
    const k = ym(l.vencimento);
    if (k < mesAtual() && l.status === "pago") return false;
    if (de && ate) return k >= de && k <= ate;
    return k <= limite && k >= mesAtual();
  });

  const meses = useMemo(() => {
    const m = {};
    lista.forEach((l) => { const k = ym(l.vencimento); (m[k] = m[k] || []).push(l); });
    return Object.entries(m).sort((a, b) => a[0].localeCompare(b[0]));
  }, [d, janela, de, ate]);
  const max = Math.max(1, ...meses.map(([, ls]) => ls.filter((l) => l.status === "pendente").reduce((s, l) => s + emC(l.valor), 0) / 100));

  const addIntencao = () => {
    const v = num(valor); if (!nome || v <= 0) return;
    setD({ ...d, intencoes: [...(d.intencoes || []), { id: uid(), nome, valor: v, obs: "" }] });
    setNome(""); setValor("");
  };
  const virarConta = (i) => {
    setD({ ...d, intencoes: d.intencoes.filter((x) => x.id !== i.id),
      lancamentos: [{ id: uid(), tipo: "saida", nome: i.nome, valor: i.valor, catId: "outros", forma: "Pix",
        contaId: "nubank", vencimento: addMonths(today(), 1), pagamento: null, status: "pendente", obs: "", reembolso: "nao" }, ...d.lancamentos] });
    flash("Virou conta prevista — ajuste a data em Mais detalhes");
  };
  const totIntencoes = somaC(d.intencoes || []);

  /* meses recolhidos: por padrão só o primeiro fica aberto, para a tela
     não abrir com dezenas de linhas de uma vez */
  const [recolhidos, setRecolhidos] = useState(null);
  const chaves = meses.map(([k]) => k);
  const efetivos = recolhidos ?? chaves.slice(1);
  const alterna = (k) => setRecolhidos(efetivos.includes(k) ? efetivos.filter((x) => x !== k) : [...efetivos, k]);
  const todosAbertos = efetivos.length === 0;

  return (
    <>
      <h2 style={{ fontFamily: DISPLAY }} className="text-lg font-bold mb-1">O que já está comprometido</h2>
      <p style={{ color: C.muted }} className="text-sm mb-3">Contas fixas, previstas e parcelas. Parcela adiantada continua no mês dela, marcada como paga.</p>

      <div className="flex flex-wrap items-center gap-2 mb-4">
        {[3, 4, 6, 12].map((n) => (
          <Chip key={n} ativo={!de && janela === n} cor={C.ink} onClick={() => { setJanela(n); setDe(""); setAte(""); }}>{n} meses</Chip>
        ))}
        <input type="month" value={de} onChange={(e) => setDe(e.target.value)} style={{ background: C.surface, borderColor: C.line }}
          className="rounded-full border px-3 py-1.5 text-xs outline-none" />
        <span style={{ color: C.muted }} className="text-xs">até</span>
        <input type="month" value={ate} onChange={(e) => setAte(e.target.value)} style={{ background: C.surface, borderColor: C.line }}
          className="rounded-full border px-3 py-1.5 text-xs outline-none" />
      </div>

      {meses.length === 0 && <Vazio>Nenhum compromisso nesse intervalo.</Vazio>}
      {meses.length > 1 && (
        <div className="flex justify-end mb-2">
          <button onClick={() => setRecolhidos(todosAbertos ? chaves : [])}
            style={{ color: C.tr }} className="text-xs underline underline-offset-2">
            {todosAbertos ? "recolher todos" : "expandir todos"}
          </button>
        </div>
      )}
      <div className="space-y-3">
        {meses.map(([k, ls], i) => {
          const tot = ls.filter((l) => l.status === "pendente").reduce((s, l) => s + emC(l.valor), 0) / 100;
          const aberto = !efetivos.includes(k);
          const pagas = ls.filter((l) => l.status === "pago").length;
          return (
            <div key={k} style={{ background: C.surface, borderColor: C.line }} className="rounded-2xl border">
              <div onClick={() => alterna(k)} role="button" tabIndex={0}
                onKeyDown={(e) => (e.key === "Enter" || e.key === " ") && (e.preventDefault(), alterna(k))}
                className="p-4 cursor-pointer">
                <div className="flex items-baseline justify-between mb-2 gap-2">
                  <span style={{ fontFamily: DISPLAY }} className="font-bold capitalize flex items-center gap-1.5">
                    <ChevronDown size={16} style={{ color: C.muted, transform: aberto ? "none" : "rotate(-90deg)" }} />
                    {mesLabel(k)}
                  </span>
                  <span className="flex items-baseline gap-2">
                    <span style={{ color: C.muted }} className="text-xs">
                      {ls.length} {ls.length === 1 ? "conta" : "contas"}{pagas ? ` · ${pagas} paga${pagas > 1 ? "s" : ""}` : ""}
                    </span>
                    <span style={{ fontFamily: MONO, color: C.due }} className="font-semibold">{brl(tot)}</span>
                  </span>
                </div>
                <div style={{ background: C.bg }} className="h-1.5 rounded-full overflow-hidden">
                  <div style={{ background: C.due, width: `${(tot / max) * 100}%` }} className="h-full" />
                </div>
              </div>
              {aberto && (
                <div className="space-y-2 px-4 pb-4">
                  {ls.slice().sort((a, b) => a.vencimento.localeCompare(b.vencimento)).map((l) => (
                    <Linha key={l.id} l={l} {...{ catOf, subOf, contaOf, cartaoOf, anulado, up }} onOpen={() => abrir(l.id)} plano
                      onPay={l.status === "pendente" ? () => pagar(l) : null}
                      onUndo={l.status === "pago" ? () => despagar(l.id) : null}
                      onDel={() => apagar(l.id)} />
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>

      <div className="flex items-baseline justify-between mt-8 mb-2">
        <h2 style={{ fontFamily: DISPLAY }} className="text-lg font-bold flex items-center gap-2"><Lightbulb size={18} /> Intenções</h2>
        <span style={{ fontFamily: MONO, color: C.muted }} className="text-sm">{brl(totIntencoes)}</span>
      </div>
      <p style={{ color: C.muted }} className="text-sm mb-3">Coisas que você quer reservar dinheiro para fazer. Não têm data e não entram no comprometido.</p>
      <div className="space-y-2 mb-3">
        {(d.intencoes || []).map((i) => (
          <div key={i.id} style={{ background: C.surface, borderColor: C.line }} className="rounded-xl border px-3 py-2.5 flex items-center gap-3">
            <span className="flex-1 text-sm">{i.nome}</span>
            <span style={{ fontFamily: MONO }} className="text-sm font-semibold">{brl(i.valor)}</span>
            <button onClick={() => virarConta(i)} style={{ borderColor: C.line }} className="rounded-lg border px-2 py-1 text-xs">virar conta</button>
            <button onClick={() => setD({ ...d, intencoes: d.intencoes.filter((x) => x.id !== i.id) })} style={{ color: C.muted }}><Trash2 size={14} /></button>
          </div>
        ))}
      </div>
      <div className="flex gap-2">
        <input value={nome} onChange={(e) => setNome(e.target.value)} placeholder="O que você quer fazer"
          style={{ background: C.surface, borderColor: C.line }} className="flex-1 rounded-xl border px-3 py-2 text-sm outline-none" />
        <input value={valor} onChange={(e) => setValor(e.target.value)} placeholder="Valor" inputMode="decimal"
          onKeyDown={(e) => e.key === "Enter" && addIntencao()}
          style={{ background: C.surface, borderColor: C.line }} className="w-24 rounded-xl border px-3 py-2 text-sm outline-none" />
        <button onClick={addIntencao} style={{ background: C.ink, color: "#fff" }} className="px-4 rounded-xl text-sm">Anotar</button>
      </div>
    </>
  );
}

/* ============================================================== guardado */
function Guardado({ d, setD, guardadas, investidas, saldoConta, totalGuardado, totalInvestido, flash, verConta }) {
  const [mov, setMov] = useState(null);
  const [v, setV] = useState("");
  const [origem, setOrigem] = useState("nubank");
  const liquidas = d.contas.filter((c) => c.tipo === "banco" || c.tipo === "fisico");

  const transferir = (destinoId, sentido) => {
    const n = num(v); if (n <= 0) return;
    const de = sentido > 0 ? origem : destinoId, para = sentido > 0 ? destinoId : origem;
    setD({ ...d, lancamentos: [{ id: uid(), tipo: "transferencia", nome: sentido > 0 ? "Guardei" : "Retirei",
      valor: n, forma: "Pix", contaId: de, destinoId: para, vencimento: today(), pagamento: today(),
      status: "pago", obs: "", reembolso: "nao" }, ...d.lancamentos] });
    setMov(null); setV(""); flash(sentido > 0 ? "Guardado" : "Retirado");
  };

  const Secao = ({ titulo, contas, total, cor }) => (
    <div className="mb-6">
      <div className="flex items-baseline justify-between mb-2">
        <h2 style={{ fontFamily: DISPLAY }} className="text-lg font-bold">{titulo}</h2>
        <span style={{ fontFamily: MONO, color: cor }} className="font-semibold">{brl(total)}</span>
      </div>
      <div className="space-y-2">
        {contas.map((c) => (
          <div key={c.id} style={{ background: C.surface, borderColor: C.line }} className="rounded-xl border p-4">
            <div className="flex items-center justify-between">
              <div onClick={() => verConta(c.id)} role="button" tabIndex={0}
                onKeyDown={(e) => (e.key === "Enter" || e.key === " ") && (e.preventDefault(), verConta(c.id))}
                className="cursor-pointer flex-1 min-w-0">
                <div className="text-sm font-medium">{c.nome}</div>
                {c.objetivo && <div style={{ color: C.muted }} className="text-xs">{c.objetivo}</div>}</div>
              <div className="flex items-center gap-3">
                <span onClick={() => verConta(c.id)} style={{ fontFamily: MONO }} className="font-semibold cursor-pointer">{brl(saldoConta(c.id))}</span>
                <button onClick={() => setMov(mov === c.id ? null : c.id)} style={{ borderColor: C.line }} className="rounded-lg border px-2 py-1 text-xs">mover</button>
              </div>
            </div>
            {(() => {
              const p = progressoCaixinha(d, c);
              if (!p.meta) return p.ritmo > 0 ? (
                <p style={{ color: C.muted }} className="text-xs mt-2">
                  guardando {brl(p.ritmo)} por mês · defina uma meta em Ajustes para ver a previsão
                </p>
              ) : null;
              return (
                <div className="mt-3">
                  <div className="flex items-baseline justify-between mb-1">
                    <span style={{ color: C.muted }} className="text-xs">
                      meta {brl(p.meta)}{c.prazo && ` até ${mesLabel(c.prazo)}`}
                    </span>
                    <span style={{ fontFamily: MONO, color: p.pct === 100 ? C.in : C.saved }} className="text-xs font-semibold">{p.pct}%</span>
                  </div>
                  <div style={{ background: C.bg }} className="h-2 rounded-full overflow-hidden">
                    <div style={{ background: p.pct === 100 ? C.in : C.saved, width: `${p.pct}%`, transition: "width .3s" }} className="h-full" />
                  </div>
                  <p style={{ color: p.atrasada ? C.due : C.muted }} className="text-xs mt-1.5">
                    {p.faltam === 0
                      ? "Meta alcançada."
                      : <>Faltam {brl(p.faltam)}.{" "}
                          {p.ritmo > 0
                            ? <>No seu ritmo de {brl(p.ritmo)} por mês, chega em <b>{mesLabel(p.previsao)}</b>.</>
                            : "Ainda não há histórico para prever quando."}
                          {p.precisaPorMes != null && (
                            <> Para o prazo, precisaria de <b>{brl(p.precisaPorMes)}</b> por mês
                              {p.atrasada ? " — acima do ritmo atual." : "."}</>
                          )}
                        </>}
                  </p>
                </div>
              );
            })()}

            {mov === c.id && (
              <div className="mt-3">
                <div className="flex flex-wrap gap-2 mb-2">
                  {liquidas.map((o) => <Chip key={o.id} ativo={origem === o.id} cor={C.tr} onClick={() => setOrigem(o.id)}>{o.nome}</Chip>)}
                </div>
                <div className="flex gap-2">
                  <input value={v} onChange={(e) => setV(e.target.value)} inputMode="decimal" placeholder="0,00"
                    style={{ background: C.bg, borderColor: C.line, fontFamily: MONO }} className="flex-1 rounded-lg border px-3 py-2 text-sm outline-none" />
                  <button onClick={() => transferir(c.id, 1)} style={{ background: C.tr, color: "#fff" }} className="px-3 rounded-lg text-sm">Guardar</button>
                  <button onClick={() => transferir(c.id, -1)} style={{ background: C.ink, color: "#fff" }} className="px-3 rounded-lg text-sm">Retirar</button>
                </div>
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );

  return (<>
    <Secao titulo="Caixinhas" contas={guardadas} total={totalGuardado} cor={C.saved} />
    <Secao titulo="Investimentos" contas={investidas} total={totalInvestido} cor={C.inv} />
  </>);
}

/* =========================================================== relatórios */
function Relatorio({ d, catOf, anulado, alheio, M, verLista, flash }) {
  const fora = (l) => anulado(l) || alheio(l);   // não conta como gasto seu
  const historico = useMemo(() => mesesComMovimento(d, 12), [d.lancamentos]);
  const linhaTempo = useMemo(() => evolucao(d, historico), [d, historico]);
  const resumo = useMemo(() => resumoDoMes(d, M, catOf), [d, M]);
  const comparacao = useMemo(() => compararMeses(d, M, resumo.anterior, catOf), [d, M]);

  const gerarRelatorio = () => {
    const contas = d.contas
      .filter((c) => c.tipo === "caixinha" || c.tipo === "investimento")
      .map((c) => ({ ...c, ...progressoCaixinha(d, c) }));
    const html = relatorioHTML({ mes: M, resumo, comparacao, linhaTempo, contas,
      categorias: d.categorias, panorama: panorama(d, M) });
    exportarRelatorio(html, M, flash);
  };
  const [janela, setJanela] = useState(1);
  const [de, setDe] = useState("");
  const [ate, setAte] = useState("");

  /* período avaliado, em meses ------------------------------------------ */
  const periodo = useMemo(() => {
    if (de && ate && de <= ate) {
      const ms = [];
      let k = de + "-01";
      while (ym(k) <= ate) { ms.push(ym(k)); k = addMonths(k, 1); }
      return ms;
    }
    return Array.from({ length: janela }, (_, i) => ym(addMonths(today(), -(janela - 1 - i))));
  }, [janela, de, ate]);

  const dentro = (l) => periodo.includes(ym(l.pagamento || l.vencimento));
  const rotulo = periodo.length === 1 ? mesLabel(periodo[0]) : `${mesLabel(periodo[0])} — ${mesLabel(periodo[periodo.length - 1])}`;

  const pagos = d.lancamentos.filter((l) => l.status === "pago" && l.tipo !== "transferencia" && dentro(l));
  const saidas = pagos.filter((l) => l.tipo === "saida");

  const orcamentos = d.categorias.filter((c) => c.id !== "renda").map((c) => {
    const ls = saidas.filter((l) => l.catId === c.id);
    return { ...c,
      teto: (c.orcamento || 0) * periodo.length,
      gasto: ls.filter((l) => !fora(l)).reduce((s, l) => s + emC(l.valor), 0) / 100,
      reemb: ls.filter((l) => fora(l)).reduce((s, l) => s + emC(l.valor), 0) / 100 };
  }).sort((a, b) => (b.gasto / (b.teto || 1)) - (a.gasto / (a.teto || 1)));

  const totReemb = saidas.filter(fora).reduce((s, l) => s + emC(l.valor), 0) / 100;
  const porCat = orcamentos.filter((c) => c.gasto > 0).map((c) => ({ name: c.nome, value: +c.gasto.toFixed(2), cor: c.cor }));
  if (totReemb > 0) porCat.push({ name: "Não é meu", value: +totReemb.toFixed(2), cor: C.line });

  const doMesK = (k) => d.lancamentos.filter((l) => l.status === "pago" && l.tipo !== "transferencia" && ym(l.pagamento || l.vencimento) === k);

  const porMes = useMemo(() => periodo.map((k) => {
    const ls = doMesK(k);
    return {
      mes: mesLabel(k), chave: k,
      Entrou: +ls.filter((l) => l.tipo === "entrada").reduce((s, l) => s + emC(l.valor), 0) / 100,
      Saiu: +ls.filter((l) => l.tipo === "saida" && !fora(l)).reduce((s, l) => s + emC(l.valor), 0) / 100,
      "Não é meu": +ls.filter((l) => l.tipo === "saida" && fora(l)).reduce((s, l) => s + emC(l.valor), 0) / 100,
    };
  }), [d, periodo]);

  const entrou = pagos.filter((l) => l.tipo === "entrada").reduce((s, l) => s + emC(l.valor), 0) / 100;
  const saiu = saidas.filter((l) => !fora(l)).reduce((s, l) => s + emC(l.valor), 0) / 100;
  const totTeto = somaC(orcamentos, (c) => c.teto);
  const media = (v) => v / periodo.length;

  return (
    <>
      {/* o mês em uma frase ------------------------------------------- */}
      <section style={{ background: C.surface, borderColor: C.line }} className="rounded-2xl border p-4 mb-4 no-print-break">
        <div className="flex items-baseline justify-between mb-3">
          <h2 style={{ fontFamily: DISPLAY }} className="text-lg font-bold capitalize">{mesLabel(M)}</h2>
          <button onClick={gerarRelatorio} style={{ borderColor: C.line, color: C.muted }}
            className="rounded-full border px-3 py-1 text-xs esconder-na-impressao flex items-center gap-1.5">
            <Download size={13} /> Relatório
          </button>
        </div>

        <div className="grid grid-cols-3 gap-3 mb-3">
          <Resumo rot="Entrou" v={resumo.entradas} cor={C.in} />
          <Resumo rot="Saiu" v={resumo.saidas} cor={C.out} />
          <Resumo rot={resumo.sobra >= 0 ? "Sobrou" : "Faltou"} v={Math.abs(resumo.sobra)} cor={resumo.sobra >= 0 ? C.saved : C.out} />
        </div>

        <ul style={{ color: C.muted }} className="text-sm space-y-1">
          {resumo.maior && (
            <li>O que mais pesou foi <b style={{ color: C.ink }}>{resumo.maior.nome}</b>, com {brl(resumo.maior.atual)}.</li>
          )}
          {resumo.subiu && resumo.subiu.delta > 0 && (
            <li><b style={{ color: C.out }}>{resumo.subiu.nome}</b> subiu {brl(resumo.subiu.delta)}
              {resumo.subiu.pct != null && ` (${resumo.subiu.pct}%)`} em relação a {mesLabel(resumo.anterior)}.</li>
          )}
          {resumo.caiu && resumo.caiu.delta < 0 && (
            <li><b style={{ color: C.in }}>{resumo.caiu.nome}</b> caiu {brl(-resumo.caiu.delta)}
              {resumo.caiu.pct != null && ` (${Math.abs(resumo.caiu.pct)}%)`}.</li>
          )}
          {resumo.folga != null && (
            <li>Com o que está guardado, você cobre <b style={{ color: C.ink }}>{resumo.folga} {resumo.folga === 1 ? "mês" : "meses"}</b> no
              seu ritmo de gasto ({brl(resumo.gastoMedio)} por mês).</li>
          )}
        </ul>
      </section>

      {/* como o dinheiro evoluiu --------------------------------------- */}
      {linhaTempo.length >= 2 && (
        <section style={{ background: C.surface, borderColor: C.line }} className="rounded-2xl border p-4 mb-4 no-print-break">
          <h3 style={{ color: C.muted }} className="text-xs uppercase tracking-wider mb-2">Como seu dinheiro cresceu</h3>
          <Evolucao dados={linhaTempo} series={[
            { chave: "liquido", rot: "Em conta", cor: C.in },
            { chave: "guardado", rot: "Guardado", cor: C.saved },
            { chave: "investido", rot: "Investido", cor: C.inv },
          ]} />
        </section>
      )}

      {/* este mês contra o passado -------------------------------------- */}
      {comparacao.length > 0 && (
        <section style={{ background: C.surface, borderColor: C.line }} className="rounded-2xl border p-4 mb-4 no-print-break">
          <h3 style={{ color: C.muted }} className="text-xs uppercase tracking-wider mb-3">
            {mesLabel(M)} contra {mesLabel(resumo.anterior)}
          </h3>
          <div className="space-y-2">
            {comparacao.map((c) => (
              <div key={c.id} onClick={() => verLista({ titulo: c.nome, sub: mesLabel(M),
                  itens: d.lancamentos.filter((l) => l.catId === c.id && l.status === "pago" && ym(l.pagamento || l.vencimento) === M) })}
                role="button" tabIndex={0} className="flex items-center gap-3 cursor-pointer">
                <span style={{ background: c.cor }} className="w-1.5 h-8 rounded-full shrink-0" />
                <span className="text-sm flex-1 min-w-0 truncate">{c.nome}</span>
                <span style={{ fontFamily: MONO, color: C.muted }} className="text-xs shrink-0">{brl(c.antes)}</span>
                <span style={{ color: C.muted }} className="text-xs shrink-0">→</span>
                <span style={{ fontFamily: MONO }} className="text-sm font-semibold shrink-0 w-20 text-right">{brl(c.atual)}</span>
                <span style={{ color: c.delta > 0 ? C.out : c.delta < 0 ? C.in : C.muted, fontFamily: MONO }}
                  className="text-xs shrink-0 w-16 text-right">
                  {c.delta === 0 ? "—" : (c.delta > 0 ? "+" : "") + brl(c.delta).replace("R$ ", "")}
                </span>
              </div>
            ))}
          </div>
        </section>
      )}

      {/* seletor de período ------------------------------------------- */}
      <div className="flex flex-wrap items-center gap-2 mb-2 esconder-na-impressao">
        {[[1, "Este mês"], [3, "3 meses"], [4, "4 meses"], [6, "6 meses"], [12, "12 meses"]].map(([n, t]) => (
          <Chip key={n} ativo={!(de && ate) && janela === n} cor={C.ink} onClick={() => { setJanela(n); setDe(""); setAte(""); }}>{t}</Chip>
        ))}
        <input type="month" value={de} onChange={(e) => setDe(e.target.value)} style={{ background: C.surface, borderColor: C.line }}
          className="rounded-full border px-3 py-1.5 text-xs outline-none" />
        <span style={{ color: C.muted }} className="text-xs">até</span>
        <input type="month" value={ate} onChange={(e) => setAte(e.target.value)} style={{ background: C.surface, borderColor: C.line }}
          className="rounded-full border px-3 py-1.5 text-xs outline-none" />
      </div>
      <p style={{ color: C.muted }} className="text-xs mb-4 capitalize">
        {rotulo}{periodo.length > 1 ? ` · ${periodo.length} meses` : ""}
      </p>

      {/* totais -------------------------------------------------------- */}
      <div className="grid grid-cols-3 gap-2 mb-4">
        {[["Entrou", entrou, C.in], ["Saiu", saiu, C.out], ["Sobrou", entrou - saiu, entrou - saiu < 0 ? C.out : C.ink]].map(([n, v, c]) => (
          <div key={n} style={{ background: C.surface, borderColor: C.line }} className="rounded-xl border p-3">
            <div style={{ color: C.muted }} className="text-xs">{n}</div>
            <div style={{ fontFamily: MONO, color: c }} className="font-semibold text-sm sm:text-base">{brl(v)}</div>
            {periodo.length > 1 && <div style={{ fontFamily: MONO, color: C.muted }} className="text-xs">{brl(media(v))}/mês</div>}
            {n === "Saiu" && totReemb > 0 && <div style={{ fontFamily: MONO, color: C.muted }} className="text-xs">+{brl(totReemb)} não é meu</div>}
          </div>
        ))}
      </div>

      {/* orçamento ----------------------------------------------------- */}
      <div style={{ background: C.surface, borderColor: C.line }} className="rounded-2xl border p-4 mb-4">
        <div className="flex items-baseline justify-between mb-3">
          <h3 style={{ fontFamily: DISPLAY }} className="font-bold">Orçamento por categoria</h3>
          <span style={{ fontFamily: MONO, color: C.muted }} className="text-xs">{brl(saiu)} de {brl(totTeto)}</span>
        </div>
        <div className="space-y-3">
          {orcamentos.map((c) => {
            const pct = c.teto ? Math.min((c.gasto / c.teto) * 100, 100) : 0;
            const estourou = c.teto > 0 && c.gasto > c.teto;
            return (
              <div key={c.id} onClick={() => verLista({
                  titulo: c.nome,
                  sub: `${rotulo} · ${c.teto ? `limite ${brl(c.teto)}` : "sem limite"}`,
                  itens: saidas.filter((l) => l.catId === c.id),
                })}
                role="button" tabIndex={0}
                onKeyDown={(e) => (e.key === "Enter" || e.key === " ") && (e.preventDefault(), verLista({
                  titulo: c.nome, sub: rotulo, itens: saidas.filter((l) => l.catId === c.id) }))}
                className="cursor-pointer">
                <div className="flex items-baseline justify-between text-sm mb-1">
                  <span className="flex items-center gap-2">
                    <span style={{ background: c.cor }} className="w-2.5 h-2.5 rounded-full" />{c.nome}
                    {estourou && <span style={{ color: C.out }} className="text-xs flex items-center gap-0.5"><AlertTriangle size={11} /> estourou</span>}
                  </span>
                  <span style={{ fontFamily: MONO, color: estourou ? C.out : C.muted }} className="text-xs">
                    {brl(c.gasto)}{c.reemb > 0 ? ` (+${brl(c.reemb)} não é meu)` : ""}{c.teto ? ` / ${brl(c.teto)}` : " · sem limite"}
                  </span>
                </div>
                <div style={{ background: C.bg }} className="h-2 rounded-full overflow-hidden flex">
                  <div style={{ background: estourou ? C.out : c.cor, width: `${pct}%` }} className="h-full" />
                  {c.teto > 0 && c.reemb > 0 && (
                    <div style={{ background: C.line, width: `${Math.min((c.reemb / c.teto) * 100, 100 - pct)}%` }} className="h-full" />
                  )}
                </div>
              </div>
            );
          })}
        </div>
        <p style={{ color: C.muted }} className="text-xs mt-3">
          {periodo.length > 1
            ? `Limite mensal multiplicado pelos ${periodo.length} meses do período.`
            : "Reinicia todo dia 1º. O que sobra não acumula."}
        </p>
      </div>

      {/* pizza --------------------------------------------------------- */}
      <div style={{ background: C.surface, borderColor: C.line }} className="rounded-2xl border p-4 mb-4">
        <h3 style={{ fontFamily: DISPLAY }} className="font-bold mb-1">Para onde foi o dinheiro</h3>
        {porCat.length === 0 ? <Vazio>Sem gastos pagos neste período.</Vazio> : (
          <div className="flex flex-col sm:flex-row items-center gap-4">
            <div className="w-full sm:w-52 h-52">
              <Rosca dados={porCat} onFatia={(f) => verLista({ titulo: f.name, sub: rotulo, itens: f.name === "Não é meu" ? saidas.filter(fora) : saidas.filter((l) => catOf(l.catId)?.nome === f.name && !fora(l)) })} />
            </div>
            <div className="flex-1 w-full space-y-1.5">
              {porCat.map((c) => (
                <div key={c.name} className="flex items-center gap-2 text-sm cursor-pointer" role="button" tabIndex={0}
                  onClick={() => verLista({ titulo: c.name, sub: rotulo,
                    itens: c.name === "Não é meu" ? saidas.filter(fora)
                      : saidas.filter((l) => catOf(l.catId)?.nome === c.name && !fora(l)) })}>
                  <span style={{ background: c.cor }} className="w-2.5 h-2.5 rounded-full shrink-0" />
                  <span className="flex-1 truncate">{c.name}</span>
                  <span style={{ fontFamily: MONO, color: C.muted }} className="text-xs">
                    {((c.value / (somaC(porCat, (x) => x.value) || 1)) * 100).toFixed(0)}%
                  </span>
                  <span style={{ fontFamily: MONO }} className="text-xs">{brl(c.value)}</span>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>

      {/* barras -------------------------------------------------------- */}
      <div style={{ background: C.surface, borderColor: C.line }} className="rounded-2xl border p-4">
        <h3 style={{ fontFamily: DISPLAY }} className="font-bold mb-3">Entrou × saiu</h3>
        <div className="h-64">
          <Barras dados={porMes} series={[{ chave: "Entrou", cor: C.in }, { chave: "Saiu", cor: C.out }, { chave: "Não é meu", cor: C.line }]} onColuna={(m) => verLista({ titulo: m.mes, sub: "Tudo que entrou e saiu neste mês", itens: doMesK(m.chave) })} />
        </div>
        <p style={{ color: C.muted }} className="text-xs mt-2">Transferências entre suas contas não aparecem aqui.</p>
      </div>
    </>
  );
}

/* ================================================================ ajustes */
function Ajustes({ d, setD, onClose, flash }) {
  const [aba, setAba] = useState("categorias");
  const set = (patch) => setD({ ...d, ...patch });


  const exportar = () => {
    const blob = new Blob([JSON.stringify(d, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = `caderneta-${today()}.json`; a.click();
  };
  const importar = (e) => {
    const f = e.target.files?.[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const bruto = JSON.parse(r.result);
        const { dados, aplicadas, de } = prepararDados(bruto);
        if (!dados || !Array.isArray(bruto.lancamentos)) { flash("Isto não parece um backup da caderneta"); return; }
        // mantém a configuração deste aparelho: ela não vem no arquivo
        setD({ ...dados, sheetsUrl: d.sheetsUrl, sheetsSegredo: d.sheetsSegredo, painelAgora: d.painelAgora, ateOnde: 0 });
        flash(aplicadas.length
          ? `Importado e convertido da versão ${de}`
          : `Importado: ${dados.lancamentos.length} lançamentos`);
      } catch { flash("Arquivo inválido"); }
    };
    r.readAsText(f);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-6" style={{ background: "rgba(20,24,36,0.45)" }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} style={{ background: C.bg }} className="w-full max-w-lg rounded-t-2xl sm:rounded-2xl p-5 max-h-full overflow-auto">
        <div className="flex items-center justify-between mb-4">
          <h2 style={{ fontFamily: DISPLAY }} className="text-xl font-bold">Ajustes</h2>
          <button onClick={onClose}><X size={20} /></button>
        </div>
        <div className="flex flex-wrap gap-2 mb-4">
          {[["categorias", "Categorias"], ["contas", "Contas"], ["cartoes", "Cartões"], ["recorrentes", "Recorrentes"], ["dados", "Dados"]].map(([k, t]) => (
            <Chip key={k} ativo={aba === k} cor={C.ink} onClick={() => setAba(k)}>{t}</Chip>
          ))}
        </div>
        {aba === "categorias" && <AbaCategorias d={d} set={set} flash={flash} />}
        {aba === "contas" && <AbaContas d={d} set={set} flash={flash} />}
        {aba === "cartoes" && <AbaCartoes d={d} set={set} flash={flash} />}
        {aba === "recorrentes" && <AbaRecorrentes d={d} set={set} flash={flash} />}
        {aba === "dados" && (
          <>
            <Rotulo>Sincronia com a planilha</Rotulo>
            <input value={d.sheetsUrl || ""} onChange={(e) => set({ ...d, sheetsUrl: e.target.value.trim() })}
              placeholder="Cole aqui o endereço do Apps Script"
              style={{ background: C.bg, borderColor: C.line, color: C.ink }} className="w-full rounded-xl border px-3 py-2 text-sm outline-none mb-2" />
            <input value={d.sheetsSegredo || ""} onChange={(e) => set({ ...d, sheetsSegredo: e.target.value.trim() })}
              placeholder="Frase secreta (a mesma do script)"
              style={{ background: C.bg, borderColor: C.line, color: C.ink }} className="w-full rounded-xl border px-3 py-2 text-sm outline-none mb-2" />
            <p style={{ color: C.muted }} className="text-xs mb-3">
              {d.sheetsUrl
                ? "Cada alteração vai para a planilha em segundo plano. Se a internet cair, o app guarda e reenvia sozinho quando voltar."
                : "Sem endereço, os dados ficam só neste aparelho. Exporte o JSON de vez em quando para não depender de um lugar só."}
            </p>
            {d.sheetsUrl && (
              <>
                <button onClick={() => { set({ ateOnde: 0 }); flash("Buscando tudo de novo…"); }}
                  style={{ background: C.surface, borderColor: C.line }}
                  className="w-full rounded-xl border py-2 text-sm flex items-center justify-center gap-1.5 mb-2">
                  <RotateCcw size={15} /> Conferir tudo com a planilha
                </button>
                <p style={{ color: C.muted }} className="text-xs mb-4">
                  O app já traz as novidades sozinho ao abrir e a cada minuto. Use isto só se desconfiar que faltou alguma coisa.
                </p>
              </>
            )}

            <Rotulo>Cópia manual</Rotulo>
            <div className="flex gap-2">
              <button onClick={exportar} style={{ background: C.surface, borderColor: C.line }} className="flex-1 rounded-xl border py-2 text-sm flex items-center justify-center gap-1.5"><Download size={15} /> Exportar JSON</button>
              <label style={{ background: C.surface, borderColor: C.line }} className="flex-1 rounded-xl border py-2 text-sm flex items-center justify-center gap-1.5 cursor-pointer">
                <Upload size={15} /> Importar<input type="file" accept="application/json" onChange={importar} className="hidden" /></label>
            </div>
            <p style={{ color: C.muted }} className="text-xs mt-3">
              O app sempre grava primeiro neste aparelho, por isso nunca trava esperando a internet.
            </p>
          </>
        )}
      </div>
    </div>
  );
}

function AbaCategorias({ d, set, flash }) {
  const [nova, setNova] = useState("");
  const [abertaId, setAberta] = useState(null);
  const [subNome, setSubNome] = useState("");
  const upCat = (id, patch) => set({ categorias: d.categorias.map((c) => (c.id === id ? { ...c, ...patch } : c)) });

  return (
    <>
      <div className="space-y-2 mb-3">
        {d.categorias.map((c) => (
          <div key={c.id} style={{ background: C.surface, borderColor: C.line }} className="rounded-xl border p-3">
            <div className="flex items-center gap-2">
              <input type="color" value={c.cor} onChange={(e) => upCat(c.id, { cor: e.target.value })} className="w-6 h-6 rounded" />
              <input value={c.nome} onChange={(e) => upCat(c.id, { nome: e.target.value })} className="flex-1 text-sm bg-transparent outline-none" />
              {c.id !== "renda" && (
                <span className="flex items-center gap-1">
                  <span style={{ color: C.muted }} className="text-xs">R$</span>
                  <input value={c.orcamento ?? 0} onChange={(e) => upCat(c.id, { orcamento: num(e.target.value) })} inputMode="decimal"
                    style={{ background: C.bg, borderColor: C.line, fontFamily: MONO }} className="w-20 rounded-lg border px-2 py-1 text-xs outline-none" />

                const recs = d.recorrentes.filter((r) => r.catId === c.id).length;
                if (usos || recs) return flash(
                  `${c.nome} está em uso: ${usos} lançamento(s)${recs ? ` e ${recs} fixa(s)` : ""}. Mova antes de apagar.`);
                set({ categorias: d.categorias.filter((x) => x.id !== c.id) });
              }} pergunta="Apagar categoria" cor={C.muted} titulo="Apagar categoria"><Trash2 size={14} /></BotaoConfirma>
            </div>
            {abertaId === c.id && (
              <div className="mt-3 pl-8">
                <div className="flex flex-wrap gap-1.5 mb-2">
                  {(c.subs || []).map((s) => (
                    <span key={s.id} style={{ background: C.bg, borderColor: C.line }} className="rounded-full border px-2 py-1 text-xs flex items-center gap-1">
                      {s.nome}
                      <button onClick={() => upCat(c.id, { subs: c.subs.filter((x) => x.id !== s.id) })}><X size={11} /></button>
                    </span>
                  ))}
                </div>
                <div className="flex gap-2">
                  <input value={subNome} onChange={(e) => setSubNome(e.target.value)} placeholder="Nova subcategoria"
                    style={{ background: C.bg, borderColor: C.line }} className="flex-1 rounded-lg border px-2 py-1.5 text-xs outline-none" />
                  <button onClick={() => { if (!subNome) return; upCat(c.id, { subs: [...(c.subs || []), { id: uid(), nome: subNome }] }); setSubNome(""); }}
                    style={{ background: C.ink, color: "#fff" }} className="px-3 rounded-lg text-xs">Criar</button>
                </div>
              </div>
            )}
          </div>
        ))}
      </div>
      <div className="flex gap-2">
        <input value={nova} onChange={(e) => setNova(e.target.value)} placeholder="Nova categoria"
          style={{ background: C.surface, borderColor: C.line }} className="flex-1 rounded-xl border px-3 py-2 text-sm outline-none" />
        <button onClick={() => { if (!nova) return; set({ categorias: [...d.categorias, { id: uid(), nome: nova, cor: "#727892", orcamento: 0, subs: [] }] }); setNova(""); }}
          style={{ background: C.ink, color: "#fff" }} className="px-4 rounded-xl text-sm">Criar</button>
      </div>
    </>
  );
}

function AbaContas({ d, set, flash }) {

  const [saldo, setSaldo] = useState("");
  const tipos = [["banco", "Banco"], ["fisico", "Espécie"], ["caixinha", "Caixinha"], ["investimento", "Investimento"]];
  const upC = (id, patch) => set({ contas: d.contas.map((c) => (c.id === id ? { ...c, ...patch } : c)) });
  return (
    <>
      <div className="space-y-2 mb-3">
        {d.contas.map((c) => (
          <div key={c.id} style={{ background: C.surface, borderColor: C.line }} className="rounded-xl border px-3 py-2">
          <div className="flex items-center gap-2">
            <input value={c.nome} onChange={(e) => upC(c.id, { nome: e.target.value })} className="flex-1 text-sm bg-transparent outline-none" />
            <span style={{ color: C.muted }} className="text-xs">{tipos.find((t) => t[0] === c.tipo)?.[1]}</span>
            <input value={c.saldoInicial} onChange={(e) => upC(c.id, { saldoInicial: num(e.target.value) })} inputMode="decimal"
              style={{ background: C.bg, borderColor: C.line, fontFamily: MONO }} className="w-24 rounded-lg border px-2 py-1 text-xs outline-none" />
            <BotaoConfirma onConfirm={() => {
              const usos = d.lancamentos.filter((l) => l.contaId === c.id || l.destinoId === c.id).length;
              const cartoes = d.cartoes.filter((k) => k.contaPagamentoId === c.id).length;
              if (cartoes) return flash(`${cartoes} cartão(ões) pagam por esta conta. Troque a conta deles primeiro.`);
              if (usos) flash(`${c.nome} tinha ${usos} lançamento(s), que ficaram sem conta.`);
              set({ contas: d.contas.filter((x) => x.id !== c.id) });
            }} pergunta="Apagar conta" cor={C.muted} titulo="Apagar conta"><Trash2 size={14} /></BotaoConfirma>
          </div>

          {(c.tipo === "caixinha" || c.tipo === "investimento") && (
            <div style={{ borderColor: C.line }} className="flex flex-wrap items-center gap-2 mt-2 pt-2 border-t">
              <span style={{ color: C.muted }} className="text-xs">Meta</span>
              <input value={c.meta || ""} onChange={(e) => upC(c.id, { meta: num(e.target.value) })} inputMode="decimal" placeholder="sem meta"
                style={{ background: C.bg, borderColor: C.line, fontFamily: MONO }} className="w-24 rounded-lg border px-2 py-1 text-xs outline-none" />
              <span style={{ color: C.muted }} className="text-xs">até</span>
              <input type="month" value={c.prazo || ""} onChange={(e) => upC(c.id, { prazo: e.target.value || undefined })}
                style={{ background: C.bg, borderColor: C.line }} className="rounded-lg border px-2 py-1 text-xs outline-none" />
              <input value={c.objetivo || ""} onChange={(e) => upC(c.id, { objetivo: e.target.value })} placeholder="para quê?"
                style={{ background: C.bg, borderColor: C.line }} className="flex-1 min-w-[7rem] rounded-lg border px-2 py-1 text-xs outline-none" />
            </div>
          )}
          </div>
        ))}
      </div>
      <p style={{ color: C.muted }} className="text-xs mb-2">O valor à direita é o saldo inicial. Ajuste-o para o saldo real de hoje.</p>
      <div className="flex flex-wrap gap-2 mb-2">{tipos.map(([k, t]) => <Chip key={k} ativo={tipo === k} cor={C.ink} onClick={() => setTipo(k)}>{t}</Chip>)}</div>
      <div className="flex gap-2">
        <input value={nome} onChange={(e) => setNome(e.target.value)} placeholder="Nome da conta"
          style={{ background: C.surface, borderColor: C.line }} className="flex-1 rounded-xl border px-3 py-2 text-sm outline-none" />
        <input value={saldo} onChange={(e) => setSaldo(e.target.value)} placeholder="Saldo" inputMode="decimal"
          style={{ background: C.surface, borderColor: C.line }} className="w-24 rounded-xl border px-3 py-2 text-sm outline-none" />
        <button onClick={() => { if (!nome) return; set({ contas: [...d.contas, { id: uid(), nome, tipo, saldoInicial: num(saldo) }] }); setNome(""); setSaldo(""); }}
          style={{ background: C.ink, color: "#fff" }} className="px-4 rounded-xl text-sm">Criar</button>
      </div>
    </>
  );
}
