/* rosca em SVG puro, sem biblioteca */
function Rosca({ dados, tamanho = 208, interno = 45, externo = 72 }) {
  const total = dados.reduce((s, d) => s + d.value, 0) || 1;
  const cx = tamanho / 2, cy = tamanho / 2;
  let ang = -Math.PI / 2;
  const [ativo, setAtivo] = useState(null);

  const arco = (ini, fim, r) => {
    const x1 = cx + r * Math.cos(ini), y1 = cy + r * Math.sin(ini);
    const x2 = cx + r * Math.cos(fim), y2 = cy + r * Math.sin(fim);
    return { x1, y1, x2, y2, grande: fim - ini > Math.PI ? 1 : 0 };
  };

  const fatias = dados.map((d, i) => {
    const fracao = d.value / total;
    const ini = ang, fim = ang + fracao * Math.PI * 2 - (dados.length > 1 ? 0.02 : 0);
    ang += fracao * Math.PI * 2;
    const fora = arco(ini, fim, externo), dentro = arco(fim, ini, interno);
    return { ...d, i, fracao,
      caminho: `M${fora.x1} ${fora.y1} A${externo} ${externo} 0 ${fora.grande} 1 ${fora.x2} ${fora.y2}
                L${dentro.x1} ${dentro.y1} A${interno} ${interno} 0 ${fora.grande} 0 ${dentro.x2} ${dentro.y2} Z` };
  });

  const sel = ativo != null ? fatias[ativo] : null;
  return (
    <svg viewBox={`0 0 ${tamanho} ${tamanho}`} className="w-full h-full" role="img"
      aria-label="Divisão dos gastos por categoria">
      {fatias.map((f) => (
        <path key={f.i} d={f.caminho} fill={f.cor}
          opacity={ativo == null || ativo === f.i ? 1 : 0.35}
          onMouseEnter={() => setAtivo(f.i)} onMouseLeave={() => setAtivo(null)}
          onTouchStart={() => setAtivo(f.i)}
          style={{ cursor: "pointer", transition: "opacity .15s" }}>
          <title>{`${f.name}: ${brl(f.value)}`}</title>
        </path>
      ))}
      {sel && (
        <>
          <text x={cx} y={cy - 4} textAnchor="middle" style={{ fontFamily: MONO, fontSize: 13, fill: C.ink, fontWeight: 600 }}>
            {brl(sel.value).replace("R$ ", "")}
          </text>
          <text x={cx} y={cy + 12} textAnchor="middle" style={{ fontSize: 10, fill: C.muted }}>
            {(sel.fracao * 100).toFixed(0)}%
          </text>
        </>
      )}
    </svg>
  );
}

/* barras agrupadas em SVG puro */
function Barras({ dados, series, altura = 256 }) {
  const [ativo, setAtivo] = useState(null);
  const L = 46, R = 6, T = 8, B = 42;                       // margens
  const larg = 600, alt = altura;
  const areaL = larg - L - R, areaA = alt - T - B;

  const max = Math.max(1, ...dados.flatMap((d) => series.map((s) => d[s.chave] || 0)));
  const passo = (() => {                                   // escala legível
    const bruto = max / 4, exp = Math.pow(10, Math.floor(Math.log10(bruto)));
    return Math.ceil(bruto / exp) * exp;
  })();
  const teto = Math.ceil(max / passo) * passo || 1;
  const linhas = Array.from({ length: Math.round(teto / passo) + 1 }, (_, i) => i * passo);

  const lgGrupo = areaL / (dados.length || 1);
  const lgBarra = Math.min(22, (lgGrupo * 0.7) / series.length);

  return (
    <div className="w-full h-full flex flex-col">
      <svg viewBox={`0 0 ${larg} ${alt}`} preserveAspectRatio="none" className="w-full flex-1" role="img"
        aria-label="Comparação entre o que entrou e o que saiu por mês">
        {linhas.map((v) => {
          const y = T + areaA - (v / teto) * areaA;
          return (
            <g key={v}>
              <line x1={L} y1={y} x2={larg - R} y2={y} stroke={C.line} strokeWidth="1" />
              <text x={L - 6} y={y + 3} textAnchor="end" style={{ fontSize: 10, fill: C.muted, fontFamily: MONO }}>
                {v >= 1000 ? (v / 1000).toFixed(v % 1000 ? 1 : 0) + "k" : v}
              </text>
            </g>
          );
        })}
        {dados.map((d, gi) => {
          const base = L + gi * lgGrupo + lgGrupo / 2 - (lgBarra * series.length) / 2;
          return (
            <g key={gi}>
              {series.map((s, si) => {
                const v = d[s.chave] || 0;
                const h = (v / teto) * areaA;
                const x = base + si * lgBarra;
                const y = T + areaA - h;
                return h > 0 ? (
                  <rect key={s.chave} x={x} y={y} width={lgBarra - 2} height={h} rx="3" fill={s.cor}
                    opacity={ativo == null || ativo === gi ? 1 : 0.4}
                    onMouseEnter={() => setAtivo(gi)} onMouseLeave={() => setAtivo(null)}
                    onTouchStart={() => setAtivo(gi)} style={{ transition: "opacity .15s" }}>
                    <title>{`${d.mes} · ${s.chave}: ${brl(v)}`}</title>
                  </rect>
                ) : null;
              })}
              <text x={L + gi * lgGrupo + lgGrupo / 2} y={alt - B + 14} textAnchor="middle"
                style={{ fontSize: 10, fill: ativo === gi ? C.ink : C.muted }}>{d.mes}</text>
            </g>
          );
        })}
      </svg>
      <div className="flex flex-wrap justify-center gap-x-4 gap-y-1 pt-1">
        {series.map((s) => (
          <span key={s.chave} style={{ color: C.muted }} className="flex items-center gap-1.5 text-xs">
            <span style={{ background: s.cor }} className="w-2 h-2 rounded-full inline-block" />{s.chave}
          </span>
        ))}
      </div>
      {ativo != null && (
        <div style={{ color: C.muted, fontFamily: MONO }} className="text-xs text-center pt-1">
          {dados[ativo].mes}: {series.map((s) => `${s.chave} ${brl(dados[ativo][s.chave] || 0)}`).join(" · ")}
        </div>
      )}
    </div>
  );
}

/* --------------------------------------------------------- armazenamento */
/* mesma interface do window.storage do chat, agora sobre IndexedDB.
   IndexedDB sobrevive melhor que localStorage e cabe muito mais coisa. */
window.storage = (() => {
  const DB = "caderneta", LOJA = "kv";
  let pronto = null;

  const abrir = () => (pronto ||= new Promise((ok, erro) => {
    const req = indexedDB.open(DB, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(LOJA);
    req.onsuccess = () => ok(req.result);
    req.onerror = () => erro(req.error);
  }));

  const tx = async (modo, fn) => {
    const db = await abrir();
    return new Promise((ok, erro) => {
      const t = db.transaction(LOJA, modo);
      const req = fn(t.objectStore(LOJA));
      req.onsuccess = () => ok(req.result);
      req.onerror = () => erro(req.error);
    });
  };

  return {
    async get(k) { const v = await tx("readonly", (s) => s.get(k)); return v == null ? null : { key: k, value: v }; },
    async set(k, v) { await tx("readwrite", (s) => s.put(v, k)); return { key: k, value: v }; },
    async delete(k) { await tx("readwrite", (s) => s.delete(k)); return { key: k, deleted: true }; },
  };
})();

  return { contas, cartoes, categorias, recorrentes, lancamentos: L, intencoes: [], v: 3 };
}

/* ================================================= geração de recorrentes */
function gerar(d, meses = 12) {
  const out = [...d.lancamentos];
  const base = today();
  (d.recorrentes || []).forEach((r) => {
    let feitas = out.filter((l) => l.recId === r.id).length;
    for (let i = 0; i < meses; i++) {
      const venc = addMonths(`${base.slice(0, 7)}-${String(r.dia).padStart(2, "0")}`, i);
      if (venc < base) continue;
      if (r.fim?.tipo === "data" && r.fim.data && venc > r.fim.data) break;
      if (r.fim?.tipo === "vezes" && feitas >= r.fim.vezes) break;
      const src = `${r.id}#${ym(venc)}`;
      if (out.some((l) => l.src === src)) { continue; }
      const ult = out.filter((l) => l.recId === r.id && l.status === "pago").sort((a, b) => (b.pagamento || "").localeCompare(a.pagamento || ""))[0];
      out.push({
        id: uid(), src, recId: r.id, nome: r.nome, valor: ult ? ult.valor : r.valor, tipo: "saida",
        catId: r.catId, subId: r.subId, forma: r.forma, contaId: r.contaId || null, cartaoId: r.cartaoId || null,
        vencimento: venc, pagamento: null, status: "pendente", obs: "", reembolso: "nao", conferir: !!r.variavel,
      });
      feitas++;
    }
  });
  return { ...d, lancamentos: out };
}

/* ================================================================== app */
function App() {
  const [d, setD] = useState(null);
  const [tab, setTab] = useState("lancar");
  const [cfg, setCfg] = useState(false);
  const [toast, setToast] = useState(null);
  const [sync, setSync] = useState({ estado: "local", quando: null });
  const timer = useRef(null);
  const retry = useRef(null);
  const tentativa = useRef(0);

  useEffect(() => {
    const l = document.createElement("link");
    l.rel = "stylesheet";
    l.href = "https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap";
    document.head.appendChild(l);
  }, []);

  useEffect(() => {
    (async () => {
      let base = null;
      try { const r = await window.storage.get("caderneta:v3"); if (r?.value) base = JSON.parse(r.value); } catch (e) { base = null; }
      setD(gerar(base || seed()));
    })();
  }, []);

  useEffect(() => {
    if (!d) return;
    clearTimeout(timer.current);
    setSync((s) => (s.estado === "erro" ? s : { ...s, estado: "pendente" }));
    timer.current = setTimeout(async () => {
      // 1. local primeiro, sempre. isto nunca falha por causa da rede.
      try { await window.storage.set("caderneta:v3", JSON.stringify(d)); } catch (e) { /* segue em memória */ }
      // 2. nuvem depois, sem segurar a tela.
      enviar(d);
    }, 400);
  }, [d]);

  /* ------------------------------------------------- sincronia remota */
  const enviar = async (dados) => {
    const url = dados?.sheetsUrl;
    if (!url) { setSync({ estado: "local", quando: Date.now() }); return; }
    if (!navigator.onLine) { setSync({ estado: "offline", quando: null }); return; }
    setSync((s) => ({ ...s, estado: "enviando" }));
    try {
      const r = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" }, // evita o pedido de permissão extra do navegador
        body: JSON.stringify({ v: 3, atualizadoEm: Date.now(), segredo: dados.sheetsSegredo || "", dados }),
      });
      if (!r.ok) throw new Error("resposta " + r.status);
      setSync({ estado: "ok", quando: Date.now() });
      tentativa.current = 0;
    } catch (e) {
      setSync({ estado: "erro", quando: null, msg: e.message });
      // tenta de novo sozinha, esperando cada vez mais: 5s, 10s, 20s… até 5min
      tentativa.current = Math.min(tentativa.current + 1, 6);
      clearTimeout(retry.current);
      retry.current = setTimeout(() => enviar(dados), 5000 * 2 ** (tentativa.current - 1));
    }
  };

  // quando a internet voltar, reenvia sozinho
  useEffect(() => {
    const volta = () => d && enviar(d);
    window.addEventListener("online", volta);
    return () => window.removeEventListener("online", volta);
  }, [d]);

  const flash = (m) => { setToast(m); setTimeout(() => setToast(null), 2000); };
  if (!d) return <div style={{ background: C.bg, fontFamily: BODY, color: C.muted }} className="min-h-screen flex items-center justify-center">Abrindo a caderneta…</div>;

  /* ------------------------------------------------------- derivados */
  const catOf = (id) => d.categorias.find((c) => c.id === id) || { nome: "—", cor: C.muted, subs: [] };
  const subOf = (cid, sid) => catOf(cid).subs?.find((s) => s.id === sid);
  const contaOf = (id) => d.contas.find((c) => c.id === id);
  const cartaoOf = (id) => d.cartoes.find((c) => c.id === id);
  const anulado = (l) => l.tipo === "saida" && l.reembolso === "recebido";   // saiu e voltou: não mexe no saldo
  const alheio = (l) => l.tipo === "saida" && !!l.deQuem;          // comprou no seu cartão, mas o gasto não é seu
  const aCobrar = (l) => alheio(l) && l.reembolso !== "recebido";  // ela ainda não te acertou

  const saldoConta = (id) => {
    const c = contaOf(id); if (!c) return 0;
    return d.lancamentos.reduce((s, l) => {
      if (l.status !== "pago") return s;
      if (l.tipo === "transferencia") {
        if (l.contaId === id) return s - l.valor;
        if (l.destinoId === id) return s + l.valor;
        return s;
      }
      if (l.contaId !== id) return s;
      if (l.tipo === "entrada") return s + l.valor;
      return anulado(l) ? s : s - l.valor;
    }, c.saldoInicial || 0);
  };

  const liquidas = d.contas.filter((c) => c.tipo === "banco" || c.tipo === "fisico");
  const bancos = d.contas.filter((c) => c.tipo === "banco");
  const fisicas = d.contas.filter((c) => c.tipo === "fisico");
  const guardadas = d.contas.filter((c) => c.tipo === "caixinha");
  const investidas = d.contas.filter((c) => c.tipo === "investimento");
  const soma = (arr) => arr.reduce((s, c) => s + saldoConta(c.id), 0);
  const totalBancos = soma(bancos), totalFisico = soma(fisicas);
  const totalGuardado = soma(guardadas), totalInvestido = soma(investidas);

  const M = mesAtual();
  const pendentes = d.lancamentos.filter((l) => l.status === "pendente" && (l.tipo === "saida" || l.tipo === "transferencia"));
  const comprometidoMes = pendentes.filter((l) => ym(l.vencimento) <= M).reduce((s, l) => s + l.valor, 0);
  const comprometidoGeral = pendentes.reduce((s, l) => s + l.valor, 0);
  const aReceber = d.lancamentos.filter((l) => l.status === "pendente" && l.tipo === "entrada" && ym(l.vencimento) <= M).reduce((s, l) => s + l.valor, 0);
  const disponivel = totalBancos + totalFisico - comprometidoMes;

  /* ---------------------------------------------------------- ações */
  const salvar = (l) => {
    const n = l.parcelas || 1, grupo = n > 1 ? uid() : undefined, novos = [];
    for (let i = 0; i < n; i++) {
      novos.push({ ...l, id: uid(), valor: +(l.valor / n).toFixed(2), vencimento: addMonths(l.vencimento, i),
        status: i === 0 ? l.status : "pendente", pagamento: i === 0 ? l.pagamento : null,
        grupo, parcela: n > 1 ? i + 1 : undefined, parcelas: n > 1 ? n : undefined });
    }
    setD({ ...d, lancamentos: [...novos, ...d.lancamentos] });
    flash(n > 1 ? `Lançado em ${n}×` : "Lançado");
  };
  const up = (id, patch) => setD({ ...d, lancamentos: d.lancamentos.map((l) => (l.id === id ? { ...l, ...patch } : l)) });
  const upVarios = (ls, patch) => {
    const ids = new Set(ls.map((l) => l.id));
    setD({ ...d, lancamentos: d.lancamentos.map((l) => (ids.has(l.id) ? { ...l, ...patch } : l)) });
  };
  const pagar = (l, conta) => up(l.id, { status: "pago", pagamento: today(), conferir: false,
    contaId: l.cartaoId ? conta || cartaoOf(l.cartaoId)?.contaPagamentoId : l.contaId });
  const pagarVarios = (ls) => {
    const ids = new Set(ls.map((l) => l.id));
    setD({
      ...d,
      lancamentos: d.lancamentos.map((l) =>
        ids.has(l.id)
          ? { ...l, status: "pago", pagamento: today(), conferir: false,
              contaId: l.cartaoId ? cartaoOf(l.cartaoId)?.contaPagamentoId : l.contaId }
          : l
      ),
    });
    flash(`${ls.length} ${ls.length === 1 ? "lançamento pago" : "lançamentos pagos"}`);
  };
  const despagar = (id) => up(id, { status: "pendente", pagamento: null });
  const apagar = (id) => setD({ ...d, lancamentos: d.lancamentos.filter((l) => l.id !== id) });

  const ctx = { d, setD, catOf, subOf, contaOf, cartaoOf, saldoConta, anulado, alheio, aCobrar, salvar, up, upVarios, pagar, pagarVarios, despagar, apagar, flash,
    liquidas, bancos, fisicas, guardadas, investidas, totalBancos, totalFisico, totalGuardado, totalInvestido,
    pendentes, comprometidoMes, comprometidoGeral, aReceber, disponivel, M };

  const tabs = [
    { id: "lancar", nome: "Lançar", icon: Plus }, { id: "agora", nome: "Agora", icon: Wallet },
    { id: "futuro", nome: "Futuro", icon: CalendarClock }, { id: "guardado", nome: "Guardado", icon: PiggyBank },
    { id: "relatorio", nome: "Relatórios", icon: PieIcon },
  ];

  return (
    <div style={{ background: C.bg, color: C.ink, fontFamily: BODY }} className="min-h-screen">
      <div className="mx-auto max-w-5xl flex flex-col md:flex-row">
        <aside className="hidden md:flex flex-col gap-1 w-52 shrink-0 p-4 sticky top-0 h-screen">
          <div style={{ fontFamily: DISPLAY, letterSpacing: "-0.03em" }} className="text-2xl font-bold px-3 pt-2 pb-5">caderneta</div>
          {tabs.map((t) => (
            <button key={t.id} onClick={() => setTab(t.id)}
              style={{ background: tab === t.id ? C.surface : "transparent", color: tab === t.id ? C.ink : C.muted }}
              className="flex items-center gap-3 px-3 py-2 rounded-xl text-sm font-medium text-left"><t.icon size={17} /> {t.nome}</button>
          ))}
          <button onClick={() => setCfg(true)} style={{ color: C.muted }} className="flex items-center gap-3 px-3 py-2 rounded-xl text-sm font-medium mt-auto"><Settings size={17} /> Ajustes</button>
        </aside>

        <main className="flex-1 p-4 pb-28 md:pb-8 md:pt-6">
          <div className="flex items-center justify-between md:hidden mb-4">
            <div style={{ fontFamily: DISPLAY, letterSpacing: "-0.03em" }} className="text-xl font-bold">caderneta</div>
            <button onClick={() => setCfg(true)} style={{ color: C.muted }}><Settings size={20} /></button>
          </div>
          <Barra {...ctx} sync={sync} />
          {tab === "lancar" && <Lancar {...ctx} />}
          {tab === "agora" && <Agora {...ctx} />}
          {tab === "futuro" && <Futuro {...ctx} />}
          {tab === "guardado" && <Guardado {...ctx} />}
          {tab === "relatorio" && <Relatorio {...ctx} />}
        </main>
      </div>

      <nav style={{ background: C.surface, borderColor: C.line }} className="md:hidden fixed bottom-0 inset-x-0 border-t flex justify-around px-1 py-2">
        {tabs.map((t) => (
          <button key={t.id} onClick={() => setTab(t.id)} style={{ color: tab === t.id ? C.ink : C.muted }} className="flex flex-col items-center gap-1 px-2 py-1">
            <t.icon size={19} /><span className="text-xs">{t.nome}</span></button>
        ))}
      </nav>

      {toast && <div style={{ background: C.ink, color: "#fff" }} className="fixed bottom-24 md:bottom-6 left-1/2 -translate-x-1/2 px-4 py-2 rounded-full text-sm shadow-lg">{toast}</div>}
      {cfg && <Ajustes {...ctx} onClose={() => setCfg(false)} />}
    </div>
  );
}

/* ================================================= indicador de sincronia */
const ESTADOS = {
  local:     { cor: "#727892", txt: "só neste aparelho" },
  pendente:  { cor: "#B26A00", txt: "salvando…" },
  enviando:  { cor: "#1D6FA8", txt: "sincronizando…" },
  ok:        { cor: "#0E7C61", txt: "sincronizado" },
  offline:   { cor: "#B26A00", txt: "offline · envia depois" },
  erro:      { cor: "#C42B5C", txt: "falhou · tentando de novo" },
};

function SyncBadge({ sync }) {
  const e = ESTADOS[sync?.estado] || ESTADOS.local;
  const pulsa = sync?.estado === "enviando" || sync?.estado === "pendente";
  const quando = sync?.quando
    ? new Date(sync.quando).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
    : null;
  return (
    <span title={quando ? `Última sincronia às ${quando}` : e.txt}
      style={{ background: e.cor + "1A", color: e.cor }}
      className="flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs font-medium shrink-0">
      <span style={{ background: e.cor }}
        className={"w-2 h-2 rounded-full inline-block shrink-0" + (pulsa ? " animate-pulse" : "")} />
      {e.txt}{sync?.estado === "ok" && quando ? ` ${quando}` : ""}
    </span>
  );
}

/* ============================================ assinatura: estados do dinheiro */
function Barra({ disponivel, comprometidoMes, comprometidoGeral, totalGuardado, totalInvestido, totalFisico, totalBancos, aReceber, sync }) {
  const partes = [
    { n: "Disponível", v: Math.max(disponivel, 0), c: C.in },
    { n: "Comprometido", v: comprometidoMes, c: C.due },
    { n: "Guardado", v: totalGuardado, c: C.saved },
    { n: "Investido", v: totalInvestido, c: C.inv },
  ];
  const vis = partes.filter((p) => p.v > 0);
  const tot = vis.reduce((s, p) => s + p.v, 0) || 1;
  return (
    <section style={{ background: C.surface, borderColor: C.line }} className="rounded-2xl border p-4 mb-4">
      <div className="flex items-center justify-between gap-2 mb-3">
        <SyncBadge sync={sync} />
        <span style={{ fontFamily: MONO, color: C.muted }} className="text-xs text-right">{brl(totalBancos + totalFisico + totalGuardado + totalInvestido)} no total</span>
      </div>
      <div style={{ color: C.muted }} className="text-xs uppercase tracking-wider mb-2">Onde seu dinheiro está</div>
      <div className="flex h-3 rounded-full overflow-hidden gap-0.5">
        {vis.map((p) => <div key={p.n} style={{ background: p.c, width: `${(p.v / tot) * 100}%` }} title={`${p.n}: ${brl(p.v)}`} />)}
      </div>
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-4">
        {[{ n: "Disponível", v: disponivel, c: C.in }, { n: "Comprometido", v: comprometidoMes, c: C.due },
          { n: "Guardado", v: totalGuardado, c: C.saved }, { n: "Investido", v: totalInvestido, c: C.inv }].map((p, i) => (
          <div key={p.n}>
            <div className="flex items-center gap-1.5"><span style={{ background: p.c }} className="w-2 h-2 rounded-full inline-block" />
              <span style={{ color: C.muted }} className="text-xs">{p.n}</span></div>
            <div style={{ fontFamily: MONO, color: p.v < 0 ? C.out : C.ink }} className="text-lg font-semibold mt-0.5">{brl(p.v)}</div>
            {i === 1 && <div style={{ color: C.muted, fontFamily: MONO }} className="text-xs">geral {brl(comprometidoGeral)}</div>}
          </div>
        ))}
      </div>
      <div style={{ borderColor: C.line, color: C.muted, fontFamily: MONO }} className="flex flex-wrap gap-x-4 gap-y-1 text-xs border-t mt-3 pt-3">
        <span>bancos {brl(totalBancos)}</span><span>espécie {brl(totalFisico)}</span>
        {aReceber > 0 && <span style={{ color: C.in }}>a receber {brl(aReceber)}</span>}
      </div>
    </section>
  );
}

/* ================================================================ lançar */
function Lancar({ d, catOf, contaOf, cartaoOf, subOf, salvar, apagar, up, pagar, anulado }) {
  const [janela, setJanela] = useState("todos");
  const [de, setDe] = useState("");
  const [ate, setAte] = useState("");
  const [tipo, setTipo] = useState("saida");
  const [pago, setPago] = useState(true);
  const [valor, setValor] = useState("");
  const [nome, setNome] = useState("");
  const [catId, setCatId] = useState("mercado");
  const [subId, setSubId] = useState(null);
  const [forma, setForma] = useState("Pix");
  const [instr, setInstr] = useState("nubank");
  const [destino, setDestino] = useState("carteira");
  const [mais, setMais] = useState(false);
  const [venc, setVenc] = useState(today());
  const [parcelas, setParcelas] = useState("1");
  const nParc = Math.min(48, Math.max(1, parseInt(parcelas, 10) || 1));
  const [obs, setObs] = useState("");
  const [reemb, setReemb] = useState(false);
  const [deQuem, setDeQuem] = useState("");
  const pessoas = [...new Set([...d.cartoes.map((c) => c.dono), ...d.lancamentos.map((l) => l.deQuem)]
    .filter((n) => n && n !== "eu"))];

  const v = num(valor);
  const credito = forma === "Crédito";
  const contasUso = d.contas.filter((c) => c.tipo === "banco" || c.tipo === "fisico");

  const trocaTipo = (t) => {
    setTipo(t); setPago(true);
    if (t === "entrada") { setCatId("renda"); setSubId(null); setForma("Pix"); }
    if (t === "transferencia") { setForma("Pix"); }
    if (t === "saida") { setCatId("mercado"); setSubId(null); }
  };
  const trocaForma = (f) => { setForma(f); setInstr(f === "Crédito" ? d.cartoes[0]?.id : contasUso[0]?.id); if (f === "Crédito") setPago(false); };

  const enviar = () => {
    if (v <= 0) return;
    const base = {
      tipo, nome: nome || (tipo === "transferencia" ? "Transferência" : catOf(catId).nome), valor: v,
      catId: tipo === "transferencia" ? null : catId, subId: tipo === "transferencia" ? null : subId,
      forma, vencimento: venc, obs, deQuem: deQuem.trim() || undefined,
      reembolso: deQuem.trim() || reemb ? "aguardando" : "nao",
      status: pago ? "pago" : "pendente", pagamento: pago ? venc : null,
      parcelas: nParc > 1 ? nParc : undefined,
    };
    if (tipo === "transferencia") salvar({ ...base, contaId: instr, destinoId: destino });
    else if (credito) salvar({ ...base, cartaoId: instr, contaId: null });
    else salvar({ ...base, contaId: instr, cartaoId: null });
    setValor(""); setNome(""); setObs(""); setParcelas("1"); setReemb(false); setDeQuem(""); setMais(false); setVenc(today());
  };

  const dataDe = (l) => l.pagamento || l.vencimento;
  const periodo = useMemo(() => {
    if (de && ate && de <= ate) {
      const ms = []; let k = de + "-01";
      while (ym(k) <= ate) { ms.push(ym(k)); k = addMonths(k, 1); }
      return ms;
    }
    if (janela === "todos") return null;
    return Array.from({ length: janela }, (_, i) => ym(addMonths(today(), -i)));
  }, [janela, de, ate]);

  const lista = useMemo(() => {
    const arr = d.lancamentos.filter((l) => (periodo ? periodo.includes(ym(dataDe(l))) : true));
    return arr.sort((a, b) => dataDe(b).localeCompare(dataDe(a)));
  }, [d.lancamentos, periodo]);
  const visiveis = lista.slice(0, 60);

  return (
    <>
      <section style={{ background: C.surface, borderColor: C.line }} className="rounded-2xl border p-4">
        <div style={{ background: C.bg }} className="flex p-1 rounded-xl mb-3">
          {[["saida", "Saída", ArrowUpRight], ["entrada", "Entrada", ArrowDownLeft], ["transferencia", "Transferência", ArrowLeftRight]].map(([k, t, Ic]) => (
            <button key={k} onClick={() => trocaTipo(k)}
              style={{ background: tipo === k ? C.surface : "transparent", color: tipo === k ? CORTIPO[k] : C.muted }}
              className="flex-1 flex items-center justify-center gap-1.5 py-2 rounded-lg text-xs sm:text-sm font-medium">
              <Ic size={15} /> {t}</button>
          ))}
        </div>

        <div className="flex gap-2 mb-4">
          {(tipo === "saida" ? [[true, "Pago"], [false, "Pendente"]]
            : tipo === "entrada" ? [[true, "Recebido"], [false, "A receber"]]
            : [[true, "Já fiz"], [false, "Planejada"]]).map(([k, t]) => (
            <button key={t} onClick={() => setPago(k)}
              style={{ background: pago === k ? (k ? CORTIPO[tipo] : C.due) : C.bg, color: pago === k ? "#fff" : C.muted, borderColor: C.line }}
              className="flex-1 rounded-xl border py-2 text-sm font-medium">{t}</button>
          ))}
        </div>

        <div className="flex items-center gap-2 mb-4">
          <span style={{ fontFamily: MONO, color: C.muted }} className="text-2xl">R$</span>
          <input value={valor} onChange={(e) => setValor(e.target.value.replace(/[^\d.,]/g, ""))} onKeyDown={(e) => e.key === "Enter" && enviar()}
            inputMode="decimal" placeholder="0,00" style={{ fontFamily: MONO, color: CORTIPO[tipo], background: "transparent" }}
            className="text-4xl font-semibold w-full outline-none" />
        </div>

        <input value={nome} onChange={(e) => setNome(e.target.value)} onKeyDown={(e) => e.key === "Enter" && enviar()}
          placeholder="Nome do lançamento" style={{ background: C.bg, borderColor: C.line }}
          className="w-full rounded-xl border px-3 py-2.5 text-sm mb-4 outline-none" />

        {tipo !== "transferencia" && (
          <>
            <Rotulo>Categoria</Rotulo>
            <div className="flex flex-wrap gap-2 mb-3">
              {d.categorias.filter((c) => (tipo === "entrada" ? c.id === "renda" : c.id !== "renda")).map((c) => (
                <Chip key={c.id} ativo={catId === c.id} cor={c.cor} onClick={() => { setCatId(c.id); setSubId(null); }}>{c.nome}</Chip>
              ))}
            </div>
            {catOf(catId).subs?.length > 0 && (
              <>
                <Rotulo>Subcategoria</Rotulo>
                <div className="flex flex-wrap gap-2 mb-4">
                  {catOf(catId).subs.map((s) => (
                    <Chip key={s.id} ativo={subId === s.id} cor={C.ink} onClick={() => setSubId(subId === s.id ? null : s.id)}>{s.nome}</Chip>
                  ))}
                </div>
              </>
            )}
          </>
        )}

        {tipo !== "transferencia" && (
          <>
            <Rotulo>Forma de pagamento</Rotulo>
            <div className="flex flex-wrap gap-2 mb-4">
              {FORMAS.map((f) => <Chip key={f} ativo={forma === f} cor={C.ink} onClick={() => trocaForma(f)}>{f}</Chip>)}
            </div>
          </>
        )}

        <Rotulo>{tipo === "transferencia" ? "De onde sai" : credito ? "Em qual cartão" : "De qual conta"}</Rotulo>
        <div className="flex flex-wrap gap-2 mb-4">
          {(credito ? d.cartoes : contasUso).map((c) => (
            <Chip key={c.id} ativo={instr === c.id} cor={credito ? C.due : C.saved} onClick={() => setInstr(c.id)}>
              {credito && <CreditCard size={12} className="inline mr-1" />}{c.nome}{c.dono && c.dono !== "eu" ? ` · ${c.dono}` : ""}
            </Chip>
          ))}
        </div>

        {tipo === "transferencia" && (
          <>
            <Rotulo>Para onde vai</Rotulo>
            <div className="flex flex-wrap gap-2 mb-4">
              {d.contas.filter((c) => c.id !== instr).map((c) => (
                <Chip key={c.id} ativo={destino === c.id} cor={C.tr} onClick={() => setDestino(c.id)}>{c.nome}</Chip>
              ))}
            </div>
          </>
        )}

        <button onClick={() => setMais(!mais)} style={{ color: C.muted }} className="flex items-center gap-1 text-sm mb-3">
          <ChevronDown size={15} style={{ transform: mais ? "rotate(180deg)" : "none" }} /> Mais detalhes
        </button>

        {mais && (
          <div className="grid sm:grid-cols-2 gap-3 mb-4">
            <div><Rotulo>{tipo === "entrada" ? "Data prevista" : "Vencimento"}</Rotulo>
              <input type="date" value={venc} onChange={(e) => setVenc(e.target.value)} style={{ background: C.bg, borderColor: C.line }}
                className="w-full rounded-xl border px-3 py-2 text-sm outline-none" /></div>
            {tipo === "saida" && (
              <div><Rotulo>Parcelas</Rotulo>
                <input inputMode="numeric" value={parcelas}
                  onChange={(e) => setParcelas(e.target.value.replace(/\D/g, "").slice(0, 2))}
                  onFocus={(e) => e.target.select()}
                  onBlur={() => setParcelas(String(nParc))}
                  style={{ background: C.bg, borderColor: C.line, color: C.ink, fontFamily: MONO }} className="w-full rounded-xl border px-3 py-2 outline-none" />
                {nParc > 1 && <p style={{ color: C.muted, fontFamily: MONO }} className="text-xs mt-1">{nParc}× {brl(v / nParc)}</p>}</div>
            )}
            <div className="sm:col-span-2"><Rotulo>Observações</Rotulo>
              <input value={obs} onChange={(e) => setObs(e.target.value)} placeholder="Ex.: saquei do Nubank para pagar em dinheiro"
                style={{ background: C.bg, borderColor: C.line }} className="w-full rounded-xl border px-3 py-2 text-sm outline-none" /></div>
            {tipo === "saida" && (
              <div className="sm:col-span-2"><Rotulo>Este gasto é de outra pessoa?</Rotulo>
                <div className="flex flex-wrap gap-1.5 mb-1.5">
                  {["", ...pessoas].map((n) => (
                    <button key={n || "eu"} onClick={() => setDeQuem(n)}
                      style={{ background: deQuem === n ? C.tr : C.bg, color: deQuem === n ? "#fff" : C.muted, borderColor: C.line }}
                      className="rounded-lg border px-2.5 py-1 text-xs">{n || "Meu"}</button>
                  ))}
                </div>
                <input value={deQuem} onChange={(e) => setDeQuem(e.target.value)} placeholder="ou digite o nome"
                  style={{ background: C.bg, borderColor: C.line }} className="w-full rounded-xl border px-3 py-2 text-sm outline-none" />
                {deQuem.trim() && <p style={{ color: C.tr }} className="text-xs mt-1">
                  Entra na fatura, mas não conta como gasto seu. Vai para a lista de cobrança de {deQuem.trim()}.</p>}
              </div>
            )}
            {tipo === "saida" && !deQuem.trim() && (
              <label className="flex items-center gap-2 text-sm sm:col-span-2">
                <input type="checkbox" checked={reemb} onChange={(e) => setReemb(e.target.checked)} /> Vou ser reembolsada
              </label>
            )}
          </div>
        )}

        <button onClick={enviar} disabled={v <= 0} style={{ background: v > 0 ? C.ink : C.line, color: v > 0 ? "#fff" : C.muted }}
          className="w-full py-3 rounded-xl font-medium text-sm">Salvar lançamento</button>
      </section>

      <div className="flex items-baseline justify-between mt-6 mb-2">
        <h2 style={{ fontFamily: DISPLAY }} className="text-lg font-bold">Lançamentos</h2>
        <span style={{ color: C.muted, fontFamily: MONO }} className="text-xs">
          {lista.length} {lista.length === 1 ? "registro" : "registros"}
        </span>
      </div>
      <div className="flex flex-wrap items-center gap-2 mb-2">
        {[["todos", "Todos"], [1, "Este mês"], [3, "3 meses"], [6, "6 meses"], [12, "12 meses"]].map(([k, t]) => (
          <Chip key={k} ativo={!(de && ate) && janela === k} cor={C.ink}
            onClick={() => { setJanela(k); setDe(""); setAte(""); }}>{t}</Chip>
        ))}
        <input type="month" value={de} onChange={(e) => setDe(e.target.value)} style={{ background: C.surface, borderColor: C.line }}
          className="rounded-full border px-3 py-1.5 text-xs outline-none" />
        <span style={{ color: C.muted }} className="text-xs">até</span>
        <input type="month" value={ate} onChange={(e) => setAte(e.target.value)} style={{ background: C.surface, borderColor: C.line }}
          className="rounded-full border px-3 py-1.5 text-xs outline-none" />
      </div>
      {periodo && (
        <p style={{ color: C.muted }} className="text-xs mb-3 capitalize">
          {periodo.length === 1 ? mesLabel(periodo[0]) : `${mesLabel(periodo[periodo.length - 1])} — ${mesLabel(periodo[0])}`}
        </p>
      )}
      {visiveis.length === 0 && <Vazio>Nenhum lançamento neste período.</Vazio>}
      <div className="space-y-2">
        {visiveis.map((l) => (
          <Linha key={l.id} l={l} {...{ catOf, subOf, contaOf, cartaoOf, anulado, up }}
            onPay={l.status === "pendente" ? () => pagar(l) : null} onDel={() => apagar(l.id)} />
        ))}
      </div>
      {lista.length > 60 && (
        <p style={{ color: C.muted }} className="text-xs mt-3">Mostrando os 60 mais recentes. Filtre por período para ver o resto.</p>
      )}
    </>
  );
}

/* ================================================================= agora */
function Agora({ d, bancos, fisicas, saldoConta, pendentes, M, catOf, subOf, contaOf, cartaoOf, pagar, pagarVarios, up, upVarios, flash, anulado, alheio, aCobrar }) {
  const doMes = pendentes.filter((l) => ym(l.vencimento) <= M).sort((a, b) => a.vencimento.localeCompare(b.vencimento));
  const aReceber = d.lancamentos.filter((l) => l.status === "pendente" && l.tipo === "entrada").sort((a, b) => a.vencimento.localeCompare(b.vencimento));
  /* uma compra pertence ao ciclo da sua data de vencimento. o ciclo fecha no
     dia `fecha` do próprio mês do vencimento, ou do mês anterior quando o
     cartão fecha depois de vencer (ex.: fecha 27, vence 3). */
  const hoje = today();
  const fechamentoDe = (c, venc) => {
    let [a, m] = venc.split("-").map(Number);
    if (c.fecha >= c.vence) { m -= 1; if (m === 0) { m = 12; a -= 1; } }
    return `${a}-${String(m).padStart(2, "0")}-${String(c.fecha).padStart(2, "0")}`;
  };
  const doCartao = (c) => pendentes.filter((l) => l.cartaoId === c.id);
  const fatura = (c) => doCartao(c).filter((l) => fechamentoDe(c, l.vencimento) <= hoje);   // já fechou: é o que se paga
  const aberta = (c) => doCartao(c).filter((l) => fechamentoDe(c, l.vencimento) > hoje);    // ainda rolando
  const pagarFatura = (c) => pagarVarios(fatura(c));
  const soma = (ls) => ls.reduce((s, l) => s + l.valor, 0);
  const meu = (ls) => soma(ls.filter((l) => !alheio(l)));
  const deOutros = (ls) => soma(ls.filter(alheio));
  const totFechadas = d.cartoes.reduce((s, c) => s + soma(fatura(c)), 0);
  const totAbertas = d.cartoes.reduce((s, c) => s + soma(aberta(c)), 0);

  /* tudo que outras pessoas gastaram e ainda não acertaram, por pessoa */
  const cobrancas = Object.entries(
    d.lancamentos.filter(aCobrar).reduce((m, l) => {
      (m[l.deQuem] ||= []).push(l); return m;
    }, {})
  ).sort((a, b) => soma(b[1]) - soma(a[1]));

  const Grupo = ({ titulo, contas }) => (
    <>
      <h3 style={{ color: C.muted }} className="text-xs uppercase tracking-wider mb-2">{titulo}</h3>
      <div className="grid sm:grid-cols-2 gap-2 mb-4">
        {contas.map((c) => (
          <div key={c.id} style={{ background: C.surface, borderColor: C.line }} className="rounded-xl border px-4 py-3 flex items-center justify-between">
            <span className="text-sm">{c.nome}</span>
            <span style={{ fontFamily: MONO, color: saldoConta(c.id) < 0 ? C.out : C.ink }} className="font-semibold">{brl(saldoConta(c.id))}</span>
          </div>
        ))}
      </div>
    </>
  );

  return (
    <>
      <Grupo titulo="Bancos" contas={bancos} />
      <Grupo titulo="Em espécie" contas={fisicas} />

      <div className="flex items-baseline justify-between mb-2">
        <h3 style={{ color: C.muted }} className="text-xs uppercase tracking-wider">Cartões</h3>
        <span style={{ color: C.muted }} className="text-xs">
          a pagar <b style={{ fontFamily: MONO, color: C.due }}>{brl(totFechadas)}</b>
          {" · "}em curso <b style={{ fontFamily: MONO, color: C.ink }}>{brl(totAbertas)}</b>
          {" · "}total <b style={{ fontFamily: MONO, color: C.ink }}>{brl(totFechadas + totAbertas)}</b>
        </span>
      </div>
      <div className="grid sm:grid-cols-2 gap-2 mb-6">
        {d.cartoes.map((c) => {
          const lsF = fatura(c), tf = soma(lsF);
          const lsA = aberta(c), ta = soma(lsA);
          const proxFecha = lsA.length ? fechamentoDe(c, lsA.map((l) => l.vencimento).sort()[0]) : null;
          return (
            <div key={c.id} style={{ background: C.surface, borderColor: C.line }} className="rounded-xl border px-4 py-3">
              <div className="flex items-center justify-between mb-2">
                <span className="text-sm flex items-center gap-1.5"><CreditCard size={14} /> {c.nome}
                  {c.dono !== "eu" && <span style={{ color: C.muted }} className="text-xs">· {c.dono}</span>}</span>
                <span style={{ color: C.muted }} className="text-xs">fecha {c.fecha} · vence {c.vence}</span>
              </div>

              <div className="flex items-center justify-between">
                <span style={{ color: C.muted }} className="text-xs">fatura fechada</span>
                <div className="flex items-center gap-2">
                  <span style={{ fontFamily: MONO, color: tf ? C.due : C.muted }} className="font-semibold text-sm">{brl(tf)}</span>
                  {tf > 0 && <button onClick={() => pagarFatura(c)} style={{ borderColor: C.line }} className="rounded-lg border px-2 py-0.5 text-xs">Pagar</button>}
                </div>
              </div>
              {deOutros(lsF) > 0 && (
                <p style={{ color: C.tr }} className="text-xs mt-0.5">
                  seu {brl(meu(lsF))} · de outros {brl(deOutros(lsF))}
                </p>
              )}

              <div style={{ borderColor: C.line }} className="flex items-center justify-between mt-1.5 pt-1.5 border-t">
                <span style={{ color: C.muted }} className="text-xs">
                  em curso{proxFecha && <> · fecha {proxFecha.slice(8)}/{proxFecha.slice(5, 7)}</>}
                </span>
                <span style={{ fontFamily: MONO }} className="font-semibold text-sm">{brl(ta)}</span>
              </div>
              {deOutros(lsA) > 0 && (
                <p style={{ color: C.tr }} className="text-xs mt-0.5">
                  seu {brl(meu(lsA))} · de outros {brl(deOutros(lsA))}
                </p>
              )}
            </div>
          );
        })}
      </div>

      {cobrancas.length > 0 && (
        <>
          <h2 style={{ fontFamily: DISPLAY }} className="text-lg font-bold mb-1">A cobrar</h2>
          <p style={{ color: C.muted }} className="text-sm mb-3">Compras de outras pessoas no seu cartão. Entram na fatura, mas não são gasto seu.</p>
          <div className="space-y-2 mb-6">
            {cobrancas.map(([quem, ls]) => (
              <div key={quem} style={{ background: C.surface, borderColor: C.tr }} className="rounded-xl border px-4 py-3">
                <div className="flex items-center justify-between mb-2">
                  <span className="text-sm font-medium">{quem}</span>
                  <span style={{ fontFamily: MONO, color: C.tr }} className="font-bold">{brl(soma(ls))}</span>
                </div>
                <div className="space-y-1 mb-2">
                  {ls.sort((a, b) => a.vencimento.localeCompare(b.vencimento)).map((l) => (
                    <div key={l.id} className="flex justify-between text-xs" style={{ color: C.muted }}>
                      <span>{l.vencimento.slice(8)}/{l.vencimento.slice(5, 7)} · {l.nome}
                        {l.parcelas && <> · {l.parcela}/{l.parcelas}</>}</span>
                      <span style={{ fontFamily: MONO }}>{brl(l.valor)}</span>
                    </div>
                  ))}
                </div>
                <div className="flex gap-2">
                  <button onClick={() => { navigator.clipboard?.writeText(
                    `${ls.map((l) => `${l.nome} — ${brl(l.valor)}`).join("\n")}\nTotal: ${brl(soma(ls))}`); flash("Lista copiada"); }}
                    style={{ borderColor: C.line }} className="flex-1 rounded-lg border py-1.5 text-xs">Copiar lista</button>
                  <button onClick={() => { upVarios(ls, { reembolso: "recebido" }); flash(`${quem} acertou ${brl(soma(ls))}`); }}
                    style={{ background: C.tr }} className="flex-1 rounded-lg py-1.5 text-xs text-white">{quem} me pagou</button>
                </div>
              </div>
            ))}
          </div>
        </>
      )}

      <h2 style={{ fontFamily: DISPLAY }} className="text-lg font-bold mb-2">A pagar neste mês</h2>
      {doMes.length === 0 && <Vazio>Nada em aberto. Tudo pago por aqui.</Vazio>}
      <div className="space-y-2 mb-6">
        {doMes.map((l) => <Linha key={l.id} l={l} {...{ catOf, subOf, contaOf, cartaoOf, anulado, up }} onPay={() => pagar(l)} plano />)}
      </div>

      {aReceber.length > 0 && (
        <>
          <h2 style={{ fontFamily: DISPLAY }} className="text-lg font-bold mb-2">A receber</h2>
          <div className="space-y-2">
            {aReceber.map((l) => <Linha key={l.id} l={l} {...{ catOf, subOf, contaOf, cartaoOf, anulado, up }} onPay={() => pagar(l)} plano />)}
          </div>
        </>
      )}
    </>
  );
}

/* ================================================================ futuro */
function Futuro({ d, setD, catOf, subOf, contaOf, cartaoOf, pagar, despagar, apagar, up, anulado, flash }) {
  const [janela, setJanela] = useState(12);
  const [de, setDe] = useState("");
  const [ate, setAte] = useState("");
  const [nome, setNome] = useState("");
  const [valor, setValor] = useState("");

  const limite = de && ate ? null : addMonths(today(), janela).slice(0, 7);
  const lista = d.lancamentos.filter((l) => {
    if (l.tipo === "entrada") return false;
    const k = ym(l.vencimento);
    if (k < mesAtual() && l.status === "pago") return false;
    if (de && ate) return k >= de && k <= ate;
    return k <= limite && k >= mesAtual();
  });

  const meses = useMemo(() => {
    const m = {};
    lista.forEach((l) => { const k = ym(l.vencimento); (m[k] = m[k] || []).push(l); });
    return Object.entries(m).sort((a, b) => a[0].localeCompare(b[0]));
  }, [d, janela, de, ate]);
  const max = Math.max(1, ...meses.map(([, ls]) => ls.filter((l) => l.status === "pendente").reduce((s, l) => s + l.valor, 0)));

  const addIntencao = () => {
    const v = num(valor); if (!nome || v <= 0) return;
    setD({ ...d, intencoes: [...(d.intencoes || []), { id: uid(), nome, valor: v, obs: "" }] });
    setNome(""); setValor("");
  };
  const virarConta = (i) => {
    setD({ ...d, intencoes: d.intencoes.filter((x) => x.id !== i.id),
      lancamentos: [{ id: uid(), tipo: "saida", nome: i.nome, valor: i.valor, catId: "outros", forma: "Pix",
        contaId: "nubank", vencimento: addMonths(today(), 1), pagamento: null, status: "pendente", obs: "", reembolso: "nao" }, ...d.lancamentos] });
    flash("Virou conta prevista — ajuste a data em Mais detalhes");
  };
  const totIntencoes = (d.intencoes || []).reduce((s, i) => s + i.valor, 0);

  return (
    <>
      <h2 style={{ fontFamily: DISPLAY }} className="text-lg font-bold mb-1">O que já está comprometido</h2>
      <p style={{ color: C.muted }} className="text-sm mb-3">Contas fixas, previstas e parcelas. Parcela adiantada continua no mês dela, marcada como paga.</p>

      <div className="flex flex-wrap items-center gap-2 mb-4">
        {[3, 4, 6, 12].map((n) => (
          <Chip key={n} ativo={!de && janela === n} cor={C.ink} onClick={() => { setJanela(n); setDe(""); setAte(""); }}>{n} meses</Chip>
        ))}
        <input type="month" value={de} onChange={(e) => setDe(e.target.value)} style={{ background: C.surface, borderColor: C.line }}
          className="rounded-full border px-3 py-1.5 text-xs outline-none" />
        <span style={{ color: C.muted }} className="text-xs">até</span>
        <input type="month" value={ate} onChange={(e) => setAte(e.target.value)} style={{ background: C.surface, borderColor: C.line }}
          className="rounded-full border px-3 py-1.5 text-xs outline-none" />
      </div>

      {meses.length === 0 && <Vazio>Nenhum compromisso nesse intervalo.</Vazio>}
      <div className="space-y-4">
        {meses.map(([k, ls]) => {
          const tot = ls.filter((l) => l.status === "pendente").reduce((s, l) => s + l.valor, 0);
          return (
            <div key={k} style={{ background: C.surface, borderColor: C.line }} className="rounded-2xl border p-4">
              <div className="flex items-baseline justify-between mb-2">
                <span style={{ fontFamily: DISPLAY }} className="font-bold capitalize">{mesLabel(k)}</span>
                <span style={{ fontFamily: MONO, color: C.due }} className="font-semibold">{brl(tot)}</span>
              </div>
              <div style={{ background: C.bg }} className="h-1.5 rounded-full mb-3 overflow-hidden">
                <div style={{ background: C.due, width: `${(tot / max) * 100}%` }} className="h-full" />
              </div>
              <div className="space-y-2">
                {ls.sort((a, b) => a.vencimento.localeCompare(b.vencimento)).map((l) => (
                  <Linha key={l.id} l={l} {...{ catOf, subOf, contaOf, cartaoOf, anulado, up }} plano
                    onPay={l.status === "pendente" ? () => pagar(l) : null}
                    onUndo={l.status === "pago" ? () => despagar(l.id) : null}
                    onDel={() => apagar(l.id)} />
                ))}
              </div>
            </div>
          );
        })}
      </div>

      <div className="flex items-baseline justify-between mt-8 mb-2">
        <h2 style={{ fontFamily: DISPLAY }} className="text-lg font-bold flex items-center gap-2"><Lightbulb size={18} /> Intenções</h2>
        <span style={{ fontFamily: MONO, color: C.muted }} className="text-sm">{brl(totIntencoes)}</span>
      </div>
      <p style={{ color: C.muted }} className="text-sm mb-3">Coisas que você quer reservar dinheiro para fazer. Não têm data e não entram no comprometido.</p>
      <div className="space-y-2 mb-3">
        {(d.intencoes || []).map((i) => (
          <div key={i.id} style={{ background: C.surface, borderColor: C.line }} className="rounded-xl border px-3 py-2.5 flex items-center gap-3">
            <span className="flex-1 text-sm">{i.nome}</span>
            <span style={{ fontFamily: MONO }} className="text-sm font-semibold">{brl(i.valor)}</span>
            <button onClick={() => virarConta(i)} style={{ borderColor: C.line }} className="rounded-lg border px-2 py-1 text-xs">virar conta</button>
            <button onClick={() => setD({ ...d, intencoes: d.intencoes.filter((x) => x.id !== i.id) })} style={{ color: C.muted }}><Trash2 size={14} /></button>
          </div>
        ))}
      </div>
      <div className="flex gap-2">
        <input value={nome} onChange={(e) => setNome(e.target.value)} placeholder="O que você quer fazer"

}

/* ============================================================== guardado */
function Guardado({ d, setD, guardadas, investidas, saldoConta, totalGuardado, totalInvestido, flash }) {
  const [mov, setMov] = useState(null);
  const [v, setV] = useState("");
  const [origem, setOrigem] = useState("nubank");
  const liquidas = d.contas.filter((c) => c.tipo === "banco" || c.tipo === "fisico");

  const transferir = (destinoId, sentido) => {
    const n = num(v); if (n <= 0) return;
    const de = sentido > 0 ? origem : destinoId, para = sentido > 0 ? destinoId : origem;
    setD({ ...d, lancamentos: [{ id: uid(), tipo: "transferencia", nome: sentido > 0 ? "Guardei" : "Retirei",
      valor: n, forma: "Pix", contaId: de, destinoId: para, vencimento: today(), pagamento: today(),
      status: "pago", obs: "", reembolso: "nao" }, ...d.lancamentos] });
    setMov(null); setV(""); flash(sentido > 0 ? "Guardado" : "Retirado");
  };

  const Bloco = ({ titulo, contas, total, cor }) => (
    <div className="mb-6">
      <div className="flex items-baseline justify-between mb-2">
        <h2 style={{ fontFamily: DISPLAY }} className="text-lg font-bold">{titulo}</h2>
        <span style={{ fontFamily: MONO, color: cor }} className="font-semibold">{brl(total)}</span>
      </div>
      <div className="space-y-2">
        {contas.map((c) => (
          <div key={c.id} style={{ background: C.surface, borderColor: C.line }} className="rounded-xl border p-4">
            <div className="flex items-center justify-between">
              <div><div className="text-sm font-medium">{c.nome}</div>
                {c.objetivo && <div style={{ color: C.muted }} className="text-xs">{c.objetivo}</div>}</div>
              <div className="flex items-center gap-3">
                <span style={{ fontFamily: MONO }} className="font-semibold">{brl(saldoConta(c.id))}</span>
                <button onClick={() => setMov(mov === c.id ? null : c.id)} style={{ borderColor: C.line }} className="rounded-lg border px-2 py-1 text-xs">mover</button>
              </div>
            </div>
            {mov === c.id && (
              <div className="mt-3">
                <div className="flex flex-wrap gap-2 mb-2">
                  {liquidas.map((o) => <Chip key={o.id} ativo={origem === o.id} cor={C.tr} onClick={() => setOrigem(o.id)}>{o.nome}</Chip>)}
                </div>
                <div className="flex gap-2">
                  <input value={v} onChange={(e) => setV(e.target.value)} inputMode="decimal" placeholder="0,00"
                    style={{ background: C.bg, borderColor: C.line, fontFamily: MONO }} className="flex-1 rounded-lg border px-3 py-2 text-sm outline-none" />
                  <button onClick={() => transferir(c.id, 1)} style={{ background: C.tr, color: "#fff" }} className="px-3 rounded-lg text-sm">Guardar</button>
                  <button onClick={() => transferir(c.id, -1)} style={{ background: C.ink, color: "#fff" }} className="px-3 rounded-lg text-sm">Retirar</button>
                </div>
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );

  return (<>
    <Bloco titulo="Caixinhas" contas={guardadas} total={totalGuardado} cor={C.saved} />
    <Bloco titulo="Investimentos" contas={investidas} total={totalInvestido} cor={C.inv} />
  </>);
}

/* =========================================================== relatórios */
function Relatorio({ d, catOf, anulado, alheio, M }) {
  const fora = (l) => anulado(l) || alheio(l);   // não conta como gasto seu
  const [janela, setJanela] = useState(1);
  const [de, setDe] = useState("");
  const [ate, setAte] = useState("");

  /* período avaliado, em meses ------------------------------------------ */
  const periodo = useMemo(() => {
    if (de && ate && de <= ate) {
      const ms = [];
      let k = de + "-01";
      while (ym(k) <= ate) { ms.push(ym(k)); k = addMonths(k, 1); }
      return ms;
    }
    return Array.from({ length: janela }, (_, i) => ym(addMonths(today(), -(janela - 1 - i))));
  }, [janela, de, ate]);

  const dentro = (l) => periodo.includes(ym(l.pagamento || l.vencimento));
  const rotulo = periodo.length === 1 ? mesLabel(periodo[0]) : `${mesLabel(periodo[0])} — ${mesLabel(periodo[periodo.length - 1])}`;

  const pagos = d.lancamentos.filter((l) => l.status === "pago" && l.tipo !== "transferencia" && dentro(l));
  const saidas = pagos.filter((l) => l.tipo === "saida");

  const orcamentos = d.categorias.filter((c) => c.id !== "renda").map((c) => {
    const ls = saidas.filter((l) => l.catId === c.id);
    return { ...c,
      teto: (c.orcamento || 0) * periodo.length,
      gasto: ls.filter((l) => !fora(l)).reduce((s, l) => s + l.valor, 0),
      reemb: ls.filter((l) => fora(l)).reduce((s, l) => s + l.valor, 0) };
  }).sort((a, b) => (b.gasto / (b.teto || 1)) - (a.gasto / (a.teto || 1)));

  const totReemb = saidas.filter(fora).reduce((s, l) => s + l.valor, 0);
  const porCat = orcamentos.filter((c) => c.gasto > 0).map((c) => ({ name: c.nome, value: +c.gasto.toFixed(2), cor: c.cor }));
  if (totReemb > 0) porCat.push({ name: "Não é meu", value: +totReemb.toFixed(2), cor: C.line });

  const porMes = useMemo(() => periodo.map((k) => {
    const ls = d.lancamentos.filter((l) => l.status === "pago" && l.tipo !== "transferencia" && ym(l.pagamento || l.vencimento) === k);
    return {
      mes: mesLabel(k),
      Entrou: +ls.filter((l) => l.tipo === "entrada").reduce((s, l) => s + l.valor, 0).toFixed(2),
      Saiu: +ls.filter((l) => l.tipo === "saida" && !fora(l)).reduce((s, l) => s + l.valor, 0).toFixed(2),
      "Não é meu": +ls.filter((l) => l.tipo === "saida" && fora(l)).reduce((s, l) => s + l.valor, 0).toFixed(2),
    };
  }), [d, periodo]);

  const entrou = pagos.filter((l) => l.tipo === "entrada").reduce((s, l) => s + l.valor, 0);
  const saiu = saidas.filter((l) => !fora(l)).reduce((s, l) => s + l.valor, 0);
  const totTeto = orcamentos.reduce((s, c) => s + c.teto, 0);
  const media = (v) => v / periodo.length;

  return (
    <>
      {/* seletor de período ------------------------------------------- */}
      <div className="flex flex-wrap items-center gap-2 mb-2">
        {[[1, "Este mês"], [3, "3 meses"], [4, "4 meses"], [6, "6 meses"], [12, "12 meses"]].map(([n, t]) => (
          <Chip key={n} ativo={!(de && ate) && janela === n} cor={C.ink} onClick={() => { setJanela(n); setDe(""); setAte(""); }}>{t}</Chip>
        ))}
        <input type="month" value={de} onChange={(e) => setDe(e.target.value)} style={{ background: C.surface, borderColor: C.line }}
          className="rounded-full border px-3 py-1.5 text-xs outline-none" />
        <span style={{ color: C.muted }} className="text-xs">até</span>
        <input type="month" value={ate} onChange={(e) => setAte(e.target.value)} style={{ background: C.surface, borderColor: C.line }}
          className="rounded-full border px-3 py-1.5 text-xs outline-none" />
      </div>
      <p style={{ color: C.muted }} className="text-xs mb-4 capitalize">
        {rotulo}{periodo.length > 1 ? ` · ${periodo.length} meses` : ""}
      </p>

      {/* totais -------------------------------------------------------- */}
      <div className="grid grid-cols-3 gap-2 mb-4">
        {[["Entrou", entrou, C.in], ["Saiu", saiu, C.out], ["Sobrou", entrou - saiu, entrou - saiu < 0 ? C.out : C.ink]].map(([n, v, c]) => (
          <div key={n} style={{ background: C.surface, borderColor: C.line }} className="rounded-xl border p-3">
            <div style={{ color: C.muted }} className="text-xs">{n}</div>
            <div style={{ fontFamily: MONO, color: c }} className="font-semibold text-sm sm:text-base">{brl(v)}</div>
            {periodo.length > 1 && <div style={{ fontFamily: MONO, color: C.muted }} className="text-xs">{brl(media(v))}/mês</div>}
            {n === "Saiu" && totReemb > 0 && <div style={{ fontFamily: MONO, color: C.muted }} className="text-xs">+{brl(totReemb)} não é meu</div>}
          </div>
        ))}
      </div>

      {/* orçamento ----------------------------------------------------- */}
      <div style={{ background: C.surface, borderColor: C.line }} className="rounded-2xl border p-4 mb-4">
        <div className="flex items-baseline justify-between mb-3">
          <h3 style={{ fontFamily: DISPLAY }} className="font-bold">Orçamento por categoria</h3>
          <span style={{ fontFamily: MONO, color: C.muted }} className="text-xs">{brl(saiu)} de {brl(totTeto)}</span>
        </div>
        <div className="space-y-3">
          {orcamentos.map((c) => {
            const pct = c.teto ? Math.min((c.gasto / c.teto) * 100, 100) : 0;
            const estourou = c.teto > 0 && c.gasto > c.teto;
            return (
              <div key={c.id}>
                <div className="flex items-baseline justify-between text-sm mb-1">
                  <span className="flex items-center gap-2">
                    <span style={{ background: c.cor }} className="w-2.5 h-2.5 rounded-full" />{c.nome}
                    {estourou && <span style={{ color: C.out }} className="text-xs flex items-center gap-0.5"><AlertTriangle size={11} /> estourou</span>}
                  </span>
                  <span style={{ fontFamily: MONO, color: estourou ? C.out : C.muted }} className="text-xs">
                    {brl(c.gasto)}{c.reemb > 0 ? ` (+${brl(c.reemb)} não é meu)` : ""}{c.teto ? ` / ${brl(c.teto)}` : " · sem limite"}
                  </span>
                </div>
                <div style={{ background: C.bg }} className="h-2 rounded-full overflow-hidden flex">
                  <div style={{ background: estourou ? C.out : c.cor, width: `${pct}%` }} className="h-full" />
                  {c.teto > 0 && c.reemb > 0 && (
                    <div style={{ background: C.line, width: `${Math.min((c.reemb / c.teto) * 100, 100 - pct)}%` }} className="h-full" />
                  )}
                </div>
              </div>
            );
          })}
        </div>
        <p style={{ color: C.muted }} className="text-xs mt-3">
          {periodo.length > 1
            ? `Limite mensal multiplicado pelos ${periodo.length} meses do período.`
            : "Reinicia todo dia 1º. O que sobra não acumula."}
        </p>
      </div>

      {/* pizza --------------------------------------------------------- */}
      <div style={{ background: C.surface, borderColor: C.line }} className="rounded-2xl border p-4 mb-4">
        <h3 style={{ fontFamily: DISPLAY }} className="font-bold mb-1">Para onde foi o dinheiro</h3>
        {porCat.length === 0 ? <Vazio>Sem gastos pagos neste período.</Vazio> : (
          <div className="flex flex-col sm:flex-row items-center gap-4">
            <div className="w-full sm:w-52 h-52">
              <Rosca dados={porCat} />
            </div>
            <div className="flex-1 w-full space-y-1.5">
              {porCat.map((c) => (
                <div key={c.name} className="flex items-center gap-2 text-sm">
                  <span style={{ background: c.cor }} className="w-2.5 h-2.5 rounded-full shrink-0" />
                  <span className="flex-1 truncate">{c.name}</span>
                  <span style={{ fontFamily: MONO, color: C.muted }} className="text-xs">
                    {((c.value / (porCat.reduce((s, x) => s + x.value, 0) || 1)) * 100).toFixed(0)}%
                  </span>
                  <span style={{ fontFamily: MONO }} className="text-xs">{brl(c.value)}</span>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>

      {/* barras -------------------------------------------------------- */}
      <div style={{ background: C.surface, borderColor: C.line }} className="rounded-2xl border p-4">
        <h3 style={{ fontFamily: DISPLAY }} className="font-bold mb-3">Entrou × saiu</h3>
        <div className="h-64">
          <Barras dados={porMes} series={[{ chave: "Entrou", cor: C.in }, { chave: "Saiu", cor: C.out }, { chave: "Não é meu", cor: C.line }]} />
        </div>
        <p style={{ color: C.muted }} className="text-xs mt-2">Transferências entre suas contas não aparecem aqui.</p>
      </div>
    </>
  );
}

/* ================================================================ ajustes */
function Ajustes({ d, setD, onClose, flash }) {
  const [aba, setAba] = useState("categorias");
  const set = (patch) => setD({ ...d, ...patch });

  const restaurar = async () => {
    if (!confirm("Isto substitui tudo que está neste aparelho pelo que está na planilha. Continuar?")) return;
    try {
      const url = d.sheetsUrl + (d.sheetsUrl.includes("?") ? "&" : "?") + "segredo=" + encodeURIComponent(d.sheetsSegredo || "");
      const r = await fetch(url);
      const j = await r.json();
      if (!j.ok) throw new Error(j.erro || "resposta inesperada");
      if (!j.dados) { flash("A planilha ainda está vazia"); return; }
      setD({ ...j.dados, sheetsUrl: d.sheetsUrl, sheetsSegredo: d.sheetsSegredo });
      flash("Dados restaurados da planilha");
    } catch (e) {
      flash("Não deu para puxar: " + e.message);
    }
  };

  const exportar = () => {
    const blob = new Blob([JSON.stringify(d, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = `caderneta-${today()}.json`; a.click();
  };
  const importar = (e) => {
    const f = e.target.files?.[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { setD(JSON.parse(r.result)); flash("Dados importados"); } catch { flash("Arquivo inválido"); } };
    r.readAsText(f);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-6" style={{ background: "rgba(20,24,36,0.45)" }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} style={{ background: C.bg }} className="w-full max-w-lg rounded-t-2xl sm:rounded-2xl p-5 max-h-full overflow-auto">
        <div className="flex items-center justify-between mb-4">
          <h2 style={{ fontFamily: DISPLAY }} className="text-xl font-bold">Ajustes</h2>
          <button onClick={onClose}><X size={20} /></button>
        </div>
        <div className="flex flex-wrap gap-2 mb-4">
          {[["categorias", "Categorias"], ["contas", "Contas"], ["cartoes", "Cartões"], ["recorrentes", "Recorrentes"], ["dados", "Dados"]].map(([k, t]) => (
            <Chip key={k} ativo={aba === k} cor={C.ink} onClick={() => setAba(k)}>{t}</Chip>
          ))}
        </div>
        {aba === "categorias" && <AbaCategorias d={d} set={set} />}
        {aba === "contas" && <AbaContas d={d} set={set} />}
        {aba === "cartoes" && <AbaCartoes d={d} set={set} />}
        {aba === "recorrentes" && <AbaRecorrentes d={d} set={set} flash={flash} />}
        {aba === "dados" && (
          <>
            <Rotulo>Sincronia com a planilha</Rotulo>
            <input value={d.sheetsUrl || ""} onChange={(e) => set({ ...d, sheetsUrl: e.target.value.trim() })}
              placeholder="Cole aqui o endereço do Apps Script"
              style={{ background: C.bg, borderColor: C.line, color: C.ink }} className="w-full rounded-xl border px-3 py-2 text-sm outline-none mb-2" />
            <input value={d.sheetsSegredo || ""} onChange={(e) => set({ ...d, sheetsSegredo: e.target.value.trim() })}
              placeholder="Frase secreta (a mesma do script)"
              style={{ background: C.bg, borderColor: C.line, color: C.ink }} className="w-full rounded-xl border px-3 py-2 text-sm outline-none mb-2" />
            <p style={{ color: C.muted }} className="text-xs mb-3">
              {d.sheetsUrl
                ? "Cada alteração vai para a planilha em segundo plano. Se a internet cair, o app guarda e reenvia sozinho quando voltar."
                : "Sem endereço, os dados ficam só neste aparelho. Exporte o JSON de vez em quando para não depender de um lugar só."}
            </p>
            {d.sheetsUrl && (
              <button onClick={restaurar} style={{ background: C.surface, borderColor: C.line }}
                className="w-full rounded-xl border py-2 text-sm flex items-center justify-center gap-1.5 mb-4">
                <Download size={15} /> Puxar da planilha
              </button>
            )}

            <Rotulo>Cópia manual</Rotulo>
            <div className="flex gap-2">
              <button onClick={exportar} style={{ background: C.surface, borderColor: C.line }} className="flex-1 rounded-xl border py-2 text-sm flex items-center justify-center gap-1.5"><Download size={15} /> Exportar JSON</button>
              <label style={{ background: C.surface, borderColor: C.line }} className="flex-1 rounded-xl border py-2 text-sm flex items-center justify-center gap-1.5 cursor-pointer">
                <Upload size={15} /> Importar<input type="file" accept="application/json" onChange={importar} className="hidden" /></label>
            </div>
            <p style={{ color: C.muted }} className="text-xs mt-3">
              O app sempre grava primeiro neste aparelho, por isso nunca trava esperando a internet.
            </p>
          </>
        )}
      </div>
    </div>
  );
}

      </div>
      <p style={{ color: C.muted }} className="text-xs mb-2">O valor à direita é o saldo inicial. Ajuste-o para o saldo real de hoje.</p>
      <div className="flex flex-wrap gap-2 mb-2">{tipos.map(([k, t]) => <Chip key={k} ativo={tipo === k} cor={C.ink} onClick={() => setTipo(k)}>{t}</Chip>)}</div>
      <div className="flex gap-2">
        <input value={nome} onChange={(e) => setNome(e.target.value)} placeholder="Nome da conta"
          style={{ background: C.surface, borderColor: C.line }} className="flex-1 rounded-xl border px-3 py-2 text-sm outline-none" />
        <input value={saldo} onChange={(e) => setSaldo(e.target.value)} placeholder="Saldo" inputMode="decimal"
          style={{ background: C.surface, borderColor: C.line }} className="w-24 rounded-xl border px-3 py-2 text-sm outline-none" />
        <button onClick={() => { if (!nome) return; set({ contas: [...d.contas, { id: uid(), nome, tipo, saldoInicial: num(saldo) }] }); setNome(""); setSaldo(""); }}
          style={{ background: C.ink, color: "#fff" }} className="px-4 rounded-xl text-sm">Criar</button>
      </div>
    </>
  );
}

function AbaCartoes({ d, set }) {
  const [f, setF] = useState({ nome: "", dono: "eu", fecha: 3, vence: 10, contaPagamentoId: d.contas[2]?.id });
  const upC = (id, patch) => set({ cartoes: d.cartoes.map((c) => (c.id === id ? { ...c, ...patch } : c)) });
  return (
    <>
      <div className="space-y-2 mb-3">
        {d.cartoes.map((c) => (
          <div key={c.id} style={{ background: C.surface, borderColor: C.line }} className="rounded-xl border p-3">
            <div className="flex items-center gap-2 mb-2">
              <CreditCard size={15} />
              <input value={c.nome} onChange={(e) => upC(c.id, { nome: e.target.value })} className="flex-1 text-sm bg-transparent outline-none" />
              <button onClick={() => set({ cartoes: d.cartoes.filter((x) => x.id !== c.id) })} style={{ color: C.muted }}><Trash2 size={14} /></button>
            </div>
            <div className="grid grid-cols-2 gap-2 text-xs">
              <label style={{ color: C.muted }}>Dono
                <input value={c.dono} onChange={(e) => upC(c.id, { dono: e.target.value })} style={{ background: C.bg, borderColor: C.line, color: C.ink }} className="w-full rounded-lg border px-2 py-1 mt-0.5 outline-none" /></label>
              <label style={{ color: C.muted }}>Paga com
                <select value={c.contaPagamentoId} onChange={(e) => upC(c.id, { contaPagamentoId: e.target.value })} style={{ background: C.bg, borderColor: C.line, color: C.ink }} className="w-full rounded-lg border px-2 py-1 mt-0.5 outline-none">
                  {d.contas.filter((x) => x.tipo === "banco" || x.tipo === "fisico").map((x) => <option key={x.id} value={x.id}>{x.nome}</option>)}
                </select></label>
              <label style={{ color: C.muted }}>Fecha dia
                <input type="number" min="1" max="28" value={c.fecha} onChange={(e) => upC(c.id, { fecha: +e.target.value })} style={{ background: C.bg, borderColor: C.line, color: C.ink }} className="w-full rounded-lg border px-2 py-1 mt-0.5 outline-none" /></label>
              <label style={{ color: C.muted }}>Vence dia
                <input type="number" min="1" max="28" value={c.vence} onChange={(e) => upC(c.id, { vence: +e.target.value })} style={{ background: C.bg, borderColor: C.line, color: C.ink }} className="w-full rounded-lg border px-2 py-1 mt-0.5 outline-none" /></label>
            </div>
          </div>
        ))}
      </div>
      <div className="flex gap-2">
        <input value={f.nome} onChange={(e) => setF({ ...f, nome: e.target.value })} placeholder="Nome do cartão"
          style={{ background: C.surface, borderColor: C.line }} className="flex-1 rounded-xl border px-3 py-2 text-sm outline-none" />
        <input value={f.dono} onChange={(e) => setF({ ...f, dono: e.target.value })} placeholder="Dono"
          style={{ background: C.surface, borderColor: C.line }} className="w-24 rounded-xl border px-3 py-2 text-sm outline-none" />
        <button onClick={() => { if (!f.nome) return; set({ cartoes: [...d.cartoes, { ...f, id: uid() }] }); setF({ ...f, nome: "" }); }}
          style={{ background: C.ink, color: "#fff" }} className="px-4 rounded-xl text-sm">Criar</button>
      </div>
    </>
  );
}

function AbaRecorrentes({ d, set, flash }) {
  const [f, setF] = useState({ nome: "", valor: "", dia: 5, variavel: false, fimTipo: "nunca", fimData: "", vezes: 12 });
  const upR = (id, patch) => set({ recorrentes: d.recorrentes.map((r) => (r.id === id ? { ...r, ...patch } : r)) });
  return (
    <>
      <div className="space-y-2 mb-3">
        {d.recorrentes.map((r) => (
          <div key={r.id} style={{ background: C.surface, borderColor: C.line }} className="rounded-xl border p-3">
            <div className="flex items-center gap-2">
              <Repeat size={14} />
              <input value={r.nome} onChange={(e) => upR(r.id, { nome: e.target.value })} className="flex-1 text-sm bg-transparent outline-none" />
              <span style={{ color: C.muted }} className="text-xs">dia {r.dia}</span>
              <span style={{ fontFamily: MONO }} className="text-sm">{brl(r.valor)}</span>
              <button onClick={() => set({ recorrentes: d.recorrentes.filter((x) => x.id !== r.id) })} style={{ color: C.muted }}><Trash2 size={14} /></button>
            </div>
            <div className="flex flex-wrap items-center gap-2 mt-2">
              <Chip ativo={!r.variavel} cor={C.ink} onClick={() => upR(r.id, { variavel: false })}>Valor fixo</Chip>
              <Chip ativo={r.variavel} cor={C.due} onClick={() => upR(r.id, { variavel: true })}>Valor variável</Chip>
              <span style={{ color: C.muted }} className="text-xs">
                {r.fim?.tipo === "nunca" && "sem fim"}
                {r.fim?.tipo === "data" && `até ${r.fim.data}`}
                {r.fim?.tipo === "vezes" && `${r.fim.vezes}×`}
              </span>
            </div>
          </div>
        ))}
      </div>
      <div style={{ background: C.surface, borderColor: C.line }} className="rounded-xl border p-3">
        <div className="flex gap-2 mb-2">
          <input value={f.nome} onChange={(e) => setF({ ...f, nome: e.target.value })} placeholder="Nome"
            style={{ background: C.bg, borderColor: C.line }} className="flex-1 rounded-lg border px-3 py-2 text-sm outline-none" />
          <input value={f.valor} onChange={(e) => setF({ ...f, valor: e.target.value })} placeholder="Valor" inputMode="decimal"
            style={{ background: C.bg, borderColor: C.line }} className="w-24 rounded-lg border px-3 py-2 text-sm outline-none" />
          <input type="number" min="1" max="28" value={f.dia} onChange={(e) => setF({ ...f, dia: +e.target.value })}
            style={{ background: C.bg, borderColor: C.line }} className="w-16 rounded-lg border px-2 py-2 text-sm outline-none" />
        </div>
        <div className="flex flex-wrap gap-2 mb-2">
          <Chip ativo={!f.variavel} cor={C.ink} onClick={() => setF({ ...f, variavel: false })}>Valor fixo</Chip>
          <Chip ativo={f.variavel} cor={C.due} onClick={() => setF({ ...f, variavel: true })}>Valor variável</Chip>
        </div>
        <div className="flex flex-wrap items-center gap-2 mb-2">
          {[["nunca", "Sem fim"], ["data", "Até uma data"], ["vezes", "Número de vezes"]].map(([k, t]) => (
            <Chip key={k} ativo={f.fimTipo === k} cor={C.saved} onClick={() => setF({ ...f, fimTipo: k })}>{t}</Chip>
          ))}
          {f.fimTipo === "data" && <input type="date" value={f.fimData} onChange={(e) => setF({ ...f, fimData: e.target.value })}
            style={{ background: C.bg, borderColor: C.line }} className="rounded-lg border px-2 py-1 text-xs outline-none" />}
          {f.fimTipo === "vezes" && <input type="number" min="1" value={f.vezes} onChange={(e) => setF({ ...f, vezes: +e.target.value })}
            style={{ background: C.bg, borderColor: C.line }} className="w-16 rounded-lg border px-2 py-1 text-xs outline-none" />}
        </div>
        <button onClick={() => {
          if (!f.nome || num(f.valor) <= 0) return;
          set({ recorrentes: [...d.recorrentes, { id: uid(), nome: f.nome, valor: num(f.valor), dia: f.dia, catId: "fixas",
            forma: "Boleto", contaId: d.contas.find((c) => c.tipo === "banco")?.id, variavel: f.variavel,
            fim: f.fimTipo === "nunca" ? { tipo: "nunca" } : f.fimTipo === "data" ? { tipo: "data", data: f.fimData } : { tipo: "vezes", vezes: f.vezes } }] });
          setF({ ...f, nome: "", valor: "" });
          flash("Recorrente criada — reabra o app para gerar os meses");
        }} style={{ background: C.ink, color: "#fff" }} className="w-full py-2 rounded-lg text-sm">Criar recorrente</button>
      </div>
    </>
  );
}

/* =========================================================== componentes */
const Rotulo = ({ children }) => <div style={{ color: C.muted }} className="text-xs uppercase tracking-wider mb-2">{children}</div>;

const Chip = ({ ativo, cor, children, onClick }) => (
  <button onClick={onClick} style={{ background: ativo ? cor : C.bg, color: ativo ? "#fff" : C.ink, borderColor: ativo ? cor : C.line }}
    className="rounded-full border px-3 py-1.5 text-xs font-medium">{children}</button>
);

const Vazio = ({ children }) => <p style={{ color: C.muted }} className="text-sm py-4">{children}</p>;

const Tag = ({ cor, children }) => (
  <span style={{ background: cor + "1A", color: cor }} className="rounded-full px-1.5 py-0.5 text-xs font-medium">{children}</span>
);

function Linha({ l, catOf, subOf, contaOf, cartaoOf, anulado, up, onPay, onUndo, onDel, plano }) {
  const cat = l.catId ? catOf(l.catId) : { nome: "Transferência", cor: C.tr };
  const sub = l.catId && l.subId ? subOf(l.catId, l.subId) : null;
  const via = l.cartaoId
    ? `${cartaoOf(l.cartaoId)?.nome || "cartão"}`
    : l.tipo === "transferencia"
      ? `${contaOf(l.contaId)?.nome || "?"} → ${contaOf(l.destinoId)?.nome || "?"}`
      : contaOf(l.contaId)?.nome || "—";
  const cor = CORTIPO[l.tipo] || C.ink;
  const pagoAdiantado = l.status === "pago" && l.pagamento && ym(l.pagamento) < ym(l.vencimento);

  return (
    <div style={{ background: C.surface, borderColor: C.line }} className="rounded-xl border px-3 py-2.5 flex items-center gap-3">
      <span style={{ background: anulado(l) ? C.line : cat.cor }} className="w-1.5 h-9 rounded-full shrink-0" />
      <div className="min-w-0 flex-1">
        <div className="text-sm font-medium truncate flex items-center gap-1.5">
          <span className="truncate" style={{ color: anulado(l) ? C.muted : C.ink }}>{l.nome}</span>
          {l.parcelas && <span style={{ color: C.muted }} className="font-normal shrink-0">{l.parcela}/{l.parcelas}</span>}
          {l.conferir && l.status === "pendente" && <Tag cor={C.due}>conferir</Tag>}
          {pagoAdiantado && <Tag cor={C.in}>paga em {mesLabel(ym(l.pagamento))}</Tag>}
          {l.deQuem && <Tag cor={C.tr}>gasto de {l.deQuem}</Tag>}
          {!l.deQuem && l.reembolso === "aguardando" && <Tag cor={C.tr}>a reembolsar</Tag>}
          {!l.deQuem && l.reembolso === "recebido" && <Tag cor={C.in}>reembolsada</Tag>}
          {l.deQuem && l.reembolso === "recebido" && <Tag cor={C.in}>acertado</Tag>}
        </div>
        <div style={{ color: C.muted }} className="text-xs truncate">
          {cat.nome}{sub ? ` · ${sub.nome}` : ""} · {l.forma ? `${l.forma} · ` : ""}{via} · {plano || !l.pagamento ? `vence ${dm(l.vencimento)}` : dm(l.pagamento)}
          {l.obs ? ` · ${l.obs}` : ""}
        </div>
      </div>
      <span style={{ fontFamily: MONO, color: anulado(l) ? C.muted : cor }} className="text-sm font-semibold shrink-0">
        {l.tipo === "entrada" ? "+" : l.tipo === "saida" ? "−" : "↔"}{brl(l.valor).replace("R$ ", "")}
      </span>
      {l.reembolso === "aguardando" && (
        <button onClick={() => up(l.id, { reembolso: "recebido" })} title={l.deQuem ? `${l.deQuem} me pagou` : "Marcar reembolso recebido"} style={{ borderColor: C.line, color: C.tr }} className="rounded-lg border p-1.5 shrink-0"><RotateCcw size={14} /></button>
      )}
      {onPay && <button onClick={onPay} title="Marcar como pago" style={{ borderColor: C.line, color: C.in }} className="rounded-lg border p-1.5 shrink-0"><Check size={14} /></button>}
      {onUndo && <button onClick={onUndo} title="Desfazer pagamento" style={{ borderColor: C.line, color: C.muted }} className="rounded-lg border p-1.5 shrink-0"><RotateCcw size={14} /></button>}
      {onDel && <button onClick={onDel} title="Apagar" style={{ color: C.muted }} className="p-1 shrink-0"><Trash2 size={14} /></button>}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("raiz")).render(<App />);
</script>
