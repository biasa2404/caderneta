/* ------------------------------------------------------------ gráficos */
/* rosca em SVG puro, sem biblioteca */
function Rosca({ dados, tamanho = 208, interno = 45, externo = 72, onFatia }) {
  const total = dados.reduce((s, d) => s + d.value, 0) || 1;
  const cx = tamanho / 2, cy = tamanho / 2;
  let ang = -Math.PI / 2;
  const [ativo, setAtivo] = useState(null);

  const arco = (ini, fim, r) => {
    const x1 = cx + r * Math.cos(ini), y1 = cy + r * Math.sin(ini);
    const x2 = cx + r * Math.cos(fim), y2 = cy + r * Math.sin(fim);
    return { x1, y1, x2, y2, grande: fim - ini > Math.PI ? 1 : 0 };
  };

  const fatias = dados.map((d, i) => {
    const fracao = d.value / total;
    const ini = ang, fim = ang + fracao * Math.PI * 2 - (dados.length > 1 ? 0.02 : 0);
    ang += fracao * Math.PI * 2;
    const fora = arco(ini, fim, externo), dentro = arco(fim, ini, interno);
    return { ...d, i, fracao,
      caminho: `M${fora.x1} ${fora.y1} A${externo} ${externo} 0 ${fora.grande} 1 ${fora.x2} ${fora.y2}
                L${dentro.x1} ${dentro.y1} A${interno} ${interno} 0 ${fora.grande} 0 ${dentro.x2} ${dentro.y2} Z` };
  });

  const sel = ativo != null ? fatias[ativo] : null;
  return (
    <svg viewBox={`0 0 ${tamanho} ${tamanho}`} className="w-full h-full" role="img"
      aria-label="Divisão dos gastos por categoria">
      {fatias.map((f) => (
        <path key={f.i} d={f.caminho} fill={f.cor}
          opacity={ativo == null || ativo === f.i ? 1 : 0.35}
          onMouseEnter={() => setAtivo(f.i)} onMouseLeave={() => setAtivo(null)}
          onTouchStart={() => setAtivo(f.i)}
          onClick={() => onFatia && onFatia(f)}
          style={{ cursor: "pointer", transition: "opacity .15s" }}>
          <title>{`${f.name}: ${brl(f.value)}`}</title>
        </path>
      ))}
      {sel && (
        <>
          <text x={cx} y={cy - 4} textAnchor="middle" style={{ fontFamily: MONO, fontSize: 13, fill: C.ink, fontWeight: 600 }}>
            {brl(sel.value).replace("R$ ", "")}
          </text>
          <text x={cx} y={cy + 12} textAnchor="middle" style={{ fontSize: 10, fill: C.muted }}>
            {(sel.fracao * 100).toFixed(0)}%
          </text>
        </>
      )}
    </svg>
  );
}

/* barras agrupadas em SVG puro */
function Barras({ dados, series, altura = 256, onColuna }) {
  const [ativo, setAtivo] = useState(null);
  const L = 46, R = 6, T = 8, B = 42;                       // margens
  const larg = 600, alt = altura;
  const areaL = larg - L - R, areaA = alt - T - B;

  const max = Math.max(1, ...dados.flatMap((d) => series.map((s) => d[s.chave] || 0)));
  const passo = (() => {                                   // escala legível
    const bruto = max / 4, exp = Math.pow(10, Math.floor(Math.log10(bruto)));
    return Math.ceil(bruto / exp) * exp;
  })();
  const teto = Math.ceil(max / passo) * passo || 1;
  const linhas = Array.from({ length: Math.round(teto / passo) + 1 }, (_, i) => i * passo);

  const lgGrupo = areaL / (dados.length || 1);
  const lgBarra = Math.min(22, (lgGrupo * 0.7) / series.length);

  return (
    <div className="w-full h-full flex flex-col">
      <svg viewBox={`0 0 ${larg} ${alt}`} preserveAspectRatio="none" className="w-full flex-1" role="img"
        aria-label="Comparação entre o que entrou e o que saiu por mês">
        {linhas.map((v) => {
          const y = T + areaA - (v / teto) * areaA;
          return (
            <g key={v}>
              <line x1={L} y1={y} x2={larg - R} y2={y} stroke={C.line} strokeWidth="1" />
              <text x={L - 6} y={y + 3} textAnchor="end" style={{ fontSize: 10, fill: C.muted, fontFamily: MONO }}>
                {v >= 1000 ? (v / 1000).toFixed(v % 1000 ? 1 : 0) + "k" : v}
              </text>
            </g>
          );
        })}
        {dados.map((d, gi) => {
          const base = L + gi * lgGrupo + lgGrupo / 2 - (lgBarra * series.length) / 2;
          return (
            <g key={gi} onClick={() => onColuna && onColuna(d)} style={{ cursor: onColuna ? "pointer" : "default" }}>
              <rect x={L + gi * lgGrupo} y={T} width={lgGrupo} height={areaA} fill="transparent" />
              {series.map((s, si) => {
                const v = d[s.chave] || 0;
                const h = (v / teto) * areaA;
                const x = base + si * lgBarra;
                const y = T + areaA - h;
                return h > 0 ? (
                  <rect key={s.chave} x={x} y={y} width={lgBarra - 2} height={h} rx="3" fill={s.cor}
                    opacity={ativo == null || ativo === gi ? 1 : 0.4}
                    onMouseEnter={() => setAtivo(gi)} onMouseLeave={() => setAtivo(null)}
                    onTouchStart={() => setAtivo(gi)} style={{ transition: "opacity .15s" }}>
                    <title>{`${d.mes} · ${s.chave}: ${brl(v)}`}</title>
                  </rect>
                ) : null;
              })}
              <text x={L + gi * lgGrupo + lgGrupo / 2} y={alt - B + 14} textAnchor="middle"
                style={{ fontSize: 10, fill: ativo === gi ? C.ink : C.muted }}>{d.mes}</text>
            </g>
          );
        })}
      </svg>
      <div className="flex flex-wrap justify-center gap-x-4 gap-y-1 pt-1">
        {series.map((s) => (
          <span key={s.chave} style={{ color: C.muted }} className="flex items-center gap-1.5 text-xs">
            <span style={{ background: s.cor }} className="w-2 h-2 rounded-full inline-block" />{s.chave}
          </span>
        ))}
      </div>
      {ativo != null && (
        <div style={{ color: C.muted, fontFamily: MONO }} className="text-xs text-center pt-1">
          {dados[ativo].mes}: {series.map((s) => `${s.chave} ${brl(dados[ativo][s.chave] || 0)}`).join(" · ")}
        </div>
      )}
    </div>
  );
}

/* --------------------------------------------------------- armazenamento */
/* mesma interface do window.storage do chat, agora sobre IndexedDB.
   IndexedDB sobrevive melhor que localStorage e cabe muito mais coisa. */
window.storage = (() => {
  const DB = "caderneta", LOJA = "kv";
  let pronto = null;

  const abrir = () => (pronto ||= new Promise((ok, erro) => {
    const req = indexedDB.open(DB, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(LOJA);
    req.onsuccess = () => ok(req.result);
    req.onerror = () => erro(req.error);
  }));

  const tx = async (modo, fn) => {
    const db = await abrir();
    return new Promise((ok, erro) => {
      const t = db.transaction(LOJA, modo);
      const req = fn(t.objectStore(LOJA));
      req.onsuccess = () => ok(req.result);
      req.onerror = () => erro(req.error);
    });
  };

  return {
    async get(k) { const v = await tx("readonly", (s) => s.get(k)); return v == null ? null : { key: k, value: v }; },
    async set(k, v) { await tx("readwrite", (s) => s.put(v, k)); return { key: k, value: v }; },
    async delete(k) { await tx("readwrite", (s) => s.delete(k)); return { key: k, deleted: true }; },
  };
})();


/* ================================================== aplicação */

/* =====================================================================
   caderneta — sincronia registro a registro

   Ideia: em vez de mandar o estado inteiro (que sobrescreve tudo),
   o app descobre quais registros mudaram desde a última sincronia e
   manda só esses. A planilha mescla por identificador.

   Cada registro ganha um carimbo `mEm` (modificado em, milissegundos).
   Quando dois aparelhos mexem no MESMO registro, vence o carimbo maior.
   Quando mexem em registros DIFERENTES, os dois sobrevivem.
   ===================================================================== */

const COLECOES = ["lancamentos", "contas", "cartoes", "categorias", "recorrentes", "intencoes", "cancelados"];

/* Chaves que são configuração do aparelho, não dado compartilhado. */
const SO_LOCAL = ["sheetsUrl", "sheetsSegredo", "ateOnde", "painelAgora", "v"];

/* Compara dois registros ignorando o carimbo. */
const mesmoConteudo = (a, b) => {
  if (!a || !b) return false;
  const limpo = (r) => { const { mEm, ...resto } = r; return JSON.stringify(resto); };
  return limpo(a) === limpo(b);
};

/* Transforma o estado num mapa coleção → id → registro. */
function indexar(d) {
  const m = {};
  for (const col of COLECOES) {
    m[col] = {};
    for (const r of d[col] || []) if (r && r.id) m[col][r.id] = r;
  }
  return m;
}

/**
 * Descobre o que mudou entre o último estado sincronizado (base) e o atual.
 * Devolve a lista de mudanças e o estado com os carimbos atualizados.
 */
function detectarMudancas(base, atual, agora = Date.now()) {
  const iBase = indexar(base || { });
  const iAtual = indexar(atual);
  const mudancas = [];
  const novo = { ...atual };

  for (const col of COLECOES) {
    const lista = [];
    for (const r of atual[col] || []) {
      const antes = iBase[col]?.[r.id];
      if (!antes) {                                   // registro novo
        const carimbado = { ...r, mEm: r.mEm || agora };
        lista.push(carimbado);
        mudancas.push({ col, id: r.id, mEm: carimbado.mEm, rec: carimbado });
      } else if (!mesmoConteudo(antes, r)) {          // registro alterado
        const carimbado = { ...r, mEm: agora };
        lista.push(carimbado);
        mudancas.push({ col, id: r.id, mEm: agora, rec: carimbado });
      } else {
        lista.push(r);                                // igual: não manda
      }
    }
    novo[col] = lista;

    for (const id of Object.keys(iBase[col] || {})) { // apagados
      if (!iAtual[col]?.[id]) mudancas.push({ col, id, mEm: agora, del: true });
    }
  }
  return { mudancas, estado: novo };
}

/**
 * Aplica no estado local as mudanças que vieram da planilha.
 * Só sobrescreve um registro se o carimbo de fora for mais novo.
 */
function aplicarMudancas(d, mudancas) {
  if (!mudancas?.length) return { estado: d, aplicadas: 0 };
  const idx = indexar(d);
  const porCol = {};
  for (const m of mudancas) (porCol[m.col] ||= []).push(m);

  const novo = { ...d };
  let aplicadas = 0;

  for (const col of Object.keys(porCol)) {
    const mapa = { ...(idx[col] || {}) };
    for (const m of porCol[col]) {
      const meu = mapa[m.id];
      const meuCarimbo = meu?.mEm || 0;
      if (m.mEm <= meuCarimbo) continue;              // o meu é mais novo: mantém
      aplicadas++;
      if (m.del) delete mapa[m.id];
      else mapa[m.id] = { ...m.rec, mEm: m.mEm };
    }
    // preserva a ordem original e acrescenta os que chegaram agora
    const vistos = new Set();
    const lista = [];
    for (const r of d[col] || []) {
      if (mapa[r.id]) { lista.push(mapa[r.id]); vistos.add(r.id); }
    }
    for (const id of Object.keys(mapa)) if (!vistos.has(id)) lista.push(mapa[id]);
    novo[col] = lista;
  }
  return { estado: novo, aplicadas };
}

/* Cópia do estado sem as chaves locais, para servir de base de comparação. */
function baseDe(d) {
  const b = {};
  for (const col of COLECOES) b[col] = (d[col] || []).map((r) => ({ ...r }));
  return b;
}

/* =============================================================== tokens */
const C = {
  bg: "#E9EBF1", surface: "#FFFFFF", line: "#D9DCE6", ink: "#141824", muted: "#727892",
  out: "#C42B5C", in: "#0E7C61", tr: "#1D6FA8", due: "#B26A00", saved: "#3B3FA8", inv: "#8A3FBF",
};
const DISPLAY = "'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif";
const BODY = "'Inter', system-ui, -apple-system, sans-serif";
const MONO = "'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace";
const CORTIPO = { entrada: C.in, saida: C.out, transferencia: C.tr };

/* ============================================================== helpers */
const brl = (v) => (v < 0 ? "-" : "") + "R$ " + Math.abs(v || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
/* Entende o que a pessoa digitou: "1.234,56", "1234,56", "12.9", "12,9", "247".
   A regra: se tem vírgula, ela é o decimal e o ponto é milhar. Se só tem ponto,
   ele é decimal quando sobram 1 ou 2 dígitos depois — senão é milhar. */
const num = (s) => {
  let t = String(s ?? "").trim().replace(/[^\d.,-]/g, "");
  if (!t) return 0;
  const temVirgula = t.includes(",");
  if (temVirgula) {
    t = t.replace(/\./g, "").replace(",", ".");
  } else {
    const partes = t.split(".");
    if (partes.length > 2) t = t.replace(/\./g, "");                 // 1.234.567
    else if (partes.length === 2 && partes[1].length === 3) t = partes.join("");  // 1.234
  }
  const n = parseFloat(t);
  return Number.isFinite(n) ? n : 0;
};
const iso = (d) => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`; };
const today = () => iso(new Date());
const ym = (s) => (s || "").slice(0, 7);
const mesAtual = () => today().slice(0, 7);
const addMonths = (s, n) => {
  const [y, m, d] = s.split("-").map(Number);
  const dt = new Date(y, m - 1 + n, 1);
  const last = new Date(dt.getFullYear(), dt.getMonth() + 1, 0).getDate();
  return iso(new Date(dt.getFullYear(), dt.getMonth(), Math.min(d, last)));
};
const mesLabel = (k) => { const [y, m] = k.split("-").map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString("pt-BR", { month: "short", year: "2-digit" }).replace(".", ""); };

/* ================================================= geração de recorrentes */
function gerar(d, meses = 12) {
  const out = [...d.lancamentos];
  const base = today();
  (d.recorrentes || []).forEach((r) => {
    let feitas = out.filter((l) => l.recId === r.id).length;
    for (let i = 0; i < meses; i++) {
      const venc = addMonths(`${base.slice(0, 7)}-${String(r.dia).padStart(2, "0")}`, i);
      if (venc < base) continue;
      if (r.fim?.tipo === "data" && r.fim.data && venc > r.fim.data) break;
      if (r.fim?.tipo === "vezes" && feitas >= r.fim.vezes) break;
      const src = `${r.id}#${ym(venc)}`;
      if (out.some((l) => l.src === src)) { continue; }
      if ((d.cancelados || []).some((c) => c.id === src)) { continue; }   // você apagou esta de propósito
      const ult = out.filter((l) => l.recId === r.id && l.status === "pago").sort((a, b) => (b.pagamento || "").localeCompare(a.pagamento || ""))[0];
      out.push({
        // o identificador vem do src, não é sorteado: assim celular e notebook
        // geram exatamente o mesmo registro e a sincronia não duplica nada
        id: "r_" + src, src, recId: r.id, nome: r.nome, valor: ult ? ult.valor : r.valor, tipo: "saida",
        catId: r.catId, subId: r.subId, forma: r.forma, contaId: r.contaId || null, cartaoId: r.cartaoId || null,
        vencimento: venc, pagamento: null, status: "pendente", obs: "", reembolso: "nao", conferir: !!r.variavel,
      });
      feitas++;
    }
  });
  return { ...d, lancamentos: out };
}

/* ============================================================== análise */

/** Todos os meses entre o primeiro lançamento e agora. */
function mesesComMovimento(d, limite = 24) {
  const datas = (d.lancamentos || []).map((l) => ym(l.pagamento || l.vencimento)).filter(Boolean).sort();
  if (!datas.length) return [mesAtual()];
  const fim = mesAtual();
  let k = datas[0] > fim ? fim : datas[0];
  const out = [];
  while (k <= fim && out.length < 400) { out.push(k); k = ym(addMonths(k + "-01", 1)); }
  return out.slice(-limite);
}

/** Saldo de uma conta no último dia de um mês, reconstruído do histórico. */
function saldoNoFim(d, id, mes) {
  const c = (d.contas || []).find((x) => x.id === id);
  if (!c) return 0;
  const dentro = (l) => l.status === "pago" && ym(l.pagamento || l.vencimento) <= mes;
  return (d.lancamentos || []).reduce((s, l) => {
    if (!dentro(l)) return s;
    if (l.tipo === "transferencia") {
      if (l.contaId === id) return s - emC(l.valor);
      if (l.destinoId === id) return s + emC(l.valor);
      return s;
    }
    if (l.contaId !== id) return s;
    if (l.tipo === "entrada") return s + emC(l.valor);
    return ehAnulado(l) ? s : s - emC(l.valor);
  }, emC(c.saldoInicial)) / 100;
}

/**
 * Como seu dinheiro evoluiu mês a mês: quanto tinha em conta, quanto guardado,
 * quanto investido, e quanto entrou e saiu naquele mês.
 */
function evolucao(d, meses) {
  const porTipo = (t) => (d.contas || []).filter((c) => c.tipo === t);
  return meses.map((mes) => {
    const noMes = (d.lancamentos || []).filter((l) => l.status === "pago" && ym(l.pagamento || l.vencimento) === mes);
    const liquido = somaC([...porTipo("banco"), ...porTipo("fisico")], (c) => saldoNoFim(d, c.id, mes));
    const guardado = somaC(porTipo("caixinha"), (c) => saldoNoFim(d, c.id, mes));
    const investido = somaC(porTipo("investimento"), (c) => saldoNoFim(d, c.id, mes));
    return { mes, liquido, guardado, investido, total: +(liquido + guardado + investido).toFixed(2),
      entrou: somaC(noMes.filter((l) => l.tipo === "entrada")),
      saiu: somaC(noMes.filter((l) => l.tipo === "saida" && !ehAnulado(l) && !ehAlheio(l))) };
  });
}

/** Gasto por categoria em dois meses, para comparar. */
function compararMeses(d, mesA, mesB, catOf) {
  const gasto = (mes) => {
    const m = {};
    for (const l of d.lancamentos || []) {
      if (l.tipo !== "saida" || l.status !== "pago") continue;
      if (ehAnulado(l) || ehAlheio(l)) continue;
      if (ym(l.pagamento || l.vencimento) !== mes) continue;
      m[l.catId] = (m[l.catId] || 0) + emC(l.valor);
    }
    return m;
  };
  const a = gasto(mesA), b = gasto(mesB);
  const ids = [...new Set([...Object.keys(a), ...Object.keys(b)])];
  return ids.map((id) => {
    const atual = (a[id] || 0) / 100, antes = (b[id] || 0) / 100;
    return { id, nome: catOf?.(id)?.nome || "—", cor: catOf?.(id)?.cor || C.muted,
      atual, antes, delta: +(atual - antes).toFixed(2),
      pct: antes ? Math.round(((atual - antes) / antes) * 100) : (atual ? null : 0) };
  }).sort((x, y) => y.atual - x.atual);
}

/**
 * Progresso de uma caixinha rumo à meta, com previsão baseada no que você
 * costuma guardar por mês. Sem meta, devolve só o ritmo.
 */
function progressoCaixinha(d, conta, hoje = today()) {
  const tem = saldoDaConta(d, conta.id);
  const meta = +conta.meta || 0;

  const entradas = (d.lancamentos || []).filter((l) =>
    l.status === "pago" && l.destinoId === conta.id && (l.pagamento || l.vencimento) <= hoje);
  const meses = [...new Set(entradas.map((l) => ym(l.pagamento || l.vencimento)))];
  const guardadoTotal = somaC(entradas);
  const ritmo = meses.length ? +(guardadoTotal / meses.length).toFixed(2) : 0;

  const faltam = meta ? Math.max(0, +(meta - tem).toFixed(2)) : 0;
  const mesesRestantes = meta && ritmo > 0 ? Math.ceil(faltam / ritmo) : null;
  const previsao = mesesRestantes != null && mesesRestantes > 0
    ? ym(addMonths(hoje, mesesRestantes)) : (meta && faltam === 0 ? "pronto" : null);

  // se você marcou uma data-alvo, quanto precisa por mês para chegar
  let precisaPorMes = null, atrasada = false;
  if (meta && conta.prazo && conta.prazo > ym(hoje)) {
    let n = 0, k = ym(hoje);
    while (k < conta.prazo && n < 600) { k = ym(addMonths(k + "-01", 1)); n++; }
    precisaPorMes = n ? +(faltam / n).toFixed(2) : faltam;
    atrasada = ritmo > 0 && precisaPorMes > ritmo;
  }

  return { tem, meta, faltam, ritmo, mesesRestantes, previsao, precisaPorMes, atrasada,
    pct: meta ? Math.min(100, Math.round((tem / meta) * 100)) : null };
}

/** Observações sobre o mês: o que mais pesou, o que mudou, quanto tempo a reserva cobre. */
function resumoDoMes(d, mes, catOf) {
  const anterior = ym(addMonths(mes + "-01", -1));
  const cats = compararMeses(d, mes, anterior, catOf);
  const saidas = cats.reduce((s, c) => s + emC(c.atual), 0) / 100;
  const entradas = somaC((d.lancamentos || []).filter((l) =>
    l.tipo === "entrada" && l.status === "pago" && ym(l.pagamento || l.vencimento) === mes));

  const maior = cats[0] || null;
  const subiu = cats.filter((c) => c.delta > 0).sort((a, b) => b.delta - a.delta)[0] || null;
  const caiu = cats.filter((c) => c.delta < 0).sort((a, b) => a.delta - b.delta)[0] || null;

  // quantos meses o guardado cobre, no ritmo de gasto dos últimos meses
  const ultimos = mesesComMovimento(d, 4).filter((k) => k <= mes);
  const gastoMedio = ultimos.length
    ? somaC(ultimos, (k) => somaC((d.lancamentos || []).filter((l) =>
        l.tipo === "saida" && l.status === "pago" && !ehAnulado(l) && !ehAlheio(l) &&
        ym(l.pagamento || l.vencimento) === k))) / ultimos.length
    : 0;
  const guardado = somaC((d.contas || []).filter((c) => c.tipo === "caixinha"), (c) => saldoDaConta(d, c.id));
  const folga = gastoMedio > 0 ? +(guardado / gastoMedio).toFixed(1) : null;

  return { mes, anterior, saidas, entradas, sobra: +(entradas - saidas).toFixed(2),
    maior, subiu, caiu, gastoMedio: +gastoMedio.toFixed(2), guardado, folga };
}

/**
 * Entrega o relatório do jeito que der no aparelho: tenta abrir numa aba nova
 * (onde dá para imprimir), e se o navegador bloquear, baixa o arquivo.
 */
function exportarRelatorio(html, mes, avisar) {
  const blob = new Blob([html], { type: "text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const aba = window.open(url, "_blank");
  if (aba) { avisar?.("Relatório aberto — use Imprimir para salvar em PDF"); return; }

  // bloqueado (app instalado, janela restrita): baixa o arquivo
  const a = document.createElement("a");
  a.href = url;
  a.download = `caderneta-${mes}.html`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  avisar?.("Relatório baixado — abra o arquivo e use Compartilhar para virar PDF");
}

/* ============================================================== esquema */
/* Os dados guardados carregam o número da versão do formato. Quando o formato
   muda, as migrações abaixo convertem o que está no aparelho antes do app usar.
   Sem isso, uma mudança de campo quebraria silenciosamente dados antigos. */

const ESQUEMA = 4;

/* Cada função leva os dados da versão anterior para a versão da chave. */
const MIGRACOES = {
  4: (d) => ({
    ...d,
    // "cancelados" nasceu na v4, junto com a sincronia registro a registro
    cancelados: d.cancelados || [],
    intencoes: d.intencoes || [],
    // lançamentos gerados passaram a ter id derivado da recorrência
    lancamentos: (d.lancamentos || []).map((l) =>
      l.src && !String(l.id).startsWith("r_") ? { ...l, id: "r_" + l.src } : l),
  }),
};

/** Conserta o que estiver faltando ou fora do tipo, sem perder informação. */
function sanear(d) {
  const num2 = (v) => (Number.isFinite(+v) ? Math.round(+v * 100) / 100 : 0);
  // descarta buracos antes de qualquer coisa: um item nulo derrubaria o resto
  const lista = (x) => (Array.isArray(x) ? x.filter((r) => r && typeof r === "object") : []);

  const s = {
    ...d,
    contas: lista(d.contas).map((c) => ({ ...c, saldoInicial: num2(c.saldoInicial) })),
    cartoes: lista(d.cartoes).map((c) => ({ ...c, dono: c.dono || "eu",
      fecha: Math.min(28, Math.max(1, +c.fecha || 1)),
      vence: Math.min(28, Math.max(1, +c.vence || 1)) })),
    categorias: lista(d.categorias).map((c) => ({ ...c, orcamento: num2(c.orcamento), subs: lista(c.subs) })),
    recorrentes: lista(d.recorrentes).map((r) => ({ ...r, valor: num2(r.valor),
      dia: Math.min(28, Math.max(1, +r.dia || 1)), fim: r.fim || { tipo: "nunca" } })),
    intencoes: lista(d.intencoes).map((i) => ({ ...i, valor: num2(i.valor) })),
    cancelados: lista(d.cancelados),
    lancamentos: lista(d.lancamentos).map((l) => ({ ...l, valor: num2(l.valor),
      tipo: ["saida", "entrada", "transferencia"].includes(l.tipo) ? l.tipo : "saida",
      status: l.status === "pago" ? "pago" : "pendente" })),
  };

  // ids repetidos quebram a sincronia: mantém o primeiro de cada
  for (const col of COLECOES) {
    const vistos = new Set();
    s[col] = (s[col] || []).filter((r) => {
      if (!r || !r.id || vistos.has(r.id)) return false;
      vistos.add(r.id); return true;
    });
  }
  return s;
}

/**
 * Prepara os dados guardados para uso: aplica as migrações que faltarem,
 * depois sanea. Devolve também o que foi feito, para poder avisar você.
 */
function prepararDados(bruto) {
  if (!bruto || typeof bruto !== "object") return { dados: null, aplicadas: [] };
  let d = bruto;
  const de = Number(d.v) || 3;              // antes da v4 o campo era sempre 3
  const aplicadas = [];
  for (let v = de + 1; v <= ESQUEMA; v++) {
    if (MIGRACOES[v]) { d = MIGRACOES[v](d); aplicadas.push(v); }
  }
  return { dados: { ...sanear(d), v: ESQUEMA }, aplicadas, de };
}

/**
 * Busca em texto livre pelos lançamentos. Entende nome, observação, dono do
 * gasto, categoria, subcategoria, conta, cartão e valor. Vários termos separados
 * por espaço precisam todos combinar: "mercado julho" acha o mercado de julho.
 */
function buscar(lancamentos, termo, ref = {}) {
  const t = normalizar(termo);
  if (!t) return lancamentos;
  const termos = t.split(" ").filter(Boolean);

  const MESES = ["janeiro", "fevereiro", "marco", "abril", "maio", "junho",
    "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];

  const textoDe = (l) => {
    const cat = ref.catOf?.(l.catId);
    const sub = l.subId && ref.subOf?.(l.catId, l.subId);
    const data = l.pagamento || l.vencimento || "";
    const mes = data ? MESES[+data.slice(5, 7) - 1] : "";
    return normalizar([
      l.nome, l.obs, l.deQuem, cat?.nome, sub?.nome, l.forma,
      ref.contaOf?.(l.contaId)?.nome, ref.cartaoOf?.(l.cartaoId)?.nome,
      l.tipo === "entrada" ? "entrada recebido" : l.tipo === "transferencia" ? "transferencia" : "saida gasto",
      l.status === "pago" ? "pago" : "pendente a pagar",
      data, mes, data.slice(0, 4),
      // o valor em várias formas: 12,90 / 12.90 / 1290
      l.valor?.toFixed(2), String(l.valor), String(emC(l.valor)),
    ].filter(Boolean).join(" ")).replace(/\./g, ",");
  };

  return lancamentos.filter((l) => {
    const texto = textoDe(l);
    return termos.every((p) => texto.includes(p.replace(/\./g, ",")));
  });
}

/* ================================================================ regras */
/* As regras de dinheiro vivem aqui, longe da tela: funções puras que recebem
   os dados e devolvem números. É o que permite testá-las de verdade, em vez
   de reescrever o raciocínio dentro de um teste e conferir a cópia. */

/** Reais para centavos inteiros. Toda soma passa por aqui. */
const emC = (v) => Math.round((Number(v) || 0) * 100);

/**
 * Soma valores sem deriva: acumula em centavos inteiros e converte no fim.
 * Somar 0.1 em ponto flutuante trezentas vezes dá 14728.25999999999;
 * em centavos dá exatamente 14728.26.
 */
const somaC = (lista, pegar = (l) => l.valor) =>
  lista.reduce((s, l) => s + emC(pegar(l)), 0) / 100;

/** Saiu e voltou: não deve mexer no saldo. */
const ehAnulado = (l) => l.tipo === "saida" && l.reembolso === "recebido";
/** Comprou no seu cartão, mas o gasto não é seu. */
const ehAlheio = (l) => l.tipo === "saida" && !!l.deQuem;
/** Gasto de outra pessoa que ainda não te acertou. */
const ehACobrar = (l) => ehAlheio(l) && l.reembolso !== "recebido";

/** Quanto uma conta tem hoje: o saldo de partida mais tudo que já aconteceu. */
function saldoDaConta(d, id) {
  const c = (d.contas || []).find((x) => x.id === id);
  if (!c) return 0;
  return (d.lancamentos || []).reduce((s, l) => {
    if (l.status !== "pago") return s;
    if (l.tipo === "transferencia") {
      if (l.contaId === id) return s - l.valor;
      if (l.destinoId === id) return s + l.valor;
      return s;
    }
    if (l.contaId !== id) return s;
    if (l.tipo === "entrada") return s + l.valor;
    return ehAnulado(l) ? s : s - l.valor;
  }, c.saldoInicial || 0);
}

const somaContas = (d, contas) => somaC(contas, (c) => saldoDaConta(d, c.id));
const contasDoTipo = (d, tipo) => (d.contas || []).filter((c) => c.tipo === tipo);

/**
 * Os quatro estados do dinheiro num mês.
 * Disponível é o que sobra depois de honrar o que já está comprometido.
 */
function panorama(d, mes) {
  const bancos = contasDoTipo(d, "banco");
  const fisicas = contasDoTipo(d, "fisico");
  const guardadas = contasDoTipo(d, "caixinha");
  const investidas = contasDoTipo(d, "investimento");

  const totalBancos = somaContas(d, bancos);
  const totalFisico = somaContas(d, fisicas);
  const totalGuardado = somaContas(d, guardadas);
  const totalInvestido = somaContas(d, investidas);

  // transferência planejada conta: o dinheiro já tem destino
  const pendentes = (d.lancamentos || []).filter((l) =>
    l.status === "pendente" && (l.tipo === "saida" || l.tipo === "transferencia"));
  const comprometidoMes = pendentes.filter((l) => ym(l.vencimento) <= mes).reduce((s, l) => s + emC(l.valor), 0) / 100;
  const comprometidoGeral = somaC(pendentes);
  const aReceber = (d.lancamentos || [])
    .filter((l) => l.status === "pendente" && l.tipo === "entrada" && ym(l.vencimento) <= mes)
    .reduce((s, l) => s + emC(l.valor), 0) / 100;

  return { bancos, fisicas, guardadas, investidas,
    totalBancos, totalFisico, totalGuardado, totalInvestido,
    pendentes, comprometidoMes, comprometidoGeral, aReceber,
    disponivel: totalBancos + totalFisico - comprometidoMes };
}

/**
 * Em que dia fecha a fatura a que uma compra pertence.
 * Se o cartão fecha antes de vencer, é no próprio mês do vencimento;
 * se fecha depois (ex.: fecha 27, vence 3), foi no mês anterior.
 */
function fechamentoDaFatura(cartao, vencimento) {
  let [a, m] = vencimento.split("-").map(Number);
  if (cartao.fecha >= cartao.vence) { m -= 1; if (m === 0) { m = 12; a -= 1; } }
  return `${a}-${String(m).padStart(2, "0")}-${String(cartao.fecha).padStart(2, "0")}`;
}

/** Separa as compras de um cartão entre a fatura já fechada e a que ainda roda. */
function faturasDoCartao(cartao, pendentes, hoje) {
  const minhas = pendentes.filter((l) => l.cartaoId === cartao.id);
  const fechada = minhas.filter((l) => fechamentoDaFatura(cartao, l.vencimento) <= hoje);
  const aberta = minhas.filter((l) => fechamentoDaFatura(cartao, l.vencimento) > hoje);
  const proximoFecha = aberta.length
    ? fechamentoDaFatura(cartao, aberta.map((l) => l.vencimento).sort()[0]) : null;
  return { fechada, aberta, proximoFecha,
    totalFechada: somaC(fechada),
    totalAberta: somaC(aberta),
    fechadaDeOutros: somaC(fechada.filter(ehAlheio)),
    abertaDeOutros: somaC(aberta.filter(ehAlheio)) };
}

/** Divide um valor em parcelas sem perder centavo: a sobra vai para as primeiras. */
function dividirEmParcelas(valor, n) {
  const totalC = Math.round(valor * 100);
  const baseC = Math.floor(totalC / n), sobra = totalC - baseC * n;
  return Array.from({ length: n }, (_, i) => (baseC + (i < sobra ? 1 : 0)) / 100);
}

/** O que cada pessoa deve a você, agrupado por nome. */
function cobrancasPorPessoa(lancamentos) {
  const m = {};
  for (const l of lancamentos) if (ehACobrar(l)) (m[l.deQuem] ||= []).push(l);
  return Object.entries(m)
    .map(([quem, ls]) => [quem, ls, somaC(ls)])
    .sort((a, b) => b[2] - a[2])
    .map(([quem, ls]) => [quem, ls]);
}

/* ================================================================== app */
function App() {
  return <Barreira><Aplicacao /></Barreira>;
}

function Aplicacao() {
  const [d, setD] = useState(null);
  const [tab, setTab] = useState("lancar");
  const [cfg, setCfg] = useState(false);
  const [toast, setToast] = useState(null);
  const [sync, setSync] = useState({ estado: "local", quando: null });
  const [detalhe, setDetalhe] = useState(null);   // id do lançamento aberto
  const [lista, setLista] = useState(null);       // { titulo, sub, itens }
  const [conta, setConta] = useState(null);      // id da caixinha aberta
  const [lancando, setLancando] = useState(false);   // painel do botão flutuante
  const timer = useRef(null);
  const retry = useRef(null);
  const tentativa = useRef(0);
  const baseSync = useRef(null);   // último estado que a planilha confirmou

  useEffect(() => {
    const l = document.createElement("link");
    l.rel = "stylesheet";
    l.href = "https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap";
    document.head.appendChild(l);
  }, []);

  useEffect(() => {
    (async () => {
      let bruto = null;
      try { const r = await window.storage.get("caderneta:v3"); if (r?.value) bruto = JSON.parse(r.value); } catch (e) { bruto = null; }
      // converte formatos antigos antes de qualquer coisa
      const { dados: base, aplicadas } = prepararDados(bruto);
      if (aplicadas.length) setTimeout(() => flash("Dados atualizados para o formato novo"), 800);
      const inicial = gerar(base || sanear(seed()));
      // se já havia carimbos, o que está aqui já foi sincronizado antes
      baseSync.current = base?.ateOnde ? baseDe(inicial) : null;
      setD(inicial);
    })();
  }, []);

  useEffect(() => {
    if (!d) return;
    clearTimeout(timer.current);
    setSync((s) => (s.estado === "erro" ? s : { ...s, estado: "pendente" }));
    timer.current = setTimeout(async () => {
      // 1. local primeiro, sempre. isto nunca falha por causa da rede.
      try { await window.storage.set("caderneta:v3", JSON.stringify(d)); } catch (e) { /* segue em memória */ }
      // 2. nuvem depois, sem segurar a tela.
      sincronizar(d);
    }, 400);
  }, [d]);

  /* ------------------------------------------------- sincronia remota */
  /* Manda só o que mudou e traz só o que mudou. Registros diferentes
     nunca se atropelam; o mesmo registro é resolvido pelo carimbo. */
  const emCurso = useRef(false);
  const repetir = useRef(false);
  const dRef = useRef(null);
  dRef.current = d;

  const sincronizar = async (dados, { silencioso = false } = {}) => {
    const url = dados?.sheetsUrl;
    if (!url) { setSync({ estado: "local", quando: null }); return; }
    if (!navigator.onLine) { setSync({ estado: "offline", quando: null }); return; }
    if (emCurso.current) { repetir.current = true; return; }   // já tem uma indo; refaz ao terminar
    emCurso.current = true;

    const { mudancas, estado } = detectarMudancas(baseSync.current, dados);
    if (!silencioso && !mudancas.length && sync.estado === "ok") { emCurso.current = false; return; }
    setSync((s) => ({ ...s, estado: "enviando" }));

    try {
      const r = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },  // evita a permissão extra do navegador
        body: JSON.stringify({
          v: 4, segredo: dados.sheetsSegredo || "",
          desde: dados.ateOnde || 0, mudancas,   // "ateOnde" é a numeração da planilha, não um horário
        }),
      });
      if (!r.ok) throw new Error("resposta " + r.status);
      const j = await r.json();
      if (!j.ok) throw new Error(j.erro || "recusado");

      // Aplica sobre o estado ATUAL, não sobre a foto tirada antes do pedido.
      // Sem isso, qualquer coisa lançada durante a espera da rede seria apagada.
      setD((atual) => {
        const alvo = atual || estado;
        // leva os carimbos recém-calculados para o estado atual: é por eles que
        // a mesclagem sabe que uma edição sua é mais nova do que a que chegou
        const carimbos = {};
        for (const col of COLECOES) for (const r of estado[col] || []) if (r.mEm) carimbos[col + ":" + r.id] = r.mEm;
        const comCarimbo = { ...alvo };
        for (const col of COLECOES) {
          comCarimbo[col] = (alvo[col] || []).map((r) => {
            const c = carimbos[col + ":" + r.id];
            return c && !r.mEm ? { ...r, mEm: c } : r;
          });
        }
        const { estado: mesclado } = aplicarMudancas(comCarimbo, j.mudancas || []);
        const final = { ...mesclado, ateOnde: j.agora };
        baseSync.current = baseDe(final);
        return final;
      });
      const aplicadas = (j.mudancas || []).length;
      setSync({ estado: "ok", quando: Date.now(), trouxe: aplicadas });
      if (aplicadas) flash(`${aplicadas} ${aplicadas === 1 ? "novidade" : "novidades"} de outro aparelho`);
      tentativa.current = 0;
    } catch (e) {
      setSync({ estado: "erro", quando: null, msg: e.message });
      tentativa.current = Math.min(tentativa.current + 1, 6);
      clearTimeout(retry.current);
      retry.current = setTimeout(() => sincronizar(dados), 5000 * 2 ** (tentativa.current - 1));
    } finally {
      emCurso.current = false;
      if (repetir.current) {                           // algo mudou durante o envio
        repetir.current = false;
        setTimeout(() => setSync((s) => ({ ...s, estado: "pendente" })), 0);
        clearTimeout(timer.current);
        timer.current = setTimeout(() => sincronizar(dRef.current), 300);
      }
    }
  };

  /* busca novidades: ao voltar para o app, ao reconectar, e a cada minuto */
  useEffect(() => {
    if (!d?.sheetsUrl) return;
    const puxar = () => document.visibilityState === "visible" && sincronizar(d, { silencioso: true });
    const relogio = setInterval(puxar, 60000);
    document.addEventListener("visibilitychange", puxar);
    window.addEventListener("online", puxar);
    puxar();
    return () => {
      clearInterval(relogio);
      document.removeEventListener("visibilitychange", puxar);
      window.removeEventListener("online", puxar);
    };
  }, [d?.sheetsUrl, d?.sheetsSegredo]);

  /* --------------------------------------------------------- avisos e desfazer */
  const relogioToast = useRef(null);
  const flash = (m) => {
    clearTimeout(relogioToast.current);
    setToast({ msg: m });
    relogioToast.current = setTimeout(() => setToast(null), 2200);
  };

  /**
   * Executa uma mudança guardando como estava antes, e oferece "desfazer"
   * por alguns segundos. É o que permite apagar num toque só: o erro é
   * reversível, então não precisa de confirmação antes.
   */
  const comDesfazer = (msg, mutar, segundos = 8) => {
    // guarda as listas que as ações mexem; o resto do estado segue vivo,
    // para não atropelar o que a sincronia trouxer nesses segundos
    const antes = { lancamentos: d.lancamentos, cancelados: d.cancelados };
    mutar();
    clearTimeout(relogioToast.current);
    setToast({
      msg,
      desfazer: () => {
        clearTimeout(relogioToast.current);
        setD((atual) => ({ ...atual, ...antes }));
        setToast(null);
        flash("Desfeito");
      },
    });
    relogioToast.current = setTimeout(() => setToast(null), segundos * 1000);
  };
  if (!d) return <div style={{ background: C.bg, fontFamily: BODY, color: C.muted }} className="min-h-screen flex items-center justify-center">Abrindo a caderneta…</div>;

  /* ------------------------------------------------------- derivados */
  const catOf = (id) => d.categorias.find((c) => c.id === id) || { nome: "—", cor: C.muted, subs: [] };
  const subOf = (cid, sid) => catOf(cid).subs?.find((s) => s.id === sid);
  const contaOf = (id) => d.contas.find((c) => c.id === id);
  const cartaoOf = (id) => d.cartoes.find((c) => c.id === id);
  /* as regras vêm do bloco puro acima; aqui só passamos os dados */
  const anulado = ehAnulado, alheio = ehAlheio, aCobrar = ehACobrar;
  const saldoConta = (id) => saldoDaConta(d, id);
  const M = mesAtual();
  // sem useMemo: este ponto do arquivo fica depois do retorno que espera os
  // dados carregarem, e um hook condicional quebra o React
  const p = panorama(d, M);
  const { bancos, fisicas, guardadas, investidas, totalBancos, totalFisico,
    totalGuardado, totalInvestido, pendentes, comprometidoMes,
    comprometidoGeral, aReceber, disponivel } = p;
  const liquidas = [...bancos, ...fisicas];

  /* ---------------------------------------------------------- ações */
  const salvar = (l) => {
    const n = l.parcelas || 1, grupo = n > 1 ? uid() : undefined, novos = [];
    const criadoEm = new Date().toISOString();
    const valores = dividirEmParcelas(l.valor, n);
    for (let i = 0; i < n; i++) {
      novos.push({ ...l, id: uid(), criadoEm,
        valor: valores[i],
        vencimento: addMonths(l.vencimento, i),
        status: i === 0 ? l.status : "pendente", pagamento: i === 0 ? l.pagamento : null,
        grupo, parcela: n > 1 ? i + 1 : undefined, parcelas: n > 1 ? n : undefined });
    }
    comDesfazer(n > 1 ? `Lançado em ${n}×` : "Lançado",
      () => setD({ ...d, lancamentos: [...novos, ...d.lancamentos] }));

/* ==================================================== barreira de erro */
/* Se algo quebrar, mostra o erro e um botão para salvar os dados,
   em vez de deixar a tela em branco sem explicação. */
class Barreira extends React.Component {
  constructor(p) { super(p); this.state = { erro: null }; }
  static getDerivedStateFromError(erro) { return { erro }; }

  async baixar() {
    try {
      const r = await window.storage.get("caderneta:v3");
      const blob = new Blob([r?.value || "{}"], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `caderneta-recuperado-${today()}.json`;
      a.click();
    } catch (e) { alert("Não deu para ler os dados guardados."); }
  }

  render() {
    if (!this.state.erro) return this.props.children;
    return (
      <div style={{ background: C.bg, color: C.ink, fontFamily: BODY }} className="min-h-screen p-6 flex items-center justify-center">
        <div style={{ background: C.surface, borderColor: C.line }} className="rounded-2xl border p-6 max-w-md">
          <h1 style={{ fontFamily: DISPLAY }} className="text-xl font-bold mb-2">Algo quebrou</h1>
          <p style={{ color: C.muted }} className="text-sm mb-4">
            Seus dados continuam guardados neste aparelho — o que falhou foi a tela.
            Baixe uma cópia antes de qualquer coisa, depois recarregue a página.
          </p>
          <pre style={{ background: C.bg, color: C.out }} className="rounded-lg p-3 text-xs overflow-auto mb-4 max-h-32">
            {String(this.state.erro?.message || this.state.erro)}
          </pre>
          <div className="flex gap-2">
            <button onClick={() => this.baixar()} style={{ background: C.surface, borderColor: C.line }}
              className="flex-1 rounded-xl border py-2.5 text-sm">Baixar meus dados</button>
            <button onClick={() => location.reload()} style={{ background: C.ink }}
              className="flex-1 rounded-xl py-2.5 text-sm text-white">Recarregar</button>
          </div>
        </div>
      </div>
    );
  }
}

/* Campo de dinheiro no estilo dos apps de banco: cada dígito entra pela direita.
   Digite 8 → 0,08; depois 0 → 0,80; depois 50 → 80,50. Nada de decidir
   onde fica a vírgula, e nunca dá para digitar um valor mal formado. */
function CampoDinheiro({ centavos, onChange, cor, onEnter, autoFocus }) {
  const texto = (centavos / 100).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  const digitar = (e) => {
    const so = e.target.value.replace(/\D/g, "").slice(0, 11);   // teto: R$ 999.999.999,99
    onChange(so === "" ? 0 : parseInt(so, 10));
  };

  // no celular o cursor pode cair no meio; sempre manda para o fim
  const aoFim = (e) => { const n = e.target.value.length; e.target.setSelectionRange(n, n); };

  return (
    <div className="flex items-baseline gap-2 mb-4">
      <span style={{ fontFamily: MONO, color: C.muted }} className="text-2xl">R$</span>
      <input value={texto} onChange={digitar} onKeyDown={(e) => e.key === "Enter" && onEnter?.()}
        onFocus={aoFim} onClick={aoFim} onSelect={aoFim}
        inputMode="numeric" autoFocus={autoFocus} aria-label="Valor"
        style={{ fontFamily: MONO, color: centavos ? cor : C.muted, background: "transparent" }}
        className="text-4xl font-semibold w-full outline-none" />
    </div>
  );
}

/* ======================================================= sugestão de hábito */
/* O app aprende com o que você já lançou: ao digitar um nome parecido com algo
   do passado, ele propõe a mesma categoria, forma e conta. Tudo aqui é função
   pura, sem React, para poder ser testado de verdade. */

/** minúsculas, sem acento e sem pontuação: "Café da Manhã" → "cafe da manha" */
const normalizar = (s) => String(s || "").toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .replace(/[^\w\s]/g, " ").replace(/\s+/g, " ").trim();

/** Quanto o texto digitado combina com um nome já usado. 0 = não combina. */
function pontuar(digitado, nome) {
  const a = normalizar(digitado), b = normalizar(nome);
  if (!a || !b) return 0;
  if (a === b) return 100;
  if (b.startsWith(a)) return 80 + Math.min(a.length, 15);      // "merc" → "Mercado"
  if (b.includes(a)) return 50 + Math.min(a.length, 15);        // "cado" → "Mercado"
  // todas as palavras digitadas aparecem no nome, em qualquer ordem
  const palavras = a.split(" ");
  if (palavras.length > 1 && palavras.every((p) => b.includes(p))) return 40;
  return 0;
}

/**
 * Procura no histórico o lançamento que melhor explica o que está sendo digitado.
 * Combina três sinais: parecença do nome, quantas vezes se repetiu e quão recente é.
 */
function sugerirPor(nome, lancamentos, tipo) {
  if (normalizar(nome).length < 2) return null;

  const grupos = new Map();
  for (const l of lancamentos) {
    if (l.tipo !== tipo || !l.nome) continue;
    const p = pontuar(nome, l.nome);
    if (!p) continue;
    const chave = normalizar(l.nome);
    const g = grupos.get(chave) || { nome: l.nome, pontos: p, vezes: 0, ultimo: null, exemplo: null };
    g.vezes++;
    const quando = l.criadoEm || l.pagamento || l.vencimento || "";
    if (!g.ultimo || quando > g.ultimo) { g.ultimo = quando; g.exemplo = l; }
    grupos.set(chave, g);
  }
  if (!grupos.size) return null;

  const lista = [...grupos.values()].sort((a, b) =>
    (b.pontos + Math.min(b.vezes, 5) * 4) - (a.pontos + Math.min(a.vezes, 5) * 4)
    || String(b.ultimo).localeCompare(String(a.ultimo)));

  const alvo = lista[0];
  const l = alvo.exemplo;
  return {
    de: alvo.nome, vezes: alvo.vezes, quando: alvo.ultimo,
    campos: {
      catId: l.catId || undefined,
      subId: l.subId || undefined,
      forma: l.forma || undefined,
      contaId: l.contaId || undefined,
      cartaoId: l.cartaoId || undefined,
      deQuem: l.deQuem || undefined,
    },
  };
}

/** Os nomes que você mais usa neste tipo, para virarem atalhos de um toque. */
function atalhosFrequentes(lancamentos, tipo, quantos = 4) {
  const grupos = new Map();
  for (const l of lancamentos) {
    if (l.tipo !== tipo || !l.nome || l.recId) continue;   // contas fixas já se lançam sozinhas
    const chave = normalizar(l.nome);
    if (!chave) continue;
    const g = grupos.get(chave) || { nome: l.nome, vezes: 0, ultimo: "", exemplo: l };
    g.vezes++;
    const quando = l.criadoEm || l.pagamento || l.vencimento || "";
    if (quando > g.ultimo) { g.ultimo = quando; g.exemplo = l; }
    grupos.set(chave, g);
  }
  return [...grupos.values()]
    .filter((g) => g.vezes >= 2)                            // só o que virou hábito
    .sort((a, b) => b.vezes - a.vezes || String(b.ultimo).localeCompare(String(a.ultimo)))
    .slice(0, quantos);
}

/* ==================================================== redutor do formulário */
/* Todo o comportamento do formulário de lançamento vive aqui: o que acontece
   ao trocar o tipo, ao escolher crédito, ao aceitar uma sugestão. Antes isso
   estava espalhado por dezesseis estados e era fácil esquecer de zerar algo. */

/** `ref` traz os padrões que dependem dos seus dados (primeira conta, etc). */
function formInicial(ref) {
  return {
    tipo: "saida", pago: true, cents: 0, nome: "",
    catId: ref.catPadrao("saida"), subId: null,
    forma: "Pix", instr: ref.primeiraConta, destino: ref.primeiroDestino,
    venc: ref.hoje, parcelas: "1", obs: "", reemb: false, deQuem: "",
    tocados: {},        // campos que você mexeu na mão
    sugestao: null,     // de onde veio o preenchimento automático
  };
}

/** Instrumento certo para uma forma de pagamento: cartão se crédito, senão conta. */
const instrumentoDe = (forma, ref, cartaoId, contaId) =>
  forma === "Crédito" ? (cartaoId || ref.primeiroCartao) : (contaId || ref.primeiraConta);

function reduzForm(e, a) {
  const ref = a.ref || {};
  switch (a.tipo) {
    case "campo":
      return { ...e, [a.campo]: a.valor };

    /* mexer num campo na mão o protege de ser sobrescrito pela sugestão */
    case "escolher":
      return { ...e, [a.campo]: a.valor, tocados: { ...e.tocados, [a.marca || a.campo]: true } };

    case "trocarTipo": {
      const t = a.valor;
      return { ...e, tipo: t, pago: true, subId: null,
        catId: ref.catPadrao(t),
        forma: t === "saida" ? e.forma : "Pix",
        instr: t === "saida" && e.forma === "Crédito" ? e.instr : ref.primeiraConta,
        deQuem: t === "saida" ? e.deQuem : "",
        reemb: t === "saida" ? e.reemb : false };
    }

    case "trocarForma": {
      const f = a.valor;
      return { ...e, forma: f,
        instr: instrumentoDe(f, ref),
        // compra no crédito não sai da conta hoje: entra pendente na fatura
        pago: f === "Crédito" ? false : e.pago,
        tocados: { ...e.tocados, forma: true } };
    }

    /* preenche a partir do histórico, sem pisar no que você já escolheu */
    case "sugerir": {
      const { campos } = a.sugestao;
      const n = { ...e, sugestao: a.sugestao };
      if (campos.catId && !e.tocados.cat) { n.catId = campos.catId; n.subId = campos.subId || null; }
      if (campos.forma && !e.tocados.forma) {
        n.forma = campos.forma;
        if (!e.tocados.instr) n.instr = instrumentoDe(campos.forma, ref, campos.cartaoId, campos.contaId);
        if (campos.forma === "Crédito") n.pago = false;
      }
      if (campos.deQuem && !e.tocados.deQuem) n.deQuem = campos.deQuem;
      return n;
    }

    /* atalho de um toque: preenche tudo menos o valor */
    case "atalho": {
      const l = a.atalho.exemplo;
      return { ...e, nome: a.atalho.nome, tocados: {},
        catId: l.catId || ref.catPadrao(e.tipo), subId: l.subId || null,
        forma: l.forma || "Pix",
        instr: instrumentoDe(l.forma, ref, l.cartaoId, l.contaId),
        pago: l.forma !== "Crédito",
        deQuem: l.deQuem || "",
        sugestao: { de: a.atalho.nome, vezes: a.atalho.vezes } };
    }

    /* volta aos padrões, mas mantém o que você digitou de nome e valor */
    case "desfazerSugestao":
      return { ...formInicial(ref), tipo: e.tipo, nome: e.nome, cents: e.cents, venc: e.venc,
        catId: ref.catPadrao(e.tipo) };

    case "limpar":
      // mantém o tipo escolhido, mas a categoria tem que ser a padrão DESSE tipo
      return { ...formInicial(ref), tipo: e.tipo, catId: ref.catPadrao(e.tipo) };

    default:
      return e;
  }
}

/* ================================================================ lançar */
/* ---------------------------------------------------- formulário de lançamento */
/* Vive fora da aba para poder aparecer também no painel do botão flutuante:
   o mesmo formulário, com o mesmo comportamento, em dois lugares. */
function FormLancamento({ d, catOf, salvar, flash, aoSalvar }) {
  /* ------------------------------------- um estado só, com as regras no redutor */
  const catPadrao = (t) => (t === "entrada"
    ? (d.categorias.find((c) => c.id === "renda") || d.categorias[0])?.id
    : (d.categorias.find((c) => c.id !== "renda") || d.categorias[0])?.id);
  const contasUso = d.contas.filter((c) => c.tipo === "banco" || c.tipo === "fisico");

  const ref = {
    hoje: today(),
    primeiraConta: contasUso[0]?.id,
    primeiroCartao: d.cartoes[0]?.id,
    primeiroDestino: d.contas.find((c) => c.tipo === "caixinha")?.id || contasUso[1]?.id,
    catPadrao,
  };

  const [f, despachar] = useReducer(reduzForm, ref, formInicial);
  const dispara = (a) => despachar({ ...a, ref });
  const campo = (nome, valor) => dispara({ tipo: "campo", campo: nome, valor });
  const escolher = (nome, valor, marca) => dispara({ tipo: "escolher", campo: nome, valor, marca });

  /* nomes curtos para o que a tela usa o tempo todo */
  const { tipo, pago, cents, nome, catId, subId, forma, instr, destino,
    venc, parcelas, obs, reemb, deQuem, sugestao } = f;
  const nParc = Math.min(48, Math.max(1, parseInt(parcelas, 10) || 1));
  const v = cents / 100;
  const credito = forma === "Crédito";
  const [mais, setMais] = useState(false);

  const pessoas = [...new Set([...d.cartoes.map((c) => c.dono), ...d.lancamentos.map((l) => l.deQuem)]
    .filter((n) => n && n !== "eu"))];

  /* ---------------------------------------------- sugestão pelo histórico */
  const atalhos = useMemo(() => atalhosFrequentes(d.lancamentos, tipo), [d.lancamentos, tipo]);

  const digitarNome = (txt) => {
    campo("nome", txt);
    if (tipo === "transferencia") return;
    const s = sugerirPor(txt, d.lancamentos, tipo);
    if (s) dispara({ tipo: "sugerir", sugestao: s });
    else campo("sugestao", null);
  };

  const enviar = () => {
    if (v <= 0) { flash("Digite um valor maior que zero"); return; }
    if (forma === "Crédito" && !d.cartoes.length) { flash("Cadastre um cartão em Ajustes primeiro"); return; }
    if (tipo === "transferencia" && instr === destino) { flash("Escolha contas diferentes"); return; }
    const base = {
      tipo, nome: nome || (tipo === "transferencia" ? "Transferência" : catOf(catId).nome), valor: v,
      catId: tipo === "transferencia" ? null : catId, subId: tipo === "transferencia" ? null : subId,
      forma, vencimento: venc, obs, deQuem: deQuem.trim() || undefined,
      reembolso: deQuem.trim() || reemb ? "aguardando" : "nao",
      status: pago ? "pago" : "pendente", pagamento: pago ? venc : null,
      parcelas: nParc > 1 ? nParc : undefined,
    };
    if (tipo === "transferencia") salvar({ ...base, contaId: instr, destinoId: destino });
    else if (credito) salvar({ ...base, cartaoId: instr, contaId: null });
    else salvar({ ...base, contaId: instr, cartaoId: null });
    dispara({ tipo: "limpar" }); setMais(false);
    aoSalvar?.();
  };

  return (
      <section style={{ background: C.surface, borderColor: C.line }} className="rounded-2xl border p-4">
        <div style={{ background: C.bg }} className="flex p-1 rounded-xl mb-3">
          {[["saida", "Saída", ArrowUpRight], ["entrada", "Entrada", ArrowDownLeft], ["transferencia", "Transferência", ArrowLeftRight]].map(([k, t, Ic]) => (
            <button key={k} onClick={() => dispara({ tipo: "trocarTipo", valor: k })}
              style={{ background: tipo === k ? C.surface : "transparent", color: tipo === k ? CORTIPO[k] : C.muted }}
              className="flex-1 flex items-center justify-center gap-1.5 py-2 rounded-lg text-xs sm:text-sm font-medium">
              <Ic size={15} /> {t}</button>
          ))}
        </div>

        <div className="flex gap-2 mb-4">
          {(tipo === "saida" ? [[true, "Pago"], [false, "Pendente"]]
            : tipo === "entrada" ? [[true, "Recebido"], [false, "A receber"]]
            : [[true, "Já fiz"], [false, "Planejada"]]).map(([k, t]) => (
            <button key={t} onClick={() => campo("pago", k)}
              style={{ background: pago === k ? (k ? CORTIPO[tipo] : C.due) : C.bg, color: pago === k ? "#fff" : C.muted, borderColor: C.line }}
              className="flex-1 rounded-xl border py-2 text-sm font-medium">{t}</button>
          ))}
        </div>

        <CampoDinheiro centavos={cents} onChange={(c) => campo("cents", c)} cor={CORTIPO[tipo]} onEnter={enviar} />

        {atalhos.length > 0 && !nome && (
          <div className="mb-3">
            <div style={{ color: C.muted }} className="text-xs mb-1.5">O que você mais lança</div>
            <div className="flex flex-wrap gap-1.5">
              {atalhos.map((a) => (
                <button key={a.nome} onClick={() => dispara({ tipo: "atalho", atalho: a })}
                  style={{ background: C.bg, borderColor: C.line, color: C.ink }}
                  className="rounded-full border px-3 py-1.5 text-xs">
                  {a.nome} <span style={{ color: C.muted }}>{a.vezes}×</span>
                </button>
              ))}
            </div>
          </div>
        )}

        <input value={nome} onChange={(e) => digitarNome(e.target.value)} onKeyDown={(e) => e.key === "Enter" && enviar()}
          placeholder="Nome do lançamento" style={{ background: C.bg, borderColor: C.line }}
          className="w-full rounded-xl border px-3 py-2.5 text-sm outline-none" />

        {sugestao ? (
          <div style={{ background: C.tr + "14" }} className="rounded-xl px-3 py-2 mt-2 mb-4 flex items-center gap-2">
            <Lightbulb size={14} style={{ color: C.tr }} className="shrink-0" />
            <span style={{ color: C.tr }} className="text-xs flex-1 min-w-0">
              Preenchido como em <b>{sugestao.de}</b>
              {sugestao.vezes > 1 && <span style={{ color: C.muted }}> · {sugestao.vezes}× antes</span>}
            </span>
            <button onClick={() => dispara({ tipo: "desfazerSugestao" })} style={{ color: C.tr }} className="text-xs underline underline-offset-2 shrink-0">desfazer</button>
          </div>
        ) : <div className="mb-4" />}

        {tipo !== "transferencia" && (
          <>
            <Rotulo>Categoria</Rotulo>
            <div className="flex flex-wrap gap-2 mb-3">
              {d.categorias.filter((c) => (tipo === "entrada" ? c.id === "renda" : c.id !== "renda")).map((c) => (
                <Chip key={c.id} ativo={catId === c.id} cor={c.cor} onClick={() => { escolher("catId", c.id, "cat"); campo("subId", null); }}>{c.nome}</Chip>
              ))}
            </div>
            {catOf(catId).subs?.length > 0 && (
              <>
                <Rotulo>Subcategoria</Rotulo>
                <div className="flex flex-wrap gap-2 mb-4">
                  {catOf(catId).subs.map((s) => (
                    <Chip key={s.id} ativo={subId === s.id} cor={C.ink} onClick={() => escolher("subId", subId === s.id ? null : s.id, "cat")}>{s.nome}</Chip>
                  ))}
                </div>
              </>
            )}
          </>
        )}

        {tipo !== "transferencia" && (
          <>
            <Rotulo>Forma de pagamento</Rotulo>
            <div className="flex flex-wrap gap-2 mb-4">
              {FORMAS.map((f) => <Chip key={f} ativo={forma === f} cor={C.ink} onClick={() => dispara({ tipo: "trocarForma", valor: f })}>{f}</Chip>)}
            </div>
          </>
        )}

        <Rotulo>{tipo === "transferencia" ? "De onde sai" : credito ? "Em qual cartão" : "De qual conta"}</Rotulo>
        <div className="flex flex-wrap gap-2 mb-4">
          {(credito ? d.cartoes : contasUso).map((c) => (
            <Chip key={c.id} ativo={instr === c.id} cor={credito ? C.due : C.saved} onClick={() => escolher("instr", c.id)}>
              {credito && <CreditCard size={12} className="inline mr-1" />}{c.nome}{c.dono && c.dono !== "eu" ? ` · ${c.dono}` : ""}
            </Chip>
          ))}
        </div>

        {tipo === "transferencia" && (
          <>
            <Rotulo>Para onde vai</Rotulo>
            <div className="flex flex-wrap gap-2 mb-4">
              {d.contas.filter((c) => c.id !== instr).map((c) => (
                <Chip key={c.id} ativo={destino === c.id} cor={C.tr} onClick={() => campo("destino", c.id)}>{c.nome}</Chip>
              ))}
            </div>
          </>
        )}

        <button onClick={() => setMais(!mais)} style={{ color: C.muted }} className="flex items-center gap-1 text-sm mb-3">
          <ChevronDown size={15} style={{ transform: mais ? "rotate(180deg)" : "none" }} /> Mais detalhes
        </button>

        {mais && (
          <div className="grid sm:grid-cols-2 gap-3 mb-4">
            <div><Rotulo>{tipo === "entrada" ? "Data prevista" : "Vencimento"}</Rotulo>
              <input type="date" value={venc} onChange={(e) => campo("venc", e.target.value)} style={{ background: C.bg, borderColor: C.line }}
                className="w-full rounded-xl border px-3 py-2 text-sm outline-none" /></div>
            {tipo === "saida" && (
              <div><Rotulo>Parcelas</Rotulo>
                <input inputMode="numeric" value={parcelas}
                  onChange={(e) => campo("parcelas", e.target.value.replace(/\D/g, "").slice(0, 2))}
                  onFocus={(e) => e.target.select()}
                  onBlur={() => campo("parcelas", String(nParc))}
                  style={{ background: C.bg, borderColor: C.line, color: C.ink, fontFamily: MONO }} className="w-full rounded-xl border px-3 py-2 outline-none" />
                {nParc > 1 && <p style={{ color: C.muted, fontFamily: MONO }} className="text-xs mt-1">{nParc}× {brl(v / nParc)}</p>}</div>
            )}
            <div className="sm:col-span-2"><Rotulo>Observações</Rotulo>
              <input value={obs} onChange={(e) => campo("obs", e.target.value)} placeholder="Ex.: saquei do Nubank para pagar em dinheiro"
                style={{ background: C.bg, borderColor: C.line }} className="w-full rounded-xl border px-3 py-2 text-sm outline-none" /></div>
            {tipo === "saida" && (
              <div className="sm:col-span-2"><Rotulo>Este gasto é de outra pessoa?</Rotulo>
                <div className="flex flex-wrap gap-1.5 mb-1.5">
                  {["", ...pessoas].map((n) => (
                    <button key={n || "eu"} onClick={() => escolher("deQuem", n)}
                      style={{ background: deQuem === n ? C.tr : C.bg, color: deQuem === n ? "#fff" : C.muted, borderColor: C.line }}
                      className="rounded-lg border px-2.5 py-1 text-xs">{n || "Meu"}</button>
                  ))}
                </div>
                <input value={deQuem} onChange={(e) => escolher("deQuem", e.target.value)} placeholder="ou digite o nome"
                  style={{ background: C.bg, borderColor: C.line }} className="w-full rounded-xl border px-3 py-2 text-sm outline-none" />
                {deQuem.trim() && <p style={{ color: C.tr }} className="text-xs mt-1">
                  Entra na fatura, mas não conta como gasto seu. Vai para a lista de cobrança de {deQuem.trim()}.</p>}
              </div>
            )}
            {tipo === "saida" && !deQuem.trim() && (
              <label className="flex items-center gap-2 text-sm sm:col-span-2">
                <input type="checkbox" checked={reemb} onChange={(e) => campo("reemb", e.target.checked)} /> Vou ser reembolsada
              </label>
            )}
          </div>
        )}

        <button onClick={enviar} disabled={v <= 0} style={{ background: v > 0 ? C.ink : C.line, color: v > 0 ? "#fff" : C.muted }}
          className="w-full py-3 rounded-xl font-medium text-sm">Salvar lançamento</button>
      </section>
  );
}

/* ================================================================ lançar */
function Lancar({ d, catOf, subOf, contaOf, cartaoOf, salvar, apagar, up, pagar, anulado, abrir, flash }) {
  const [janela, setJanela] = useState(1);   // abre em "Este mês"
  const [ordem, setOrdem] = useState("registro");   // "registro" ou "data"
  const [de, setDe] = useState("");
  const [ate, setAte] = useState("");
  const [busca, setBusca] = useState("");
  const dataDe = (l) => l.pagamento || l.vencimento;
  const periodo = useMemo(() => {
    if (de && ate && de <= ate) {
      const ms = []; let k = de + "-01";
      while (ym(k) <= ate) { ms.push(ym(k)); k = addMonths(k, 1); }
      return ms;
    }
    if (janela === "todos") return null;
    return Array.from({ length: janela }, (_, i) => ym(addMonths(today(), -i)));
  }, [janela, de, ate]);

  const lista = useMemo(() => {
    let arr = d.lancamentos.filter((l) => (periodo ? periodo.includes(ym(dataDe(l))) : true));
    if (busca.trim()) arr = buscar(arr, busca, { catOf, subOf, contaOf, cartaoOf });
    // Para quem não tem hora de registro (contas geradas, dados antigos), usamos
    // a data. Se ela é futura, vale o início daquele mês — senão uma conta que
    // vence dia 31 subiria acima do que você acabou de lançar hoje.
    const hoje = today();
    const chave = (l) => (ordem === "registro"
      ? (l.criadoEm || (dataDe(l) <= hoje ? dataDe(l) : ym(dataDe(l)) + "-01") + "T00:00:00.000Z")
      : dataDe(l));
    return arr.sort((a, b) => chave(b).localeCompare(chave(a)));
  }, [d.lancamentos, periodo, ordem, busca]);
  const visiveis = lista.slice(0, 60);

  return (
    <>
      <FormLancamento d={d} catOf={catOf} salvar={salvar} flash={flash} />

      <div className="flex items-center justify-between gap-2 mt-6 mb-3">
        <h2 style={{ fontFamily: DISPLAY }} className="text-lg font-bold">Lançamentos</h2>
        <span style={{ color: C.muted, fontFamily: MONO }} className="text-xs">
          {lista.length} {lista.length === 1 ? "registro" : "registros"}
        </span>
      </div>

      <div className="flex items-center gap-2 mb-3">
        <div className="relative flex-1">
          <input value={busca} onChange={(e) => setBusca(e.target.value)}
            placeholder="Buscar por nome, valor, categoria…" aria-label="Buscar lançamentos"
            style={{ background: C.surface, borderColor: busca ? C.tr : C.line, color: C.ink }}
            className="w-full rounded-full border pl-4 pr-9 py-2 text-sm outline-none" />
          {busca && (
            <button onClick={() => setBusca("")} aria-label="Limpar busca"
              style={{ color: C.muted }} className="absolute right-2 top-1/2 -translate-y-1/2 p-1">
              <X size={15} />
            </button>
          )}
        </div>
        <div style={{ background: C.surface, borderColor: C.line }} className="flex p-0.5 rounded-full border shrink-0">
          {[["registro", "quando lancei"], ["data", "data da conta"]].map(([k, t]) => (
            <button key={k} onClick={() => setOrdem(k)} title={`Ordenar por ${t}`}
              style={{ background: ordem === k ? C.ink : "transparent", color: ordem === k ? "#fff" : C.muted }}
              className="rounded-full px-3 py-1 text-xs font-medium transition-colors whitespace-nowrap">{t}</button>
          ))}
        </div>
      </div>

      {busca && (
        <p style={{ color: C.muted }} className="text-xs mb-2">
          {lista.length === 0 ? "Nada encontrado" : `${lista.length} ${lista.length === 1 ? "resultado" : "resultados"}`}
          {periodo && " no período filtrado"}
          {lista.length === 0 && periodo && (
            <button onClick={() => { setJanela("todos"); setDe(""); setAte(""); }}
              style={{ color: C.tr }} className="ml-1 underline underline-offset-2">buscar em tudo</button>
          )}
        </p>
      )}
      <div className="flex flex-wrap items-center gap-2 mb-2">
        {[["todos", "Todos"], [1, "Este mês"], [3, "3 meses"], [6, "6 meses"], [12, "12 meses"]].map(([k, t]) => (
          <Chip key={k} ativo={!(de && ate) && janela === k} cor={C.ink}
            onClick={() => { setJanela(k); setDe(""); setAte(""); }}>{t}</Chip>
        ))}
        <input type="month" value={de} onChange={(e) => setDe(e.target.value)} style={{ background: C.surface, borderColor: C.line }}
          className="rounded-full border px-3 py-1.5 text-xs outline-none" />
        <span style={{ color: C.muted }} className="text-xs">até</span>
        <input type="month" value={ate} onChange={(e) => setAte(e.target.value)} style={{ background: C.surface, borderColor: C.line }}
          className="rounded-full border px-3 py-1.5 text-xs outline-none" />
      </div>
      {periodo && (
        <p style={{ color: C.muted }} className="text-xs mb-3 capitalize">
          {periodo.length === 1 ? mesLabel(periodo[0]) : `${mesLabel(periodo[periodo.length - 1])} — ${mesLabel(periodo[0])}`}
        </p>
      )}
      {visiveis.length === 0 && <Vazio>Nenhum lançamento neste período.</Vazio>}
      <div className="space-y-2">
        {visiveis.map((l) => (
          <Linha key={l.id} l={l} {...{ catOf, subOf, contaOf, cartaoOf, anulado, up }} onOpen={() => abrir(l.id)}
            onPay={l.status === "pendente" ? () => pagar(l) : null} onDel={() => apagar(l.id)} />
        ))}
      </div>
      {lista.length > 60 && (
        <p style={{ color: C.muted }} className="text-xs mt-3">Mostrando os 60 mais recentes. Filtre por período para ver o resto.</p>
      )}
    </>
  );
}

/** Bloco que abre e fecha, com um resumo visível mesmo fechado.
    A preferência fica só neste aparelho: não é dado financeiro, não sincroniza. */
function Bloco({ id, titulo, resumo, cor, aberto, alternar, children, vazio }) {
  return (
    <section className="mb-3">
      <button onClick={() => alternar(id)} aria-expanded={aberto}
        className="w-full flex items-center justify-between gap-2 py-1.5 text-left">
        <span className="flex items-center gap-1.5 min-w-0">
          <ChevronDown size={15} style={{ color: C.muted, transform: aberto ? "none" : "rotate(-90deg)", transition: "transform .15s" }} className="shrink-0" />
          <span style={{ color: C.muted }} className="text-xs uppercase tracking-wider truncate">{titulo}</span>
        </span>
        {resumo != null && (
          <span style={{ fontFamily: MONO, color: cor || C.ink }} className="text-sm font-semibold shrink-0">{resumo}</span>
        )}
