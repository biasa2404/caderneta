function AbaRecorrentes({ d, set, flash }) {
  const [aberta, setAberta] = useState(null);
  const [nova, setNova] = useState(false);
  const upR = (id, patch) => set({ recorrentes: d.recorrentes.map((r) => (r.id === id ? { ...r, ...patch } : r)) });
  const contasUso = d.contas.filter((c) => c.tipo === "banco" || c.tipo === "fisico");

  const criar = () => {
    const id = uid();
    set({ recorrentes: [...d.recorrentes, {
      id, nome: "", valor: 0, dia: 5, variavel: false,
      catId: (d.categorias.find((c) => c.id !== "renda") || d.categorias[0])?.id,
      forma: "Boleto", contaId: contasUso[0]?.id, fim: { tipo: "nunca" },
    }] });
    setAberta(id); setNova(true);
  };

  return (
    <>
      <p style={{ color: C.muted }} className="text-sm mb-3">
        Contas que se repetem todo mês. O app gera os próximos 12 meses sozinho;
        as marcadas como variáveis vêm com aviso para você conferir o valor.
      </p>

      <div className="space-y-2 mb-3">
        {d.recorrentes.map((r) => (
          <EditorRecorrente key={r.id} r={r} d={d} contasUso={contasUso}
            aberta={aberta === r.id} onToggle={() => setAberta(aberta === r.id ? null : r.id)}
            upR={upR} flash={flash}
            onApagar={() => {
              const geradas = d.lancamentos.filter((l) => l.recId === r.id && l.status === "pendente").length;
              set({ recorrentes: d.recorrentes.filter((x) => x.id !== r.id) });
              setAberta(null);
              flash(geradas ? `Apagada. As ${geradas} cobranças já geradas continuam na lista.` : "Conta fixa apagada");
            }} />
        ))}
        {d.recorrentes.length === 0 && <Vazio>Nenhuma conta fixa cadastrada.</Vazio>}
      </div>

      <button onClick={criar} style={{ background: C.ink, color: "#fff" }}
        className="w-full py-2.5 rounded-xl text-sm flex items-center justify-center gap-1.5">
        <Plus size={15} /> Nova conta fixa
      </button>
      {nova && <p style={{ color: C.muted }} className="text-xs mt-2">
        Preencha os campos acima. Os meses são gerados quando você reabrir o app.
      </p>}
    </>
  );
}

/** Uma conta fixa: resumo fechado, todos os campos quando aberta. */
function EditorRecorrente({ r, d, contasUso, aberta, onToggle, upR, onApagar, flash }) {
  const [cents, setCents] = useState(Math.round((r.valor || 0) * 100));
  useEffect(() => { setCents(Math.round((r.valor || 0) * 100)); }, [r.id]);
  const inp = { background: C.bg, borderColor: C.line, color: C.ink };
  const cat = d.categorias.find((c) => c.id === r.catId);
  const via = r.forma === "Crédito"
    ? d.cartoes.find((c) => c.id === r.cartaoId)?.nome || "cartão"
    : d.contas.find((c) => c.id === r.contaId)?.nome || "—";

  return (
    <div style={{ background: C.surface, borderColor: C.line }} className="rounded-xl border">
      <div onClick={onToggle} role="button" tabIndex={0} className="p-3 flex items-center gap-2 cursor-pointer">
        <Repeat size={14} style={{ color: C.muted }} className="shrink-0" />
        <div className="min-w-0 flex-1">
          <div className="text-sm font-medium truncate">{r.nome || "sem nome"}</div>
          <div style={{ color: C.muted }} className="text-xs truncate">
            dia {r.dia} · {cat?.nome || "—"} · {r.forma} · {via}
            {r.fim?.tipo === "data" && ` · até ${dm(r.fim.data)}`}
            {r.fim?.tipo === "vezes" && ` · ${r.fim.vezes}×`}
          </div>
        </div>
        {r.variavel && <Tag cor={C.due}>variável</Tag>}
        <span style={{ fontFamily: MONO }} className="text-sm shrink-0">{brl(r.valor)}</span>
        <ChevronDown size={16} style={{ color: C.muted, transform: aberta ? "rotate(180deg)" : "none" }} className="shrink-0" />
      </div>

      {aberta && (
        <div style={{ borderColor: C.line }} className="border-t p-3 space-y-3">
          <div><Rotulo>Nome</Rotulo>
            <input value={r.nome} onChange={(e) => upR(r.id, { nome: e.target.value })} placeholder="Aluguel, Energia…"
              style={inp} className="w-full rounded-xl border px-3 py-2 text-sm outline-none" /></div>

          <div className="grid grid-cols-2 gap-3">
            <div><Rotulo>Valor</Rotulo>
              <input value={(cents / 100).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                onChange={(e) => { const c = +(e.target.value.replace(/\D/g, "").slice(0, 9) || 0); setCents(c); upR(r.id, { valor: c / 100 }); }}
                inputMode="numeric" style={{ ...inp, fontFamily: MONO }} className="w-full rounded-xl border px-3 py-2 text-sm outline-none" /></div>
            <div><Rotulo>Vence todo dia</Rotulo>
              <input type="number" min="1" max="28" value={r.dia}
                onChange={(e) => upR(r.id, { dia: Math.min(28, Math.max(1, +e.target.value || 1)) })}
                style={inp} className="w-full rounded-xl border px-3 py-2 text-sm outline-none" /></div>
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div><Rotulo>Categoria</Rotulo>
              <select value={r.catId || ""} onChange={(e) => upR(r.id, { catId: e.target.value, subId: undefined })}
                style={inp} className="w-full rounded-xl border px-3 py-2 text-sm outline-none">
                {d.categorias.map((c) => <option key={c.id} value={c.id}>{c.nome}</option>)}
              </select></div>
            <div><Rotulo>Subcategoria</Rotulo>
              <select value={r.subId || ""} onChange={(e) => upR(r.id, { subId: e.target.value || undefined })}
                style={inp} className="w-full rounded-xl border px-3 py-2 text-sm outline-none">
                <option value="">—</option>
                {(cat?.subs || []).map((s) => <option key={s.id} value={s.id}>{s.nome}</option>)}
              </select></div>
          </div>

          <div><Rotulo>Forma de pagamento</Rotulo>
            <div className="flex flex-wrap gap-1.5">
              {FORMAS.map((x) => (
                <button key={x} onClick={() => upR(r.id, { forma: x,
                    cartaoId: x === "Crédito" ? (r.cartaoId || d.cartoes[0]?.id) : undefined,
                    contaId: x === "Crédito" ? undefined : (r.contaId || contasUso[0]?.id) })}
                  style={{ background: r.forma === x ? C.ink : C.bg, color: r.forma === x ? "#fff" : C.muted, borderColor: C.line }}
                  className="rounded-lg border px-2.5 py-1.5 text-xs">{x}</button>
              ))}
            </div>
          </div>

          <div><Rotulo>{r.forma === "Crédito" ? "Cartão" : "Sai da conta"}</Rotulo>
            {r.forma === "Crédito" ? (
              <select value={r.cartaoId || ""} onChange={(e) => upR(r.id, { cartaoId: e.target.value })}
                style={inp} className="w-full rounded-xl border px-3 py-2 text-sm outline-none">
                {d.cartoes.map((c) => <option key={c.id} value={c.id}>{c.nome}{c.dono !== "eu" ? ` (de ${c.dono})` : ""}</option>)}
              </select>
            ) : (
              <select value={r.contaId || ""} onChange={(e) => upR(r.id, { contaId: e.target.value })}
                style={inp} className="w-full rounded-xl border px-3 py-2 text-sm outline-none">
                {contasUso.map((c) => <option key={c.id} value={c.id}>{c.nome}</option>)}
              </select>
            )}
          </div>

          <div><Rotulo>O valor muda todo mês?</Rotulo>
            <div className="flex gap-2">
              <Chip ativo={!r.variavel} cor={C.ink} onClick={() => upR(r.id, { variavel: false })}>Sempre o mesmo</Chip>
              <Chip ativo={r.variavel} cor={C.due} onClick={() => upR(r.id, { variavel: true })}>Varia, quero conferir</Chip>
            </div>
          </div>

          <div><Rotulo>Até quando</Rotulo>
            <div className="flex flex-wrap items-center gap-2">
              {[["nunca", "Sem fim"], ["data", "Até uma data"], ["vezes", "Número de vezes"]].map(([k, t]) => (
                <Chip key={k} ativo={(r.fim?.tipo || "nunca") === k} cor={C.saved}
                  onClick={() => upR(r.id, { fim: k === "nunca" ? { tipo: "nunca" }
                    : k === "data" ? { tipo: "data", data: r.fim?.data || "" }
                    : { tipo: "vezes", vezes: r.fim?.vezes || 12 } })}>{t}</Chip>
              ))}
              {r.fim?.tipo === "data" && (
                <input type="date" value={r.fim.data || ""} onChange={(e) => upR(r.id, { fim: { tipo: "data", data: e.target.value } })}
                  style={inp} className="rounded-lg border px-2 py-1 text-xs outline-none" />
              )}
              {r.fim?.tipo === "vezes" && (
                <input type="number" min="1" value={r.fim.vezes || 12} onChange={(e) => upR(r.id, { fim: { tipo: "vezes", vezes: Math.max(1, +e.target.value || 1) } })}
                  style={inp} className="w-20 rounded-lg border px-2 py-1 text-xs outline-none" />
              )}
            </div>
          </div>

          <div className="flex gap-2 pt-1">
            <BotaoConfirma onConfirm={onApagar} pergunta="Apagar mesmo" estilo={{ borderColor: C.line }}
              className="rounded-xl border px-3 py-2 text-sm flex items-center gap-1.5"><Trash2 size={14} /> Apagar</BotaoConfirma>
            <button onClick={() => { onToggle(); flash("Alterações valem para os meses ainda não gerados"); }}
              style={{ background: C.ink, color: "#fff" }} className="flex-1 rounded-xl py-2 text-sm">Pronto</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ====================================================== detalhe e listas */

/** Painel deslizante genérico, usado pelo detalhe e pelas listas. */
function Painel({ titulo, sub, onClose, children, rodape }) {
  useEffect(() => {
    const esc = (e) => e.key === "Escape" && onClose();
    window.addEventListener("keydown", esc);
    // trava a rolagem do fundo, senão a página corre atrás do painel no celular
    const antes = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => {
      window.removeEventListener("keydown", esc);
      document.body.style.overflow = antes;
    };
  }, [onClose]);

  return (
    <div style={{ height: "100dvh" }} className="fixed inset-0 z-50 flex items-end md:items-center md:justify-center">
      <div onClick={onClose} style={{ background: "#141824", opacity: 0.4 }} className="absolute inset-0" />
      {/* dvh em vez de vh: no iOS a barra do navegador faz o vh estourar a tela
          e o topo do painel — com o cabeçalho — sai do campo de visão */}
      <div style={{ background: C.bg, maxHeight: "88dvh" }}
        className="relative w-full md:max-w-2xl md:rounded-2xl rounded-t-2xl flex flex-col overflow-hidden">
        <div style={{ borderColor: C.line, background: C.bg }} className="flex items-start justify-between gap-3 px-5 py-4 border-b shrink-0">
          <div className="min-w-0">
            <h2 style={{ fontFamily: DISPLAY }} className="text-lg font-bold leading-tight">{titulo}</h2>
            {sub && <p style={{ color: C.muted }} className="text-sm truncate">{sub}</p>}
          </div>
          <button onClick={onClose} aria-label="Fechar" style={{ color: C.muted }} className="p-1 shrink-0"><X size={20} /></button>
        </div>
        {/* minHeight 0 é o que permite este bloco encolher e rolar dentro do flex */}
        <div style={{ minHeight: 0, WebkitOverflowScrolling: "touch", touchAction: "pan-y" }}
          className="overflow-y-auto px-5 py-4 flex-1 overscroll-contain">{children}</div>
        {rodape && (
          <div style={{ borderColor: C.line, background: C.surface, paddingBottom: "calc(0.75rem + env(safe-area-inset-bottom))" }}
            className="border-t px-5 pt-3 shrink-0">{rodape}</div>
        )}
      </div>
    </div>
  );
}

const Resumo = ({ rot, v, cor, cru }) => (
  <div>
    <div style={{ color: C.muted }} className="text-xs uppercase tracking-wider">{rot}</div>
    <div style={{ fontFamily: MONO, color: cor }} className="text-lg font-semibold">{cru ? v : brl(v)}</div>
  </div>
);

/** Lista filtrada: o que compõe um número que você tocou. */
function ListaFiltrada({ titulo, sub, itens, onClose, catOf, subOf, contaOf, cartaoOf, anulado, up, abrir }) {
  const entrou = itens.filter((l) => l.tipo === "entrada").reduce((s, l) => s + emC(l.valor), 0) / 100;
  const saiu = itens.filter((l) => l.tipo === "saida" && !anulado(l)).reduce((s, l) => s + emC(l.valor), 0) / 100;
  const trans = itens.filter((l) => l.tipo === "transferencia").reduce((s, l) => s + emC(l.valor), 0) / 100;

  return (
    <Painel titulo={titulo} sub={sub} onClose={onClose}>
      <div className="flex flex-wrap gap-4 mb-4">
        {saiu > 0 && <Resumo rot="Saiu" v={saiu} cor={C.out} />}
        {entrou > 0 && <Resumo rot="Entrou" v={entrou} cor={C.in} />}
        {trans > 0 && <Resumo rot="Movido" v={trans} cor={C.tr} />}
        <Resumo rot="Lançamentos" v={itens.length} cor={C.muted} cru />
      </div>
      {itens.length === 0 ? <Vazio>Nada neste recorte.</Vazio> : (
        <div className="space-y-2">
          {itens.slice().sort((a, b) => (b.pagamento || b.vencimento).localeCompare(a.pagamento || a.vencimento))
            .map((l) => (
              <Linha key={l.id} l={l} catOf={catOf} subOf={subOf} contaOf={contaOf} cartaoOf={cartaoOf}
                anulado={anulado} up={up} onOpen={() => { onClose(); abrir(l.id); }} />
            ))}
        </div>
      )}
    </Painel>
  );
}

/** Detalhe de um lançamento, com edição de todos os campos. */
function Detalhe({ l, d, onClose, catOf, subOf, contaOf, cartaoOf, up, upVarios, apagar, salvar, pagar, despagar, anulado, flash }) {
  const [edit, setEdit] = useState(false);
  const [f, setF] = useState(null);

  useEffect(() => { if (l) setF({ ...l, cents: Math.round(l.valor * 100) }); }, [l?.id]);
  if (!l || !f) return null;

  const contasUso = d.contas.filter((c) => c.tipo === "banco" || c.tipo === "fisico");
  const cat = l.catId ? catOf(l.catId) : null;
  const cartao = l.cartaoId ? cartaoOf(l.cartaoId) : null;
  const subs = f.catId ? (catOf(f.catId)?.subs || []) : [];
  const irmas = l.grupo ? d.lancamentos.filter((x) => x.grupo === l.grupo) : [];

  const salvarEdicao = () => {
    if (!f.cents) { flash("Digite um valor maior que zero"); return; }
    if (f.tipo === "transferencia" && f.contaId === f.destinoId) { flash("Escolha contas diferentes"); return; }
    const { cents, ...resto } = f;
    const limpo = { ...resto, valor: cents / 100,
      subId: subs.some((s) => s.id === f.subId) ? f.subId : undefined };

    // pediu para parcelar um lançamento que era único: vira várias parcelas
    if (!l.parcelas && (f.parcelas || 1) > 1) {
      apagar(l.id);
      salvar({ ...limpo, id: undefined, grupo: undefined, parcela: undefined });
      onClose();
      return;
    }
    up(l.id, limpo);
    setEdit(false);
    flash("Lançamento atualizado");
  };

  /* aplica o mesmo valor às demais parcelas ainda abertas */
  const aplicarNasAbertas = () => {
    const abertas = irmas.filter((x) => x.status === "pendente" && x.id !== l.id);
    if (!abertas.length) return;
    upVarios(abertas, { valor: f.cents / 100 });
    flash(`${abertas.length} parcelas atualizadas`);
  };

  const Campo = ({ rot, children }) => (
    <div className="py-2.5 flex items-baseline justify-between gap-4" style={{ borderTop: `1px solid ${C.line}` }}>
      <span style={{ color: C.muted }} className="text-sm shrink-0">{rot}</span>
      <span className="text-sm text-right min-w-0">{children}</span>
    </div>
  );
  const inp = { background: C.surface, borderColor: C.line, color: C.ink };

  return (
    <Painel titulo={l.nome} sub={`${l.tipo === "entrada" ? "Entrada" : l.tipo === "saida" ? "Saída" : "Transferência"} · ${brl(l.valor)}`}
      onClose={onClose}
      rodape={
        <div className="flex gap-2">
          {!edit && l.tipo !== "transferencia" && (l.status === "pendente"
            ? <button onClick={() => { pagar(l); onClose(); }} style={{ background: C.in }} className="flex-1 rounded-xl py-2.5 text-sm text-white font-medium">
                {l.tipo === "entrada" ? "Marcar recebido" : "Marcar pago"}</button>
            : <button onClick={() => { despagar(l.id); onClose(); }} style={{ background: C.surface, borderColor: C.line }} className="flex-1 rounded-xl border py-2.5 text-sm">
                Desfazer</button>)}
          {edit
            ? <>
                <button onClick={() => { setF({ ...l, cents: Math.round(l.valor * 100) }); setEdit(false); }} style={{ background: C.surface, borderColor: C.line }} className="flex-1 rounded-xl border py-2.5 text-sm">Cancelar</button>
                <button onClick={salvarEdicao} style={{ background: C.ink }} className="flex-1 rounded-xl py-2.5 text-sm text-white font-medium">Salvar</button>
              </>
            : <button onClick={() => setEdit(true)} style={{ background: C.surface, borderColor: C.line }} className="flex-1 rounded-xl border py-2.5 text-sm flex items-center justify-center gap-1.5"><Pencil size={15} /> Editar</button>}
          {!edit && (
            <BotaoConfirma onConfirm={() => { apagar(l.id); onClose(); }} pergunta="Apagar mesmo"
              titulo="Apagar lançamento" className="rounded-xl border px-3 py-2.5" estilo={{ borderColor: C.line }}>
              <Trash2 size={16} />
            </BotaoConfirma>
          )}
        </div>
      }>

      {edit ? (
        <div className="space-y-3">
          <div><Rotulo>Tipo</Rotulo>
            <div style={{ background: C.surface }} className="flex p-1 rounded-xl">
              {[["saida", "Saída", ArrowUpRight], ["entrada", "Entrada", ArrowDownLeft], ["transferencia", "Transferência", ArrowLeftRight]].map(([k, t, Ic]) => (
                <button key={k} onClick={() => setF({ ...f, tipo: k,
                    catId: k === "transferencia" ? null : (f.catId || d.categorias[0]?.id),
                    subId: undefined,
                    destinoId: k === "transferencia" ? (f.destinoId || d.contas.find((c) => c.id !== f.contaId)?.id) : undefined,
                    forma: k === "transferencia" ? "Pix" : f.forma,
                    cartaoId: k === "transferencia" ? undefined : f.cartaoId,
                    deQuem: k === "saida" ? f.deQuem : undefined })}
                  style={{ background: f.tipo === k ? C.bg : "transparent", color: f.tipo === k ? CORTIPO[k] : C.muted }}
                  className="flex-1 flex items-center justify-center gap-1.5 py-2 rounded-lg text-xs font-medium">
                  <Ic size={14} /> {t}</button>
              ))}
            </div>
          </div>

          <CampoDinheiro centavos={f.cents} onChange={(c) => setF({ ...f, cents: c })} cor={CORTIPO[f.tipo]} />

          <div><Rotulo>Descrição</Rotulo>
            <input value={f.nome} onChange={(e) => setF({ ...f, nome: e.target.value })} style={inp} className="w-full rounded-xl border px-3 py-2 text-sm outline-none" /></div>

          <div><Rotulo>{f.tipo === "transferencia" ? "Situação" : f.tipo === "entrada" ? "Recebimento" : "Pagamento"}</Rotulo>
            <div className="flex gap-2">
              {(f.tipo === "saida" ? [["pago", "Pago"], ["pendente", "Pendente"]]
                : f.tipo === "entrada" ? [["pago", "Recebido"], ["pendente", "A receber"]]
                : [["pago", "Já fiz"], ["pendente", "Planejada"]]).map(([k, t]) => (
                <button key={k} onClick={() => setF({ ...f, status: k, pagamento: k === "pago" ? (f.pagamento || f.vencimento) : null })}
                  style={{ background: f.status === k ? (k === "pago" ? CORTIPO[f.tipo] : C.due) : C.bg, color: f.status === k ? "#fff" : C.muted, borderColor: C.line }}
                  className="flex-1 rounded-xl border py-2 text-sm font-medium">{t}</button>
              ))}
            </div>
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div><Rotulo>Vencimento</Rotulo>
              <input type="date" value={f.vencimento} onChange={(e) => setF({ ...f, vencimento: e.target.value })} style={inp} className="w-full rounded-xl border px-3 py-2 text-sm outline-none" /></div>
            {f.status === "pago" && (
              <div><Rotulo>{f.tipo === "entrada" ? "Recebido em" : "Pago em"}</Rotulo>
                <input type="date" value={f.pagamento || ""} onChange={(e) => setF({ ...f, pagamento: e.target.value })} style={inp} className="w-full rounded-xl border px-3 py-2 text-sm outline-none" /></div>
            )}
          </div>

          {f.tipo !== "transferencia" && (
            <div className="grid grid-cols-2 gap-3">
              <div><Rotulo>Categoria</Rotulo>
                <select value={f.catId || ""} onChange={(e) => setF({ ...f, catId: e.target.value, subId: undefined })} style={inp} className="w-full rounded-xl border px-3 py-2 text-sm outline-none">
                  {d.categorias.map((c) => <option key={c.id} value={c.id}>{c.nome}</option>)}
                </select></div>
              <div><Rotulo>Subcategoria</Rotulo>
                <select value={f.subId || ""} onChange={(e) => setF({ ...f, subId: e.target.value || undefined })} style={inp} className="w-full rounded-xl border px-3 py-2 text-sm outline-none">
                  <option value="">—</option>
                  {subs.map((s) => <option key={s.id} value={s.id}>{s.nome}</option>)}
                </select></div>
            </div>
          )}

          {f.tipo !== "transferencia" && (
            <div><Rotulo>Forma de pagamento</Rotulo>
              <div className="flex flex-wrap gap-1.5">
                {FORMAS.map((x) => (
                  <button key={x} onClick={() => setF({ ...f, forma: x,
                      cartaoId: x === "Crédito" ? (f.cartaoId || d.cartoes[0]?.id) : undefined,
                      contaId: x === "Crédito" ? undefined : (f.contaId || contasUso[0]?.id) })}
                    style={{ background: f.forma === x ? C.ink : C.bg, color: f.forma === x ? "#fff" : C.muted, borderColor: C.line }}
                    className="rounded-lg border px-2.5 py-1.5 text-xs">{x}</button>
                ))}
              </div>
            </div>
          )}

          {f.forma === "Crédito" && f.tipo !== "transferencia" ? (
            <div><Rotulo>Cartão</Rotulo>
              <select value={f.cartaoId || ""} onChange={(e) => setF({ ...f, cartaoId: e.target.value, contaId: undefined })} style={inp} className="w-full rounded-xl border px-3 py-2 text-sm outline-none">
                {d.cartoes.map((c) => <option key={c.id} value={c.id}>{c.nome}{c.dono !== "eu" ? ` (de ${c.dono})` : ""}</option>)}
              </select></div>
          ) : (
            <div className="grid grid-cols-2 gap-3">
              <div><Rotulo>{f.tipo === "transferencia" ? "De" : "Conta"}</Rotulo>
                <select value={f.contaId || ""} onChange={(e) => setF({ ...f, contaId: e.target.value, cartaoId: undefined })} style={inp} className="w-full rounded-xl border px-3 py-2 text-sm outline-none">
                  {d.contas.map((c) => <option key={c.id} value={c.id}>{c.nome}</option>)}
                </select></div>
              {f.tipo === "transferencia" && (
                <div><Rotulo>Para</Rotulo>
                  <select value={f.destinoId || ""} onChange={(e) => setF({ ...f, destinoId: e.target.value })} style={inp} className="w-full rounded-xl border px-3 py-2 text-sm outline-none">
                    {d.contas.map((c) => <option key={c.id} value={c.id}>{c.nome}</option>)}
                  </select></div>
              )}
            </div>
          )}

          {f.tipo === "saida" && (
            <>
              <div><Rotulo>Este gasto é de outra pessoa?</Rotulo>
                <input value={f.deQuem || ""} onChange={(e) => setF({ ...f, deQuem: e.target.value.trim() || undefined, reembolso: e.target.value.trim() ? (f.reembolso === "recebido" ? "recebido" : "aguardando") : "nao" })}
                  placeholder="deixe vazio se for seu" style={inp} className="w-full rounded-xl border px-3 py-2 text-sm outline-none" /></div>
              {!f.deQuem && (
                <label className="flex items-center gap-2 text-sm">
                  <input type="checkbox" checked={f.reembolso === "aguardando" || f.reembolso === "recebido"}
                    onChange={(e) => setF({ ...f, reembolso: e.target.checked ? "aguardando" : "nao" })} /> Vou ser reembolsada
                </label>
              )}
            </>
          )}

          {irmas.length <= 1 && f.tipo !== "transferencia" && (
            <div><Rotulo>Parcelas</Rotulo>
              <div className="flex items-center gap-2">
                <input inputMode="numeric" value={f.parcelas || 1}
                  onChange={(e) => setF({ ...f, parcelas: Math.min(48, Math.max(1, parseInt(e.target.value.replace(/\D/g, ""), 10) || 1)) })}
                  style={{ ...inp, fontFamily: MONO }} className="w-20 rounded-xl border px-3 py-2 text-sm outline-none" />
                {(f.parcelas || 1) > 1 && (
                  <span style={{ color: C.due, fontFamily: MONO }} className="text-xs">
                    vira {f.parcelas}× de {brl(Math.floor(f.cents / f.parcelas) / 100)}
                  </span>
                )}
              </div>
              {(f.parcelas || 1) > 1 && (
                <p style={{ color: C.muted }} className="text-xs mt-1">
                  Ao salvar, este lançamento é substituído por {f.parcelas} parcelas mensais.
                </p>
              )}
            </div>
          )}

          <div><Rotulo>Observações</Rotulo>
            <textarea value={f.obs || ""} onChange={(e) => setF({ ...f, obs: e.target.value })} rows={2} style={inp} className="w-full rounded-xl border px-3 py-2 text-sm outline-none resize-none" /></div>

          {irmas.length > 1 && (
            <div style={{ background: C.due + "14" }} className="rounded-xl p-3">
              <p style={{ color: C.due }} className="text-xs mb-2">
                Esta é a parcela {l.parcela} de {l.parcelas}. A edição vale só para ela.
              </p>
              {irmas.some((x) => x.status === "pendente" && x.id !== l.id) && (
                <button onClick={aplicarNasAbertas} style={{ borderColor: C.due, color: C.due }}
                  className="w-full rounded-lg border py-1.5 text-xs">
                  Usar este valor nas parcelas ainda abertas
                </button>
              )}
            </div>
          )}
        </div>
      ) : (
        <div>
          <Campo rot="Valor"><span style={{ fontFamily: MONO, color: CORTIPO[l.tipo] }} className="font-semibold">{brl(l.valor)}</span></Campo>
          <Campo rot="Situação">
            {l.tipo === "transferencia"
              ? (l.status === "pago" ? "já feita" : "planejada")
              : l.status === "pago"
                ? (l.tipo === "entrada" ? `recebido em ${dm(l.pagamento)}` : `pago em ${dm(l.pagamento)}`)
                : (l.tipo === "entrada" ? "a receber" : "pendente")}
          </Campo>
          <Campo rot={l.status === "pago" ? "Previsto para" : "Vence em"}>{dm(l.vencimento)}</Campo>
          {cat && <Campo rot="Categoria">{cat.nome}{l.subId && subOf(l.catId, l.subId) ? ` · ${subOf(l.catId, l.subId).nome}` : ""}</Campo>}
          {l.forma && <Campo rot="Forma">{l.forma}</Campo>}
          {cartao && <Campo rot="Cartão">{cartao.nome}{cartao.dono !== "eu" ? ` (de ${cartao.dono})` : ""} · fecha {cartao.fecha}, vence {cartao.vence}</Campo>}
          {l.contaId && <Campo rot={l.tipo === "transferencia" ? "De" : "Conta"}>{contaOf(l.contaId)?.nome || "—"}</Campo>}
          {l.destinoId && <Campo rot="Para">{contaOf(l.destinoId)?.nome || "—"}</Campo>}
          {l.parcelas && <Campo rot="Parcela">{l.parcela} de {l.parcelas}</Campo>}
          {l.deQuem && <Campo rot="Gasto de">{l.deQuem}{l.reembolso === "recebido" ? " · já acertou" : " · a cobrar"}</Campo>}
          {!l.deQuem && l.reembolso && l.reembolso !== "nao" && (
            <Campo rot="Reembolso">{l.reembolso === "recebido" ? "recebido" : "a receber"}</Campo>
          )}
          {l.obs && <Campo rot="Observações">{l.obs}</Campo>}
          <Campo rot="Registrado em">
            {l.criadoEm
              ? new Date(l.criadoEm).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" })
              : <span style={{ color: C.muted }}>antes do app guardar isso</span>}
          </Campo>
          {l.editadoEm && (
            <Campo rot="Última alteração">
              {new Date(l.editadoEm).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" })}
            </Campo>
          )}

          {irmas.length > 1 && (
            <div className="mt-5">
              <Rotulo>As {irmas.length} parcelas</Rotulo>
              <div className="space-y-1">
                {irmas.slice().sort((a, b) => a.parcela - b.parcela).map((x) => (
                  <div key={x.id} style={{ background: x.id === l.id ? C.surface : "transparent", borderColor: C.line }}
                    className="flex items-center justify-between rounded-lg border px-3 py-1.5 text-xs">
                    <span style={{ color: C.muted }}>{x.parcela}/{x.parcelas} · {dm(x.vencimento)}</span>
                    <span className="flex items-center gap-2">
                      <span style={{ fontFamily: MONO }}>{brl(x.valor).replace("R$ ", "")}</span>
                      <Tag cor={x.status === "pago" ? C.in : C.due}>{x.status === "pago" ? "paga" : "aberta"}</Tag>
                    </span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      )}
    </Painel>
  );
}

/** Movimentações de uma conta: o que entrou e o que saiu dela. */
function MovimentosConta({ conta, d, onClose, saldoConta, contaOf, catOf, abrir }) {
  const caixinha = conta.tipo === "caixinha" || conta.tipo === "investimento";
  const movs = d.lancamentos
    .filter((l) => l.contaId === conta.id || l.destinoId === conta.id)
    .sort((a, b) => (b.pagamento || b.vencimento).localeCompare(a.pagamento || a.vencimento));

  const sinal = (l) => (l.destinoId === conta.id ? 1 : l.tipo === "entrada" ? 1 : -1);
  const entrou = movs.filter((l) => sinal(l) > 0 && l.status === "pago").reduce((s, l) => s + emC(l.valor), 0) / 100;
  const saiu = movs.filter((l) => sinal(l) < 0 && l.status === "pago").reduce((s, l) => s + emC(l.valor), 0) / 100;
  const planejado = movs.filter((l) => l.status !== "pago").reduce((s, l) => s + emC(l.valor) * sinal(l), 0) / 100;

  return (
    <Painel titulo={conta.nome} sub={conta.objetivo ? `Para ${conta.objetivo}` : undefined} onClose={onClose}>
      <div className="flex flex-wrap gap-4 mb-2">
        <Resumo rot="Tem hoje" v={saldoConta(conta.id)} cor={caixinha ? C.saved : C.ink} />
        <Resumo rot={caixinha ? "Já guardou" : "Entrou"} v={entrou} cor={C.in} />
        <Resumo rot={caixinha ? "Já resgatou" : "Saiu"} v={saiu} cor={C.out} />
        {planejado !== 0 && <Resumo rot="Planejado" v={planejado} cor={C.due} />}
      </div>
      {conta.saldoInicial ? (
        <p style={{ color: C.muted, fontFamily: MONO }} className="text-xs mb-4">
          {brl(conta.saldoInicial)} de partida + {brl(entrou)} − {brl(saiu)} = {brl(saldoConta(conta.id))}
        </p>
      ) : <div className="mb-4" />}

      {movs.length === 0 ? <Vazio>Nenhuma movimentação ainda.</Vazio> : (
        <div className="space-y-2">
          {movs.map((l) => {
            const s = sinal(l);
            const outra = l.tipo === "transferencia"
              ? contaOf(s > 0 ? l.contaId : l.destinoId)?.nome || "—"
              : catOf(l.catId)?.nome || "—";
            return (
              <div key={l.id} onClick={() => { onClose(); abrir(l.id); }} role="button" tabIndex={0}
                style={{ background: C.surface, borderColor: C.line }}
                className="rounded-xl border px-3 py-2.5 flex items-center gap-3 cursor-pointer">
                <span style={{ background: l.status === "pago" ? (s > 0 ? C.in : C.out) : C.due }} className="w-1.5 h-9 rounded-full shrink-0" />
                <div className="min-w-0 flex-1">
                  <div className="text-sm font-medium truncate flex items-center gap-1.5">
                    {l.nome}
                    {l.status !== "pago" && <Tag cor={C.due}>{l.tipo === "transferencia" ? "planejado" : "pendente"}</Tag>}
                  </div>
                  <div style={{ color: C.muted }} className="text-xs truncate">
                    {s > 0 ? "veio de" : "foi para"} {outra} · {dm(l.pagamento || l.vencimento)}
                  </div>
                </div>
                <span style={{ fontFamily: MONO, color: l.status === "pago" ? (s > 0 ? C.in : C.out) : C.due }}
                  className="text-sm font-semibold shrink-0">
                  {s > 0 ? "+" : "−"}{brl(l.valor).replace("R$ ", "")}
                </span>
              </div>
            );
          })}
        </div>
      )}
    </Painel>
  );
}

/** Botão de ação destrutiva com confirmação em dois toques.
    Não usa o confirm() do navegador, que fica bloqueado em alguns contextos
    e falha em silêncio — o toque parece não fazer nada. */
function BotaoConfirma({ onConfirm, children, pergunta = "Tem certeza?", cor = C.out, className = "", titulo, estilo }) {
  const [armado, setArmado] = useState(false);
  useEffect(() => {
    if (!armado) return;
    const t = setTimeout(() => setArmado(false), 4000);   // desarma sozinho
    return () => clearTimeout(t);
  }, [armado]);

  if (armado) {
    return (
      <span className="flex items-center gap-1.5">
        <button onClick={() => { setArmado(false); onConfirm(); }}
          style={{ background: cor, color: "#fff" }} className="rounded-lg px-2.5 py-1.5 text-xs font-medium whitespace-nowrap">
          {pergunta}
        </button>
        <button onClick={() => setArmado(false)} style={{ color: C.muted }} className="text-xs px-1">não</button>
      </span>
    );
  }
  return (
    <button onClick={() => setArmado(true)} title={titulo} aria-label={titulo}
      style={{ color: cor, ...estilo }} className={className}>{children}</button>
  );
}

/* =========================================================== componentes */
const Rotulo = ({ children }) => <div style={{ color: C.muted }} className="text-xs uppercase tracking-wider mb-2">{children}</div>;

const Chip = ({ ativo, cor, children, onClick }) => (
  <button onClick={onClick} style={{ background: ativo ? cor : C.bg, color: ativo ? "#fff" : C.ink, borderColor: ativo ? cor : C.line }}
    className="rounded-full border px-3 py-1.5 text-xs font-medium">{children}</button>
);

const Vazio = ({ children }) => <p style={{ color: C.muted }} className="text-sm py-4">{children}</p>;

const Tag = ({ cor, children }) => (
  <span style={{ background: cor + "1A", color: cor }} className="rounded-full px-1.5 py-0.5 text-xs font-medium">{children}</span>
);

function Linha({ l, catOf, subOf, contaOf, cartaoOf, anulado, up, onPay, onUndo, onDel, onOpen, plano }) {
  const cat = l.catId ? catOf(l.catId) : { nome: "Transferência", cor: C.tr };
  const sub = l.catId && l.subId ? subOf(l.catId, l.subId) : null;
  const via = l.cartaoId
    ? `${cartaoOf(l.cartaoId)?.nome || "cartão"}`
    : l.tipo === "transferencia"
      ? `${contaOf(l.contaId)?.nome || "?"} → ${contaOf(l.destinoId)?.nome || "?"}`
      : contaOf(l.contaId)?.nome || "—";
  const cor = CORTIPO[l.tipo] || C.ink;
  const pagoAdiantado = l.status === "pago" && l.pagamento && ym(l.pagamento) < ym(l.vencimento);

  return (
    <div style={{ background: C.surface, borderColor: C.line }} className="rounded-xl border px-3 py-2.5 flex items-center gap-3">
      <span style={{ background: anulado(l) ? C.line : cat.cor }} className="w-1.5 h-9 rounded-full shrink-0" />
      <div className={"min-w-0 flex-1" + (onOpen ? " cursor-pointer" : "")}
        onClick={onOpen} role={onOpen ? "button" : undefined} tabIndex={onOpen ? 0 : undefined}
        onKeyDown={onOpen ? (e) => (e.key === "Enter" || e.key === " ") && (e.preventDefault(), onOpen()) : undefined}>
        <div className="text-sm font-medium truncate flex items-center gap-1.5">
          <span className="truncate" style={{ color: anulado(l) ? C.muted : C.ink }}>{l.nome}</span>
          {l.parcelas && <span style={{ color: C.muted }} className="font-normal shrink-0">{l.parcela}/{l.parcelas}</span>}
          {l.conferir && l.status === "pendente" && <Tag cor={C.due}>conferir</Tag>}
          {pagoAdiantado && <Tag cor={C.in}>paga em {mesLabel(ym(l.pagamento))}</Tag>}
          {l.deQuem && <Tag cor={C.tr}>gasto de {l.deQuem}</Tag>}
          {!l.deQuem && l.reembolso === "aguardando" && <Tag cor={C.tr}>a reembolsar</Tag>}
          {!l.deQuem && l.reembolso === "recebido" && <Tag cor={C.in}>reembolsada</Tag>}
          {l.deQuem && l.reembolso === "recebido" && <Tag cor={C.in}>acertado</Tag>}
        </div>
        <div style={{ color: C.muted }} className="text-xs truncate">
          {cat.nome}{sub ? ` · ${sub.nome}` : ""} · {l.forma ? `${l.forma} · ` : ""}{via} · {plano || !l.pagamento ? `vence ${dm(l.vencimento)}` : dm(l.pagamento)}
          {l.obs ? ` · ${l.obs}` : ""}
        </div>
      </div>
      <span style={{ fontFamily: MONO, color: anulado(l) ? C.muted : cor }} className="text-sm font-semibold shrink-0">
        {l.tipo === "entrada" ? "+" : l.tipo === "saida" ? "−" : "↔"}{brl(l.valor).replace("R$ ", "")}
      </span>
      {l.reembolso === "aguardando" && (
        <button onClick={() => up(l.id, { reembolso: "recebido" })} title={l.deQuem ? `${l.deQuem} me pagou` : "Marcar reembolso recebido"} style={{ borderColor: C.line, color: C.tr }} className="rounded-lg border p-1.5 shrink-0"><RotateCcw size={14} /></button>
      )}
      {onPay && <button onClick={onPay} title="Marcar como pago" style={{ borderColor: C.line, color: C.in }} className="rounded-lg border p-1.5 shrink-0"><Check size={14} /></button>}
      {onUndo && <button onClick={onUndo} title="Desfazer pagamento" style={{ borderColor: C.line, color: C.muted }} className="rounded-lg border p-1.5 shrink-0"><RotateCcw size={14} /></button>}
      {onDel && (
        <BotaoConfirma onConfirm={onDel} pergunta="Apagar" cor={C.muted} titulo="Apagar" className="p-1 shrink-0">
          <Trash2 size={14} />
        </BotaoConfirma>
      )}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("raiz")).render(<App />);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>
